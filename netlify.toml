[build]
  command = "npm run pretest:production && node --test --test-name-pattern='PWA v151 compatibility' tests/studio-production-sync-v151.test.mjs && mkdir -p dist && printf '<!doctype html><title>v151 PWA compatibility passed</title><p>v151 PWA compatibility passed</p>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"