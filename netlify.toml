[build]
  command = "bash -lc 'set +e; npm run test:production > v216-debug.log 2>&1; code=$?; mkdir -p dist; cp v216-debug.log dist/v216-debug.txt; printf \"<!doctype html><meta charset=utf-8><title>v216 diagnostic</title><pre>test exit: %s</pre>\" \"$code\" > dist/index.html; exit 0'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
