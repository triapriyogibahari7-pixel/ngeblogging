[build]
  command = "set -e; settings=$(curl -fsSL --max-time 20 https://ngeblogging.com/api/auth-proxy/auth/v1/settings); printf '%s' \"$settings\" | grep -Eq '\"google\"[[:space:]]*:[[:space:]]*true'; printf '%s' \"$settings\" | grep -Eq '\"linkedin_oidc\"[[:space:]]*:[[:space:]]*true'; printf '%s' \"$settings\" | grep -Eq '\"email\"|\"mailer_autoconfirm\"|\"disable_signup\"'; mkdir -p dist; printf '<!doctype html><title>Google LinkedIn email providers verified</title>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
