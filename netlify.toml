[build]
  command = "set -e; challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM; callback=https%3A%2F%2Fngeblogging.com%2F%3Fauth%3Dcallback; google_code=$(curl -sS -D /tmp/google.headers -o /tmp/google.body -w '%{http_code}' --max-time 20 'https://ngeblogging.com/api/auth-proxy/auth/v1/authorize?provider=google&redirect_to='\"$callback\"'&code_challenge='\"$challenge\"'&code_challenge_method=s256'); linkedin_code=$(curl -sS -D /tmp/linkedin.headers -o /tmp/linkedin.body -w '%{http_code}' --max-time 20 'https://ngeblogging.com/api/auth-proxy/auth/v1/authorize?provider=linkedin_oidc&redirect_to='\"$callback\"'&code_challenge='\"$challenge\"'&code_challenge_method=s256'); email_code=$(curl -sS -D /tmp/email.headers -o /tmp/email.body -w '%{http_code}' --max-time 20 -X POST 'https://ngeblogging.com/api/auth-proxy/auth/v1/token?grant_type=password' -H 'Origin: https://ngeblogging.com' -H 'apikey: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' -H 'Content-Type: application/json' -H 'x-client-info: ngeblogging-live-auth-check-v153' --data '{\"email\":\"ngeblogging-login-probe@example.invalid\",\"password\":\"not-a-real-password\"}'); test \"$google_code\" = 302; test \"$linkedin_code\" = 302; grep -Eqi '^location: .*accounts\\.google\\.' /tmp/google.headers; grep -Eqi '^location: .*linkedin\\.com' /tmp/linkedin.headers; grep -qi '2026.07.30-auth-gateway-v153' /tmp/google.headers; grep -qi '2026.07.30-auth-gateway-v153' /tmp/linkedin.headers; grep -qi '2026.07.30-auth-gateway-v153' /tmp/email.headers; test \"$email_code\" = 400; grep -Eqi 'invalid|credential|email|password' /tmp/email.body; mkdir -p dist; printf '<!doctype html><title>OAuth and email login endpoints verified</title>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
