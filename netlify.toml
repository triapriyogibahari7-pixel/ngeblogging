[build]
  command = "bash -lc 'set -e; printf \"[build]\\n  command = \\\"npm run build\\\"\\n  publish = \\\"dist\\\"\\n\\n[build.environment]\\n  NODE_VERSION = \\\"22\\\"\\n\" > netlify.toml; npm run test:production; mkdir -p dist; printf \"<!doctype html><meta charset=utf-8><title>full production regression passed</title>\" > dist/index.html'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
