[build]
  # Netlify deploy preview only needs the browser bundle. Production regression,
  # Wrangler dry-run and Cloudflare route validation remain owned by the
  # production workflow; coupling them here made every UI preview fail before
  # we could distinguish a frontend regression from an infrastructure gate.
  command = "node scripts/patch-service-worker-v288.mjs && npx vite build && node scripts/write-netlify-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
