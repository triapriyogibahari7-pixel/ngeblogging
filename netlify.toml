[build]
  command = "npm run pretest:production && node --test --test-name-pattern='responsive modes|auth surfaces remain' tests/studio-production-sync-v151.test.mjs && mkdir -p dist && printf '<!doctype html><title>v151 UI auth sync passed</title><p>v151 UI auth sync passed</p>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"