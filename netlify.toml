[build]
  command = "npm run pretest:production && node --test tests/studio-interface-v147.test.mjs tests/studio-interface-v148.test.mjs tests/studio-interface-v149.test.mjs tests/studio-recovery-v150.test.mjs tests/studio-completion-v151.test.mjs tests/studio-continuity-v152.test.mjs && mkdir -p dist && printf '<!doctype html><title>v147-v152 excluding sync passed</title><p>v147-v152 excluding sync passed</p>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"