[build]
  command = "grep -q 'npm run verify:v192' .github/workflows/cloudflare-token-diagnostic.yml && grep -q '/release-v192.json' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'studio-data-bootstrap-v192-20260801' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'membershipQueryIsCriticalPath' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'dataGatewayTimeoutFallsBackDirect' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'PRODUCTION_STUDIO_V192_VERIFIED' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'Ngeblogging production Studio v192' .github/workflows/cloudflare-token-diagnostic.yml && grep -q 'WHITE-R4-2026.07.12' .github/workflows/cloudflare-token-diagnostic.yml && mkdir -p dist && printf 'v192 workflow markers passed' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
