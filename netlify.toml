[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "node --test --test-name-pattern='production system routes|all active Wrangler|Netlify production' tests/production-entry-v154.test.mjs && npx vite build && node scripts/write-netlify-redirects.mjs"
