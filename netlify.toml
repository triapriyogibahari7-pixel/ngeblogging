[build]
  command = "set -e; release=$(curl -fsSL --max-time 20 https://ngeblogging.com/release-v153.json); home=$(curl -fsSL --max-time 20 https://ngeblogging.com/); health=$(curl -fsSL --max-time 20 https://ngeblogging.com/api/health); auth=$(curl -fsSI --max-time 20 -X OPTIONS https://ngeblogging.com/api/auth-proxy/auth/v1/token?grant_type=password -H 'Origin: https://ngeblogging.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: apikey,content-type,x-client-info'); printf '%s' \"$release\" | grep -q '2026.07.30-auth-production-v153'; printf '%s' \"$home\" | grep -q 'ngeblogging-auth-session-runtime'; ! printf '%s' \"$home\" | grep -q 'WHITE-R4-2026.07.12'; printf '%s' \"$health\" | grep -q '2026.07.30-auth-gateway-v153'; printf '%s' \"$auth\" | grep -qi '2026.07.30-auth-gateway-v153'; mkdir -p dist; printf '<!doctype html><title>production auth v153 verified</title>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
