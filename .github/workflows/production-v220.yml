name: Ngeblogging v222 compatibility check (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-v222-compat-manual
  cancel-in-progress: true

jobs:
  verify-v222-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Apply current production patch chain
        run: node scripts/patch-service-worker-v179.mjs

      - name: Verify historical v222 contracts only
        run: node --test tests/studio-production-v222.test.mjs

      - name: Confirm v225 remains final authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'patch-production-v225.mjs' scripts/patch-service-worker-v179.mjs
          grep -q 'studio-production-v225-20260803' public/release-v225.json

# This historical workflow intentionally has no push trigger and no deployment.
# v225 is the only production route/deploy authority. The full v222 deployment
# implementation remains available in Git history if historical diagnosis is needed.
