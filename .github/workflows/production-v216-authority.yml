name: Ngeblogging production v216 authority

on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  probe-v216:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub Actions runner
        run: echo "V216_GITHUB_ACTIONS_RUNNER_OK"
