name: Detach triapriyogi.com now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/detach-triapriyogi-now.yml

permissions:
  contents: read
  statuses: write

jobs:
  detach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
      TARGET_DOMAIN: triapriyogi.com
    steps:
      - name: Find authoritative account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo 'Token domain tidak tersedia'; exit 1; }
          curl -sS --fail-with-body \
            -H "authorization: Bearer ${CLOUDFLARE_DOMAIN_API_TOKEN}" \
            -H 'accept: application/json' \
            'https://api.cloudflare.com/client/v4/zones?name=ngeblogging.com&status=active&per_page=10' \
            -o /tmp/authority.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/authority.json', 'utf8'));
          const zones = (payload.result || []).filter((zone) => zone?.name === 'ngeblogging.com' && zone?.status === 'active');
          if (payload.success !== true || zones.length !== 1) throw new Error(`Zone otoritatif tidak unik: ${zones.length}`);
          const accountId = String(zones[0]?.account?.id || '');
          if (!/^[0-9a-f]{32}$/i.test(accountId)) throw new Error('Account ID tidak valid.');
          fs.appendFileSync(process.env.GITHUB_ENV, `RESOLVED_ACCOUNT_ID=${accountId}\n`);
          NODE

      - name: Delete full-zone triapriyogi.com
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/detach-triapriyogi
          curl -sS \
            -H "authorization: Bearer ${CLOUDFLARE_DOMAIN_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${TARGET_DOMAIN}&account.id=${RESOLVED_ACCOUNT_ID}&per_page=50" \
            -o /tmp/detach-triapriyogi/lookup.json
          zone_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/detach-triapriyogi/lookup.json', 'utf8'));
          const match = payload.success === true ? (payload.result || []).find((zone) => zone?.name === process.env.TARGET_DOMAIN) : null;
          process.stdout.write(String(match?.id || ''));
          NODE
          )"
          if [[ -z "${zone_id}" ]]; then
            echo 'Zone sudah tidak ada; pelepasan dianggap selesai.'
            printf '{"hostname":"%s","zoneDeleted":false,"zoneAlreadyGone":true}\n' "${TARGET_DOMAIN}" > /tmp/detach-triapriyogi/result.json
            exit 0
          fi
          [[ "${zone_id}" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Zone ID tidak valid'; exit 1; }
          code="$(curl -sS -o /tmp/detach-triapriyogi/delete.json -w '%{http_code}' \
            -X DELETE \
            -H "authorization: Bearer ${CLOUDFLARE_DOMAIN_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}")"
          DELETE_CODE="${code}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/detach-triapriyogi/delete.json', 'utf8'));
          if (Number(process.env.DELETE_CODE) !== 200 || payload.success !== true) {
            throw new Error(`Cloudflare gagal menghapus zone: ${(payload.errors || []).map((item) => item?.message).filter(Boolean).join(' | ') || `HTTP ${process.env.DELETE_CODE}`}`);
          }
          fs.writeFileSync('/tmp/detach-triapriyogi/result.json', `${JSON.stringify({ hostname:process.env.TARGET_DOMAIN, zoneDeleted:true, zoneAlreadyGone:false, deletedAt:new Date().toISOString() }, null, 2)}\n`);
          console.log('Zone triapriyogi.com berhasil dihapus dari Cloudflare.');
          NODE

      - name: Mark detach status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            let result = {};
            try { result = JSON.parse(fs.readFileSync('/tmp/detach-triapriyogi/result.json', 'utf8')); } catch {}
            const ok = result.hostname === 'triapriyogi.com' && (result.zoneDeleted === true || result.zoneAlreadyGone === true);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Triapriyogi detach',
              description: ok ? 'triapriyogi.com telah dilepaskan dari zone Cloudflare.' : 'Pelepasan triapriyogi.com belum selesai.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload detach evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detach-triapriyogi-${{ github.run_id }}
          path: /tmp/detach-triapriyogi
          if-no-files-found: warn
          retention-days: 3
