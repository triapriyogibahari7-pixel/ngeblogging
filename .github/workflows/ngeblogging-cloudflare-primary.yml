name: Ngeblogging Cloudflare primary production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-cloudflare-primary
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build application
        run: npm run build
      - name: Build active-zone Wrangler config
        run: node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
      - name: Deploy primary Cloudflare Worker
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://ngeblogging.com/?deploy_audit=$(date +%s)" -o /tmp/ngeblogging.html
          grep -qi "ngeblogging" /tmp/ngeblogging.html
