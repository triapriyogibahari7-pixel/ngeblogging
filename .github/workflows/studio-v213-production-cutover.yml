name: Ngeblogging Studio v213 production deploy and cutover

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# v213 remains the historical workflow identity for regression compatibility.
# The current gate also requires v214 UI and v215 auth markers before production
# is considered verified. Multiple production pushes collapse to the newest commit.
concurrency:
  group: ngeblogging-production-studio-v213
  cancel-in-progress: true

jobs:
  deploy-v213:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout production v213
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare production credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Run v212 and v213 regression contracts
        id: regression
        run: npm run verify:v213

      - name: Build complete production application
        id: build
        run: npm run build

      - name: Build active-zone Wrangler configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v213

      - name: Deploy v213 Worker and assets
        id: deploy
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Verify v213 on Workers.dev before mutating apex routes
        id: worker_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            v213_file="/tmp/workers-v213-precutover.json"
            v213_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${v213_file}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v213.json?verify_v215=${stamp}" || true)"
            [[ "${v213_code}" == 200 ]] || ok=false
            if [[ "${v213_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v213-20260802"||x.repairs?.smallLayoutMainContentFullWidth!==true||x.repairs?.analyticsBrowserFamilyCollectedForNewEvents!==true||x.repairs?.historicBrowserValuesInvented!==false||x.validation?.fakeAnalytics!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${v213_file}" || ok=false
            fi

            v214_file="/tmp/workers-v214-precutover.json"
            v214_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${v214_file}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v214.json?verify_v215=${stamp}" || true)"
            [[ "${v214_code}" == 200 ]] || ok=false
            if [[ "${v214_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v214-20260802"||x.preserved?.themeCount!==100||x.preserved?.widgetCount!==26||x.repairs?.themeLargeCodePreviewSplitFiftyFifty!==true||x.repairs?.themeSmallPreviewAboveCode!==true||x.repairs?.naraSmallMediumNonModal!==true||x.validation?.fakeAnalytics!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${v214_file}" || ok=false
            fi

            v215_file="/tmp/workers-v215-precutover.json"
            v215_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${v215_file}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v215.json?verify_v215=${stamp}" || true)"
            [[ "${v215_code}" == 200 ]] || ok=false
            if [[ "${v215_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="auth-late-callback-recovery-v215-20260802"||x.repair?.v162SingleFlightPreserved!==true||x.repair?.verifiedSessionWinsOverExpiredDuplicateCallback!==true||x.repair?.persistSession!==true||x.repair?.autoRefreshToken!==true||x.claims?.allProvidersProven!==false||x.claims?.massLoginCapacityProven!==false)process.exit(1)' "${v215_file}" || ok=false
            fi

            if grep -q 'WHITE-R4-2026.07.12' "${v213_file}" "${v214_file}" "${v215_file}" 2>/dev/null; then ok=false; fi
            if [[ "${ok}" == true ]]; then
              echo "WORKERS_DEV_V213_V214_V215_VERIFIED"
              exit 0
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V213_VERIFY_FAILED"
          exit 1

      - name: Preserve compatibility routing
        id: compatibility
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Cut over apex www and tenant wildcard to current Worker
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify v213 live on apex auth Studio tenant and Workers.dev
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-v215-${attempt}-${safe_name}.html"
              headers="/tmp/ngeblogging-v215-${attempt}-${safe_name}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v215=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              grep -q 'id="root"' "${output}" || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then ok=false; fi
            done

            release_file="/tmp/ngeblogging-v213-${attempt}-release.json"
            release_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${release_file}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/release-v213.json?verify_v215=${stamp}" || true)"
            [[ "${release_code}" == 200 ]] || ok=false
            if [[ "${release_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v213-20260802"||x.preserved?.themeCount!==100||x.preserved?.widgetCount!==26||x.preserved?.postPageWordLimit!==5000||x.repairs?.smallLayoutMainContentFullWidth!==true||x.repairs?.analyticsBrowserFamilyCollectedForNewEvents!==true||x.repairs?.historicBrowserValuesInvented!==false||x.validation?.fakeAnalytics!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${release_file}" || ok=false
            fi

            release214_file="/tmp/ngeblogging-v214-${attempt}-release.json"
            release214_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${release214_file}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/release-v214.json?verify_v215=${stamp}" || true)"
            [[ "${release214_code}" == 200 ]] || ok=false
            if [[ "${release214_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v214-20260802"||x.preserved?.themeCount!==100||x.preserved?.widgetCount!==26||x.repairs?.themeLargeCodePreviewSplitFiftyFifty!==true||x.repairs?.themeSmallPreviewAboveCode!==true||x.repairs?.naraSmallMediumNonModal!==true||x.repairs?.domainSmallActionsHorizontalFullWidth!==true||x.validation?.fakeAnalytics!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${release214_file}" || ok=false
            fi

            release215_file="/tmp/ngeblogging-v215-${attempt}-release.json"
            release215_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${release215_file}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/release-v215.json?verify_v215=${stamp}" || true)"
            [[ "${release215_code}" == 200 ]] || ok=false
            if [[ "${release215_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="auth-late-callback-recovery-v215-20260802"||x.evidence?.googlePkceProductionLoginObserved!==true||x.repair?.v162SingleFlightPreserved!==true||x.repair?.verifiedSessionWinsOverExpiredDuplicateCallback!==true||x.repair?.persistSession!==true||x.repair?.autoRefreshToken!==true||x.claims?.allProvidersProven!==false||x.claims?.massLoginCapacityProven!==false)process.exit(1)' "${release215_file}" || ok=false
            fi

            if grep -q 'WHITE-R4-2026.07.12' "${release_file}" "${release214_file}" "${release215_file}" 2>/dev/null; then ok=false; fi

            worker_file="/tmp/workers-v213-${attempt}.json"
            worker_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${worker_file}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v215.json?verify_v215=${stamp}" || true)"
            [[ "${worker_code}" == 200 ]] || ok=false
            if [[ "${worker_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="auth-late-callback-recovery-v215-20260802")process.exit(1)' "${worker_file}" || ok=false
            fi

            tenant_file="/tmp/tenant-v213-${attempt}.html"
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${tenant_file}" -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v215=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false
            if grep -q 'WHITE-R4-2026.07.12' "${tenant_file}"; then ok=false; fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_STUDIO_V213_V214_V215_VERIFIED"
              exit 0
            fi
            sleep 10
          done

          echo "PRODUCTION_STUDIO_V213_VERIFY_FAILED"
          exit 1

      - name: Publish v213 production status
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WORKER_VERIFY_OUTCOME: ${{ steps.worker_verify.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              credentials: process.env.CREDENTIALS_OUTCOME || 'not-run',
              regression: process.env.REGRESSION_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.CONFIG_OUTCOME || 'not-run',
              deploy: process.env.DEPLOY_OUTCOME || 'not-run',
              workerVerify: process.env.WORKER_VERIFY_OUTCOME || 'not-run',
              compatibility: process.env.COMPATIBILITY_OUTCOME || 'not-run',
              cutover: process.env.CUTOVER_OUTCOME || 'not-run',
              verify: process.env.VERIFY_OUTCOME || 'not-run',
            };
            const ready = Object.values(outcomes).every((value) => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production Studio v213',
              description: `v215 build=${outcomes.build}; worker=${outcomes.workerVerify}; cutover=${outcomes.cutover}; verify=${outcomes.verify}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
