name: Snapshot live v9

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture current live markers
        shell: bash
        run: |
          node --input-type=module <<'NODE' > live-v9.json
          const site='https://ngeblogging.com',stamp=`snapshot=${Date.now()}`;
          const get=async(url,options={})=>{const response=await fetch(`${url}${url.includes('?')?'&':'?'}${stamp}`,{...options,headers:{'cache-control':'no-cache',...(options.headers||{})}});return{status:response.status,ok:response.ok,text:await response.text()}};
          const renderedClassCount=(source,className)=>{const escaped=className.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return(source.match(new RegExp(`className:(?:\\\`|"|')${escaped}(?:\\\`|"|')`,'g'))||[]).length};
          const [healthResult,swResult,htmlResult]=await Promise.all([get(`${site}/api/health`),get(`${site}/sw.js`),get(`${site}/`)]);
          let health={};try{health=JSON.parse(healthResult.text||'{}')}catch{}
          const queue=[...htmlResult.text.matchAll(/(?:src|href)="([^"]+\.(?:js|css)(?:\?[^\"]*)?)"/g)].map(m=>new URL(m[1],site).href),seen=new Set(),assets=new Map();
          for(let depth=0;depth<7;depth++){const batch=[...new Set(queue)].filter(url=>!seen.has(url));if(!batch.length)break;batch.forEach(url=>seen.add(url));await Promise.all(batch.map(async url=>{const result=await get(url);assets.set(url,result.text);for(const match of result.text.matchAll(/(?:^|["'(])\/?(assets\/[A-Za-z0-9._-]+\.(?:js|css))/g))queue.push(new URL(`/${match[1]}`,site).href)}))}
          const studioEntry=[...assets.entries()].find(([url])=>/\/assets\/Studio-[^/]+\.js(?:\?|$)/.test(url));const studioJs=studioEntry?.[1]||'',allAssets=[...assets.values()].join('\n');
          const navStart=studioJs.indexOf('Ringkasan'),navEndCandidate=navStart>=0?studioJs.indexOf('sn-main',navStart):-1,navEnd=navEndCandidate>navStart?navEndCandidate:Math.min(studioJs.length,navStart+12000),navSegment=navStart>=0?studioJs.slice(navStart,navEnd):'';
          const errors=[];
          for(const className of ['sn-mobile-nav','sn-mobile-sheet-layer','sn-side-bottom'])if(renderedClassCount(studioJs,className)!==0)errors.push(`rendered:${className}`);
          if(renderedClassCount(studioJs,'sn-icon')!==1)errors.push(`toggle:${renderedClassCount(studioJs,'sn-icon')}`);
          for(const text of ['Ringkasan','Posts','Pages','Tema','Media','Nara AI','Analitik','Anggota','Domain','Pengaturan','Keluar'])if(!navSegment.includes(text))errors.push(`nav:${text}`);
          if(navSegment.includes('Pembayaran'))errors.push('nav:Pembayaran');
          const nara=await get(`${site}/api/nara`,{method:'POST',headers:{'content-type':'application/json',origin:site},body:JSON.stringify({message:'uji koneksi',model:'nara-mini',intelligence:'standard',attachments:[],history:[]})});let payload={};try{payload=JSON.parse(nara.text||'{}')}catch{}
          const result={health,swFirstLine:swResult.text.split('\n')[0],studioUrl:studioEntry?.[0]||null,assetCount:assets.size,renderedClasses:{mobileNav:renderedClassCount(studioJs,'sn-mobile-nav'),sheet:renderedClassCount(studioJs,'sn-mobile-sheet-layer'),sideBottom:renderedClassCount(studioJs,'sn-side-bottom'),toggle:renderedClassCount(studioJs,'sn-icon')},nav:{start:navStart,length:navSegment.length,labels:Object.fromEntries(['Ringkasan','Posts','Pages','Tema','Media','Nara AI','Analitik','Anggota','Domain','Pengaturan','Keluar','Pembayaran'].map(x=>[x,navSegment.includes(x)]))},required:Object.fromEntries(['Lihat situs','SUBDOMAIN GRATIS','.ngeblogging.com'].map(x=>[x,studioJs.includes(x)])),assets:Object.fromEntries(['naraBillingReady','naraImageReady','tn-widget-summary','ng-widget-recent-posts','ng-widget-popular-posts','Mobile','Tablet','Laptop','Komputer'].map(x=>[x,allAssets.includes(x)])),nara:{status:nara.status,payload},errors};
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-v9-snapshot
          path: live-v9.json
          retention-days: 1
