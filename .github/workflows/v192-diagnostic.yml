name: v192 temporary diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run chain through v188
        env:
          V189_DIAGNOSTIC_SKIP: '1'
        run: node scripts/patch-service-worker-v179.mjs
