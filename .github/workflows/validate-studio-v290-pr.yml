name: Validate Studio v290 PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-v290-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate production build
        run: npm run build
      - name: Assert v290 bundle markers
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -R -q 'studio-native-controls-v290-20260805' dist/assets
          grep -R -q 'auth-studio-handoff-v290-20260805' dist/assets
