name: Ngeblogging production v228 live authority

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-v228
  cancel-in-progress: false

jobs:
  deploy-v228:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Cloudflare zone when repository variable is missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          if [[ ! "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            response="$(curl -fsS --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=${CLOUDFLARE_ZONE_NAME}&status=active&per_page=1")"
            zone="$(printf '%s' "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x?.result?.[0]?.id||"")})')"
            [[ "${zone}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_RESOLVE_FAILED"; exit 1; }
            echo "CLOUDFLARE_ZONE_ID=${zone}" >> "${GITHUB_ENV}"
          fi

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Apply full authority chain and focused v228 regression
        run: |
          node scripts/patch-service-worker-v179.mjs
          node --test tests/studio-production-v228.test.mjs
          npm run test:production

      - name: Build production application
        run: npm run build

      - name: Assert v224 v226 v227 and v228 contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/release-v224.json dist/release-v225.json dist/release-v226.json dist/release-v227.json dist/release-v228.json; do test -f "$file"; done
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('dist/release-v224.json','utf8'));
          const g=JSON.parse(fs.readFileSync('dist/release-v226.json','utf8'));
          const n=JSON.parse(fs.readFileSync('dist/release-v227.json','utf8'));
          const v=JSON.parse(fs.readFileSync('dist/release-v228.json','utf8'));
          if(a.release!=='data-reauth-v224-20260803'||a.repairs?.data401403SingleflightRefresh!==true||a.repairs?.dataRetryUsesFreshAccessToken!==true)process.exit(1);
          if(g.release!=='studio-production-v226-native-green-layout-20260803'||g.themeLayout?.nativeReactMap!==true||g.themeLayout?.fourLeftSlots!==true||g.themeLayout?.fourRightSlots!==true||g.themeLayout?.postPageCenter!==true||g.widgets?.count!==26||g.themeCatalog?.builtInThemes!==100)process.exit(1);
          if(n.release!=='nara-fallback-model-contract-v227-20260803'||n.nara?.workersAiFallbackHonorsModel!==true||n.nara?.workersAiFallbackHonorsIntelligence!==true)process.exit(1);
          if(v.release!=='studio-production-v228-green-editor-nara-20260803'||v.responsive?.desktopSiteOnPhysicalPhoneLocksLarge!==true||v.theme?.builtInThemesRequired!==100||v.theme?.widgetCountRequired!==26||v.theme?.nativeGreenMapPreserved!==true||v.theme?.semanticSmallMap!==true||v.codeEditor?.actualLineNumbers!==true||v.codeEditor?.maxSupportedLines!==10000||v.codeEditor?.smallPreviewAboveCode!==true||v.codeEditor?.largeCodeLeftPreviewRight!==true||v.nara?.cameraPhotoFile!==true||v.nara?.smallMediumNonModal!==true||v.authentication?.v224SingleFlightDataReauthPreserved!==true||v.claims?.massCapacityClaimed!==false)process.exit(1);
          NODE
          grep -R -q 'studio-production-v228-green-editor-nara-20260803' dist
          grep -R -q 'ngeblogging-app-v228-green-editor-nara-20260803' dist
          grep -R -q 'green-editor-nara-cache-v228' dist

      - name: Build active-zone Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v228

      - name: Deploy Worker and current assets
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Verify v228 on Workers.dev before route cutover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            body=/tmp/v228-workers.json
            headers=/tmp/v228-workers.headers
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${body}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v228.json?v228=${stamp}" || true)"
            if [[ "${code}" == "200" ]] && ! grep -q 'WHITE-R4-2026.07.12' "${body}" "${headers}"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v228-green-editor-nara-20260803"||x.responsive?.desktopSiteOnPhysicalPhoneLocksLarge!==true||x.theme?.nativeGreenMapPreserved!==true||x.codeEditor?.actualLineNumbers!==true||x.nara?.cameraPhotoFile!==true||x.authentication?.v224SingleFlightDataReauthPreserved!==true)process.exit(1)' "${body}"; then
                echo "WORKERS_DEV_V228_VERIFIED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V228_VERIFY_FAILED"
          exit 1

      - name: Install authoritative apex www and tenant routes
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify live apex auth Studio tenant and v228 authority
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true
            for path in / /login /signup /studio /release-v224.json /release-v226.json /release-v227.json /release-v228.json; do
              safe="$(printf '%s' "${path}" | tr '/.' '__')"
              body="/tmp/v228-apex-${safe}.out"
              headers="/tmp/v228-apex-${safe}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${body}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?v228=${stamp}" || true)"
              [[ "${code}" == "200" ]] || ok=false
              grep -q 'WHITE-R4-2026.07.12' "${body}" "${headers}" && ok=false || true
              if [[ "${path}" == "/release-v228.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v228-green-editor-nara-20260803"||x.responsive?.desktopSiteOnPhysicalPhoneLocksLarge!==true||x.theme?.nativeGreenMapPreserved!==true||x.theme?.builtInThemesRequired!==100||x.theme?.widgetCountRequired!==26||x.codeEditor?.actualLineNumbers!==true||x.codeEditor?.maxSupportedLines!==10000||x.nara?.cameraPhotoFile!==true||x.nara?.smallMediumNonModal!==true||x.authentication?.v224SingleFlightDataReauthPreserved!==true)process.exit(1)' "${body}" || ok=false
              elif [[ "${path}" != /release-* ]]; then
                grep -q 'id="root"' "${body}" || ok=false
              fi
            done
            tenant_body=/tmp/v228-tenant.html
            tenant_headers=/tmp/v228-tenant.headers
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${tenant_headers}" -o "${tenant_body}" -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?v228=${stamp}" || true)"
            [[ "${tenant_code}" == "200" ]] || ok=false
            grep -q 'WHITE-R4-2026.07.12' "${tenant_body}" "${tenant_headers}" && ok=false || true
            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_V228_APEX_AUTH_STUDIO_TENANT_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_V228_LIVE_VERIFY_FAILED"
          exit 1

      - name: Publish v228 production success status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner:context.repo.owner, repo:context.repo.repo, sha:context.sha, state:'success', context:'ngeblogging/production-v228', description:'v228 build, Worker, route cutover dan live authority terverifikasi', target_url:runUrl });

      - name: Publish v228 production failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner:context.repo.owner, repo:context.repo.repo, sha:context.sha, state:'failure', context:'ngeblogging/production-v228', description:'v228 belum lolos build, Worker, route cutover atau verifikasi live', target_url:runUrl });