name: Production images and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ngeblogging-web
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/ngeblogging-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and validate production package
        run: npm run test:production

  build-api:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ngeblogging-api
          cache-to: type=gha,mode=max,scope=ngeblogging-api
          provenance: mode=max
          sbom: true

      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-web:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
    steps:
      - name: Validate public build configuration
        run: |
          test -n "${VITE_SUPABASE_URL}" || { echo "Repository variable VITE_SUPABASE_URL belum diisi"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo "Secret VITE_SUPABASE_PUBLISHABLE_KEY belum diisi"; exit 1; }
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_PUBLIC_SITE_URL}" == https://* ]] || { echo "VITE_PUBLIC_SITE_URL wajib HTTPS"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_PUBLIC_SITE_URL=${{ env.VITE_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=ngeblogging-web
          cache-to: type=gha,mode=max,scope=ngeblogging-web
          provenance: mode=max
          sbom: true

      - name: Attest web image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      SITE_HOSTS: ${{ vars.SITE_HOSTS || 'ngeblogging.com, www.ngeblogging.com' }}
      PRIMARY_SITE_DOMAIN: ${{ vars.PRIMARY_SITE_DOMAIN || 'ngeblogging.com' }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL || 'admin@ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          test -n "${VPS_HOST}" || { echo "VPS_HOST belum diisi"; exit 1; }
          test -n "${VPS_USER}" || { echo "VPS_USER belum diisi"; exit 1; }
          test -n "${SSH_PRIVATE_KEY}" || { echo "VPS_SSH_PRIVATE_KEY belum diisi"; exit 1; }
          test -n "${SSH_KNOWN_HOSTS}" || { echo "VPS_SSH_KNOWN_HOSTS belum diisi"; exit 1; }
          [[ "${VPS_PORT}" =~ ^[0-9]{1,5}$ ]] || { echo "VPS_PORT tidak valid"; exit 1; }
          [[ "${SITE_HOSTS}" =~ ^[a-z0-9.-]+(,[[:space:]]*[a-z0-9.-]+)*$ ]] || { echo "SITE_HOSTS tidak valid"; exit 1; }
          [[ "${PRIMARY_SITE_DOMAIN}" =~ ^[a-z0-9.-]+$ ]] || { echo "PRIMARY_SITE_DOMAIN tidak valid"; exit 1; }
          [[ "${ACME_EMAIL}" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]] || { echo "ACME_EMAIL tidak valid"; exit 1; }

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Prepare non-secret deployment config
        run: |
          {
            printf 'GHCR_REPOSITORY_OWNER=%s\n' "${GITHUB_REPOSITORY_OWNER}"
            printf 'IMAGE_TAG=sha-%s\n' "${GITHUB_SHA}"
            printf 'SITE_HOSTS="%s"\n' "${SITE_HOSTS}"
            printf 'PRIMARY_SITE_DOMAIN=%s\n' "${PRIMARY_SITE_DOMAIN}"
            printf 'ACME_EMAIL=%s\n' "${ACME_EMAIL}"
            printf 'NGEBLOGGING_ENV_FILE=/opt/ngeblogging/shared/.env\n'
          } > .deploy.env

      - name: Upload deployment manifests
        run: |
          SSH=(ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}")
          SCP=(scp -i ~/.ssh/id_ed25519 -P "${VPS_PORT}" -o BatchMode=yes)
          "${SSH[@]}" 'install -d -m 0750 /opt/ngeblogging/app/scripts'
          "${SCP[@]}" compose.production.yml Caddyfile .deploy.env "${VPS_USER}@${VPS_HOST}:/opt/ngeblogging/app/"
          "${SCP[@]}" scripts/deploy.sh scripts/server-doctor.sh scripts/verify-production.sh "${VPS_USER}@${VPS_HOST}:/opt/ngeblogging/app/scripts/"

      - name: Pull images and deploy with rollback
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            'chmod 750 /opt/ngeblogging/app/scripts/*.sh && /opt/ngeblogging/app/scripts/deploy.sh'

      - name: Remove temporary registry login
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            'docker logout ghcr.io >/dev/null 2>&1 || true' || true
