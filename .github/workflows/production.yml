name: Production images and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ngeblogging-web
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/ngeblogging-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and validate production package
        run: npm run test:production

  build-api:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ngeblogging-api
          cache-to: type=gha,mode=max,scope=ngeblogging-api
          provenance: mode=max
          sbom: true

      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-web:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
    steps:
      - name: Validate public build configuration
        run: |
          test -n "${VITE_SUPABASE_URL}" || { echo "Repository variable VITE_SUPABASE_URL belum diisi"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo "Secret VITE_SUPABASE_PUBLISHABLE_KEY belum diisi"; exit 1; }
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_PUBLIC_SITE_URL}" == https://* ]] || { echo "VITE_PUBLIC_SITE_URL wajib HTTPS"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_PUBLIC_SITE_URL=${{ env.VITE_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=ngeblogging-web
          cache-to: type=gha,mode=max,scope=ngeblogging-web
          provenance: mode=max
          sbom: true

      - name: Attest web image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-standby:
    needs: [build-api, build-web]
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.DUAL_SERVER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-standby
    env:
      DEPLOY_ROLE: standby
      VPS_HOST: ${{ secrets.STANDBY_VPS_HOST }}
      VPS_PORT: ${{ vars.STANDBY_VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.STANDBY_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STANDBY_VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STANDBY_VPS_SSH_KNOWN_HOSTS }}
      SITE_HOSTS: ${{ vars.STANDBY_SITE_HOSTS || 'standby.ngeblogging.com' }}
      PRIMARY_SITE_DOMAIN: ${{ vars.STANDBY_SITE_DOMAIN || 'standby.ngeblogging.com' }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL || 'admin@ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy standby and verify health
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-via-ssh.sh

  deploy-primary:
    needs: [build-api, build-web, deploy-standby]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      needs.build-api.result == 'success' &&
      needs.build-web.result == 'success' &&
      (vars.DUAL_SERVER_DEPLOY_ENABLED != 'true' || needs.deploy-standby.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-primary
    env:
      DEPLOY_ROLE: primary
      VPS_HOST: ${{ secrets.PRIMARY_VPS_HOST || secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.PRIMARY_VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.PRIMARY_VPS_USER || secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRIMARY_VPS_SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRIMARY_VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
      SITE_HOSTS: ${{ vars.PRIMARY_SITE_HOSTS || vars.SITE_HOSTS || 'primary.ngeblogging.com' }}
      PRIMARY_SITE_DOMAIN: ${{ vars.PRIMARY_SITE_DOMAIN || 'primary.ngeblogging.com' }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL || 'admin@ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy primary and verify health
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-via-ssh.sh
