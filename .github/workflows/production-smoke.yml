name: Production Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live v7 assets
        shell: bash
        run: >-
          node --input-type=module -e 'const s="https://ngeblogging.com",q=`?d=${Date.now()}`,get=async p=>{const r=await fetch(s+p+q,{headers:{"cache-control":"no-cache"}});if(!r.ok)throw Error(`${p}:${r.status}`);return r.text()},[hT,sw,html]=await Promise.all([get("/api/health"),get("/sw.js"),get("/")]),h=JSON.parse(hT),urls=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css)(?:\?[^"]*)?)"/g)].map(m=>new URL(m[1],s).href),assets=(await Promise.all(urls.map(async u=>(await fetch(`${u}${u.includes("?")?"&":"?"}d=${Date.now()}`,{headers:{"cache-control":"no-cache"}})).text()))).join("\n"),e=[];if(h.release!=="2026.07.24-mobile-final-v7")e.push(`release:${h.release}`);if(!h.nara)e.push(`nara:${h.nara}`);if(!h.naraProviders||(!h.naraProviders.qwen&&!h.naraProviders.workersAi))e.push(`providers:${JSON.stringify(h.naraProviders)}`);if(h.siteLimits?.free!==5||h.siteLimits?.maximum!==12)e.push(`limits:${JSON.stringify(h.siteLimits)}`);if(!sw.includes("ngeblogging-app-v7-20260724"))e.push("PWA");for(const [n,ms] of [["guard",["studio-production-guard-v7-20260724"]],["toggle",["sidebarAuthority"]],["settings",["ngeblogging-settings-extras"]],["posts",["sn-content-tools"]],["bottom",["sn-mobile-nav","display:none!important"]],["panel",["--sn-phone-panel"]],["themes",["ng-shell-poster","ng-shell-rail","ng-shell-cards"]],["widgets",["ng-widget-recent-posts","ng-widget-popular-posts"]],["menu",["ng-header nav.open"]],["devices",["Mobile","Tablet","Laptop","Komputer"]]])if(ms.some(m=>!assets.includes(m)))e.push(`${n}:${ms.filter(m=>!assets.includes(m)).join(",")}`);if(assets.includes("uji produksi belum dinyatakan lulus"))e.push("obsoleteNaraGate");console.log(JSON.stringify({health:h,urls,errors:e},null,2));if(e.length)process.exit(1);console.log("LIVE_RELEASE_V7_ASSETS_CONFIRMED")'
