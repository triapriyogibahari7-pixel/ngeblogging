name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the repository deployment and verify production
        shell: bash
        env:
          SITE_URL: https://ngeblogging.com
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            stamp="$(date +%s)-${attempt}"
            echo "Production verification attempt ${attempt}/36"

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              -H 'accept: application/json' -H 'cache-control: no-cache' \
              "${SITE_URL}/api/health?smoke=${stamp}" > /tmp/health.json \
              && curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              -H 'cache-control: no-cache' \
              "${SITE_URL}/?smoke=${stamp}" > /tmp/index.html \
              && curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              -H 'cache-control: no-cache' \
              "${SITE_URL}/sw.js?smoke=${stamp}" > /tmp/sw.js \
              && curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              -H 'cache-control: no-cache' \
              "${SITE_URL}/src/studio-device-mode.css?smoke=${stamp}" > /tmp/device.css; then

              if node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const index = fs.readFileSync('/tmp/index.html', 'utf8');
          const sw = fs.readFileSync('/tmp/sw.js', 'utf8');
          const device = fs.readFileSync('/tmp/device.css', 'utf8');

          const requiredBooleans = ['billing', 'customDomains', 'emailRegistration', 'nara', 'imageGeneration', 'managedSubdomains'];
          const errors = [];
          if (health.status !== 'ok') errors.push('health.status');
          if (health.service !== 'ngeblogging-cloudflare') errors.push('health.service');
          for (const key of requiredBooleans) {
            if (typeof health[key] !== 'boolean') errors.push(`health.${key}`);
          }
          if (health.managedSubdomains !== true) errors.push('managed subdomains');
          if (health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push('site limits');
          for (const asset of ['studio-device-mode.css', 'auth-readiness-bridge.js', 'nara-availability-bridge.js', 'billing-availability-bridge.js']) {
            if (!index.includes(asset)) errors.push(`index:${asset}`);
          }
          if (!sw.includes('ngeblogging-app-v3-20260723') || !sw.includes('networkFirst')) errors.push('service worker');
          if (!device.includes('html[data-device-mode="mobile"]') || !device.includes('margin-left:0!important')) errors.push('mobile authority');

          if (errors.length) {
            console.error(`Deployment not ready: ${errors.join(', ')}`);
            process.exit(1);
          }

          console.log(JSON.stringify({
            status: health.status,
            runtime: health.runtime,
            billing: health.billing,
            customDomains: health.customDomains,
            emailRegistration: health.emailRegistration,
            nara: health.nara,
            managedSubdomains: health.managedSubdomains,
            siteLimits: health.siteLimits,
          }, null, 2));
          NODE
              then
                echo "Production deployment verified."
                exit 0
              fi
            fi

            if [ "$attempt" -eq 36 ]; then
              echo "Production did not expose the expected release within 12 minutes."
              echo "Last health response:"
              cat /tmp/health.json 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
