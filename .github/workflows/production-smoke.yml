name: Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-diagnostic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect workflows for the deployed main commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "MAIN_COMMIT=${BASE_SHA}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${BASE_SHA}&per_page=30" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,run_started_at,html_url}'

      - name: Inspect the live release
        env:
          SITE_URL: https://ngeblogging.com
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'accept: application/json' -H 'cache-control: no-cache' \
            "${SITE_URL}/api/health?diagnostic=${stamp}" | tee /tmp/health.json
          echo
          echo '--- SERVICE WORKER RELEASE ---'
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'cache-control: no-cache' "${SITE_URL}/sw.js?diagnostic=${stamp}" \
            | grep -E 'ngeblogging-app-v[0-9]+-[0-9]+' | head -n 3 || true
          echo '--- INDEX ASSETS ---'
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'cache-control: no-cache' "${SITE_URL}/?diagnostic=${stamp}" \
            | grep -Eo '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' | head -n 30 || true

      - name: Require release v7
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const errors = [];
          if (health.release !== '2026.07.24-mobile-final-v7') errors.push(`release=${health.release}`);
          if (health.runtime !== 'cloudflare-worker-v4') errors.push(`runtime=${health.runtime}`);
          if (health.nara !== true) errors.push(`nara=${health.nara}`);
          if (!health.naraProviders || (!health.naraProviders.qwen && !health.naraProviders.workersAi)) errors.push(`naraProviders=${JSON.stringify(health.naraProviders)}`);
          if (health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push(`siteLimits=${JSON.stringify(health.siteLimits)}`);
          if (errors.length) {
            console.error(`LIVE_RELEASE_NOT_READY: ${errors.join(', ')}`);
            process.exit(1);
          }
          console.log('LIVE_RELEASE_V7_CONFIRMED');
          NODE
