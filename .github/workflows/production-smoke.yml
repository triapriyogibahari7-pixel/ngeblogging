name: Production Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify live v7 assets
        run: node scripts/live-v7-diagnostic.mjs
