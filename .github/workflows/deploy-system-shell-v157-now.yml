name: Deploy Auth Studio Route v158 Now

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".deploy-auth-studio-route-v158"

permissions:
  contents: read

concurrency:
  group: ngeblogging-auth-studio-route-v158-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'deploy/auth-studio-route-v158-now'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      QWEN_API_KEY: ci-dry-run-only
      QWEN_WORKSPACE_ID: production-dry-run

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run production contracts through v158
        run: npm run test:production

      - name: Build React assets and patch legacy Workers
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npm run cloudflare:dry-run

      - name: Deploy auth Studio route v158 to Cloudflare production
        run: npm run deploy:cloudflare

      - name: Verify auth handoff, Studio routes and gateway v158
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            stamp=$(date +%s)
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/?deploy_audit=$stamp" || true)
            login_code=$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/login?deploy_audit=$stamp" || true)
            studio_code=$(curl -sS -o /tmp/studio.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/studio?auth_success=v158&deploy_audit=$stamp" || true)
            release_code=$(curl -sS -o /tmp/release-v158.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/release-v158.json?deploy_audit=$stamp" || true)
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/api/health?deploy_audit=$stamp" || true)
            auth_code=$(curl -sS -D /tmp/auth-headers.txt -o /tmp/auth-body.txt -w '%{http_code}' --max-time 20 \
              -X OPTIONS "https://ngeblogging.com/api/auth-proxy/auth/v1/token?grant_type=password&deploy_audit=$stamp" \
              -H 'Origin: https://ngeblogging.com' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: apikey,content-type,x-client-info' || true)

            root=$(cat /tmp/root.html 2>/dev/null || true)
            login=$(cat /tmp/login.html 2>/dev/null || true)
            studio=$(cat /tmp/studio.html 2>/dev/null || true)
            release=$(cat /tmp/release-v158.json 2>/dev/null || true)
            health=$(cat /tmp/health.json 2>/dev/null || true)
            auth_headers=$(cat /tmp/auth-headers.txt 2>/dev/null || true)

            if [[ "$root_code" == "200" ]] \
              && [[ "$login_code" == "200" ]] \
              && [[ "$studio_code" == "200" ]] \
              && [[ "$release_code" == "200" ]] \
              && [[ "$health_code" == "200" ]] \
              && [[ "$auth_code" == "204" ]] \
              && [[ "$root" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$login" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$studio" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$studio" == *"ngeblogging-studio-route"* ]] \
              && [[ "$release" == *"2026.07.30-auth-studio-route-v158"* ]] \
              && [[ "$release" == *'"authHandoff":"/studio"'* || "$release" == *'"studioRouteRelease":"2026.07.30-auth-studio-route-v158"'* ]] \
              && [[ "$release" == *'"legacyWhiteR4":false'* ]] \
              && [[ "$health" == *"2026.07.30-auth-gateway-v153"* ]] \
              && [[ "$auth_headers" == *"2026.07.30-auth-gateway-v153"* ]]; then
              echo "AUTH_STUDIO_ROUTE_V158_PRODUCTION_VERIFIED"
              exit 0
            fi

            echo "Waiting for auth Studio route v158 production propagation ($attempt/36)."
            sleep 10
          done

          echo "AUTH_STUDIO_ROUTE_V158_PRODUCTION_VERIFY_FAILED"
          exit 1
