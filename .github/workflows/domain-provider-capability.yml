name: Domain provider capability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe Cloudflare zone capabilities without creating a zone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Token tidak tersedia.'; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Account ID tidak valid.'; exit 1; }

          zones_code="$(curl -sS -o diagnostics/zones.json -w '%{http_code}' \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/zones?account.id=${CLOUDFLARE_ACCOUNT_ID}&per_page=1")"

          # Nama satu label sengaja tidak valid sehingga tidak ada zone sungguhan yang dibuat.
          create_probe_code="$(curl -sS -o diagnostics/create-probe.json -w '%{http_code}' \
            -X POST \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            -H 'content-type: application/json' \
            --data "{\"account\":{\"id\":\"${CLOUDFLARE_ACCOUNT_ID}\"},\"name\":\"invalid\",\"type\":\"full\"}" \
            'https://api.cloudflare.com/client/v4/zones')"

          ZONES_CODE="${zones_code}" CREATE_CODE="${create_probe_code}" node --input-type=module <<'NODE' | tee diagnostics/summary.txt
          import fs from 'node:fs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const zones = read('diagnostics/zones.json');
          const create = read('diagnostics/create-probe.json');
          const errors = (payload) => (payload.errors || []).map((item) => ({ code: item.code, message: item.message }));
          const createMessage = String(create.errors?.[0]?.message || '');
          const result = {
            zoneReadHttp: Number(process.env.ZONES_CODE),
            zoneReadAllowed: zones.success === true,
            zoneReadErrors: errors(zones),
            zoneCreateProbeHttp: Number(process.env.CREATE_CODE),
            zoneCreateAllowed: !/account\.zone\.create|requires permission.*create zones/i.test(createMessage),
            zoneCreateProbeErrors: errors(create),
          };
          console.log(JSON.stringify(result, null, 2));
          fs.writeFileSync('diagnostics/result.json', JSON.stringify(result, null, 2));
          if (!result.zoneReadAllowed || !result.zoneCreateAllowed) process.exit(1);
          NODE

      - name: Upload sanitized capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-provider-capability-${{ github.run_id }}
          path: diagnostics
          retention-days: 3
          if-no-files-found: warn
