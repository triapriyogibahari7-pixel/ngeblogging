name: Ngeblogging production login finalizer v175

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: ngeblogging-production-login-finalizer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Run complete v147-v175 regression and build
        id: build
        run: npm run build

      - name: Build active-zone Wrangler without legacy apex routes
        id: active_config
        shell: bash
        run: |
          set -euo pipefail
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.production.active-zone.jsonc', 'utf8'));
          const routes = config.routes || [];
          for (const hostname of ['ngeblogging.com', 'www.ngeblogging.com']) {
            const route = routes.find((item) => item.pattern === hostname);
            if (!route || route.custom_domain !== true) throw new Error(`Custom Domain ${hostname} hilang.`);
          }
          const wildcard = routes.find((item) => item.pattern === '*.ngeblogging.com/*');
          if (!wildcard || wildcard.zone_id !== process.env.CLOUDFLARE_ZONE_ID) throw new Error('Wildcard tenant tidak memakai Zone ID aktif.');
          if (routes.some((item) => ['ngeblogging.com/*','www.ngeblogging.com/*'].includes(item.pattern))) throw new Error('Legacy apex Worker Routes masih dibuat.');
          if (config.vars?.MOBILE_INTERACTION_RELEASE !== 'mobile-interaction-v174-20260731') throw new Error('Mobile interaction v174 hilang dari active config.');
          NODE
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v175

      - name: Deploy Worker and assets
        id: deploy
        shell: bash
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Attach exact Worker Domains and remove only conflicting apex routes
        id: finalize
        shell: bash
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Verify root login signup Studio mobile audit and tenant
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            stamp="$(date +%s)-${attempt}"
            ok=true
            for path in / /login /signup /studio /release-v174.json /studio-viewport-audit-v174.html; do
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "/tmp/page-${attempt}.out" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if [[ "${path}" != "/release-v174.json" ]] && grep -q 'WHITE-R4-2026.07.12' "/tmp/page-${attempt}.out"; then ok=false; fi
              if [[ "${path}" == "/release-v174.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.authority!=="mobile-interaction-v174-20260731"||x.legacyWhiteR4!==false)process.exit(1)' "/tmp/page-${attempt}.out" || ok=false
              fi
            done
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v175.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false
            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_LOGIN_FINALIZER_V175_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_LOGIN_FINALIZER_V175_VERIFY_FAILED"
          exit 1

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ACTIVE_CONFIG_OUTCOME: ${{ steps.active_config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.ACTIVE_CONFIG_OUTCOME || 'not-run',
              deploy: process.env.DEPLOY_OUTCOME || 'not-run',
              routes: process.env.FINALIZE_OUTCOME || 'not-run',
              live: process.env.VERIFY_OUTCOME || 'not-run',
            };
            const ready = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production login v175',
              description: `build=${outcomes.build}; routes=${outcomes.routes}; live=${outcomes.live}`.slice(0,140),
              target_url: runUrl,
            });
