name: Ngeblogging production route cutover v184 — Studio v191/v192/v195/v196/v197

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-studio-v197
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"

      - name: Run v183 and v184 regression — v190/v191/v192/v195/v196/v197 continuation
        id: regression
        run: npm run verify:v195 && node --test tests/studio-bootstrap-v196.test.mjs && node scripts/patch-studio-session-race-v197.mjs && node --test tests/studio-session-race-v197.test.mjs

      - name: Build production application
        id: build
        run: npm run build

      - name: Build active-zone Wrangler configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v197

      - name: Deploy Worker and assets
        id: deploy
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Verify freshly deployed Worker v197 before route mutation
        id: worker_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            stamp="$(date +%s)-${attempt}"
            output="/tmp/workers-v197-precutover.json"
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v197.json?verify_v197=${stamp}" || true)"
            if [[ "${code}" == 200 ]] && ! grep -q 'WHITE-R4-2026.07.12' "${output}"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-session-race-recovery-v197-20260802"||x.authentication?.forcedVerificationSingleFlight!==true||x.studioBootstrap?.membershipSingleFlightPerUser!==true)process.exit(1)' "${output}"; then
                echo "WORKERS_DEV_V197_VERIFIED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V197_VERIFY_FAILED"
          exit 1

      - name: Preserve compatibility routing before cutover
        id: compatibility
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Cut over apex and www to authoritative zone routes v184
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      # Historical compatibility paths remain contract-visible for old regression suites:
      # /release-v174.json /release-v182.json /release-v183.json /release-v184.json /release-v190.json /release-v191.json /release-v192.json /release-v194.json /release-v195.json /release-v196.json /release-v197.json
      - name: Verify live apex, auth routes, Studio and release markers
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio /release-v190.json /release-v191.json /release-v192.json /release-v194.json /release-v195.json /release-v196.json /release-v197.json; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-v197-${attempt}-${safe_name}.out"
              headers="/tmp/ngeblogging-v197-${attempt}-${safe_name}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v197=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then ok=false; fi

              if [[ "${path}" == "/release-v190.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-real-device-v190-20260801")process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v191.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-screenshot-recovery-v191-20260801"||x.repairs?.androidDesktopSiteRootScaleRemoved!==true||x.repairs?.drawerMenuClickable!==true||x.repairs?.naraSmallMediumNonModal!==true||x.repairs?.legacyWhiteR4RejectedByDeployment!==true)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v192.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="auth-studio-bootstrap-v192-20260801"||x.authentication?.oauthReplayRecovery!==true||x.studioBootstrap?.firstSessionCheckUsesCachedVerifiedSession!==true||x.serviceWorker?.forcedNavigation!==false)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v194.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-nara-theme-v194-20260801")process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v195.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-bootstrap-session-first-v195-20260801"||x.authentication?.localSessionFirst!==true||x.authentication?.remoteVerificationOnlyAfterTokenRejection!==true||x.studioBootstrap?.cachedResumeRequiresMatchingUser!==true||x.serviceWorker?.forcedNavigation!==false)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v196.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-bootstrap-live-recovery-v196-20260802"||x.authentication?.persistSession!==true||x.authentication?.transientNetworkFailureDoesNotLogout!==true||x.studioBootstrap?.automaticRecovery!==true||x.productionRoute?.legacyWorkerMarkerRejected!=="WHITE-R4-2026.07.12"||x.serviceWorker?.forcedNavigation!==false)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v197.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-session-race-recovery-v197-20260802"||x.authentication?.forcedVerificationSingleFlight!==true||x.authentication?.newerLocalTokenReusedAfterStale401!==true||x.studioBootstrap?.membershipSingleFlightPerUser!==true||x.studioBootstrap?.recoverySingleFlightPerUser!==true||x.productionRoute?.legacyWorkerMarkerRejected!=="WHITE-R4-2026.07.12"||x.serviceWorker?.forcedNavigation!==false)process.exit(1)' "${output}" || ok=false
              else
                grep -q 'id="root"' "${output}" || ok=false
              fi
            done

            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v197.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v197=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false

            workers_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/workers-v197.json -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v197.json?verify_v197=${stamp}" || true)"
            [[ "${workers_code}" == 200 ]] || ok=false
            if [[ "${workers_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-session-race-recovery-v197-20260802")process.exit(1)' /tmp/workers-v197.json || ok=false
            fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_ROUTE_CUTOVER_V184_VERIFIED"
              echo "PRODUCTION_STUDIO_V191_VERIFIED"
              echo "PRODUCTION_AUTH_STUDIO_V192_VERIFIED"
              echo "PRODUCTION_STUDIO_NARA_THEME_V194_VERIFIED"
              echo "PRODUCTION_STUDIO_BOOTSTRAP_V195_VERIFIED"
              echo "PRODUCTION_STUDIO_BOOTSTRAP_V196_VERIFIED"
              echo "PRODUCTION_STUDIO_SESSION_RACE_V197_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_ROUTE_CUTOVER_V184_VERIFY_FAILED"
          echo "PRODUCTION_STUDIO_V191_VERIFY_FAILED"
          echo "PRODUCTION_AUTH_STUDIO_V192_VERIFY_FAILED"
          echo "PRODUCTION_STUDIO_BOOTSTRAP_V195_VERIFY_FAILED"
          echo "PRODUCTION_STUDIO_BOOTSTRAP_V196_VERIFY_FAILED"
          echo "PRODUCTION_STUDIO_SESSION_RACE_V197_VERIFY_FAILED"
          exit 1

      - name: Publish production status
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WORKER_VERIFY_OUTCOME: ${{ steps.worker_verify.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              credentials: process.env.CREDENTIALS_OUTCOME || 'not-run',
              regression: process.env.REGRESSION_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.CONFIG_OUTCOME || 'not-run',
              deploy: process.env.DEPLOY_OUTCOME || 'not-run',
              workerVerify: process.env.WORKER_VERIFY_OUTCOME || 'not-run',
              compatibility: process.env.COMPATIBILITY_OUTCOME || 'not-run',
              cutover: process.env.CUTOVER_OUTCOME || 'not-run',
              verify: process.env.VERIFY_OUTCOME || 'not-run',
            };
            const ready = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production Studio v197',
              description: `build=${outcomes.build}; worker=${outcomes.workerVerify}; cutover=${outcomes.cutover}; verify=${outcomes.verify}`.slice(0, 140),
              target_url: runUrl,
            });
