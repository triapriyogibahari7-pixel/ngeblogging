name: Cloudflare token diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-token-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        run: npm ci --ignore-scripts

      - name: Diagnose Cloudflare token permissions
        shell: bash
        run: |
          set +e
          : > /tmp/cloudflare-diagnostic.txt
          echo "account_id_shape=$([[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] && echo valid || echo invalid)" >> /tmp/cloudflare-diagnostic.txt
          echo "token_present=$([[ -n "${CLOUDFLARE_API_TOKEN}" ]] && echo true || echo false)" >> /tmp/cloudflare-diagnostic.txt

          scripts_code="$(curl -sS -o /tmp/workers-scripts.json -w '%{http_code}' \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          echo "workers_scripts_http=${scripts_code}" >> /tmp/cloudflare-diagnostic.txt

          WORKERS_FILE=/tmp/workers-scripts.json node --input-type=module <<'NODE' >> /tmp/cloudflare-diagnostic.txt
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.WORKERS_FILE, 'utf8'));
          console.log(`workers_scripts_success=${payload.success === true}`);
          console.log(`workers_script_count=${Array.isArray(payload.result) ? payload.result.length : 0}`);
          console.log(`workers_error_codes=${(payload.errors || []).map((error) => error.code).join(',') || 'none'}`);
          NODE

          set -o pipefail
          npx wrangler whoami 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' \
            | tail -n 40 >> /tmp/cloudflare-diagnostic.txt
          echo "wrangler_whoami_exit=${PIPESTATUS[0]}" >> /tmp/cloudflare-diagnostic.txt
          cat /tmp/cloudflare-diagnostic.txt
          exit 0

      - name: Build application after main quality gate
        run: npm run build

      - name: Build active Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          else
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=" >> "${GITHUB_ENV}"
          fi
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-recovery-build

      - name: Wait for primary workflow lock to clear
        run: sleep 45

      - name: Deploy recovered Cloudflare production
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars 2>&1 \
            | sed -E 's/[a-fA-F0-9]{32}/[cloudflare-id]/g; s/[A-Za-z0-9_-]{40,}/[redacted]/g' \
            | tee /tmp/cloudflare-deploy-diagnostic.txt

      - name: Synchronize full-zone runtime secrets
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${CLOUDFLARE_API_TOKEN}" | npx wrangler secret put CLOUDFLARE_API_TOKEN --config wrangler.production.active-zone.jsonc >/dev/null
          printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --config wrangler.production.active-zone.jsonc >/dev/null
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            printf '%s' "${CLOUDFLARE_ZONE_ID}" | npx wrangler secret put CLOUDFLARE_ZONE_ID --config wrangler.production.active-zone.jsonc >/dev/null
          fi

      - name: Verify live workers, apex, tenant, domain UI, and twelve-site contract
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/cloudflare-live-verification.txt
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            worker_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/worker-health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/api/health?recovery=${stamp}" || true)"
            apex_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/apex-health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "https://ngeblogging.com/api/health?recovery=${stamp}" || true)"
            index_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/index.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/?recovery=${stamp}" || true)"
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?recovery=${stamp}" || true)"

            if [[ "${worker_code}" == 200 && "${apex_code}" == 200 && "${index_code}" == 200 && "${tenant_code}" == 200 ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const worker = JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'));
          const apex = JSON.parse(fs.readFileSync('/tmp/apex-health.json', 'utf8'));
          const index = fs.readFileSync('/tmp/index.html', 'utf8');
          const tenant = fs.readFileSync('/tmp/tenant.html', 'utf8');
          const errors = [];
          for (const [name, health] of [['worker', worker], ['apex', apex]]) {
            if (health.status !== 'ok') errors.push(`${name}.status`);
            if (health.domainRelease !== '2026.07.26-full-zone-domains-v55') errors.push(`${name}.domainRelease`);
            if (health.customDomains !== true) errors.push(`${name}.customDomains`);
            if (health.customDomainProvider !== 'cloudflare-full-zone') errors.push(`${name}.provider`);
            if (health.customDomainMode !== 'full-zone-nameserver') errors.push(`${name}.mode`);
            if (health.customDomainBindings?.apiToken !== true) errors.push(`${name}.apiToken`);
            if (health.customDomainBindings?.accountId !== true) errors.push(`${name}.accountId`);
            if (health.customDomainBindings?.workerService !== true) errors.push(`${name}.workerService`);
            if (health.customDomainBindings?.databaseAccess !== true) errors.push(`${name}.databaseAccess`);
            if (health.siteCapacity?.mode !== 'fixed' || health.siteCapacity?.defaultLimit !== 12) errors.push(`${name}.siteCapacity`);
            if (health.siteLimits?.free !== 12 || health.siteLimits?.maximum !== 12) errors.push(`${name}.siteLimits`);
          }
          if (!index.includes('/src/domain-full-zone-v54.js')) errors.push('domain-ui-js');
          if (!index.includes('/src/domain-full-zone-v54.css')) errors.push('domain-ui-css');
          if (/Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant)) errors.push('tenant-404');
          if (!tenant.includes('/src/main.jsx') && !tenant.includes('/assets/')) errors.push('tenant-shell');
          if (errors.length) {
            console.error(errors.join(','));
            process.exit(1);
          }
          NODE
              then
                cp /tmp/apex-health.json /tmp/cloudflare-live-health.json
                echo "worker_http=200" >> /tmp/cloudflare-live-verification.txt
                echo "apex_http=200" >> /tmp/cloudflare-live-verification.txt
                echo "index_http=200" >> /tmp/cloudflare-live-verification.txt
                echo "tenant_http=200" >> /tmp/cloudflare-live-verification.txt
                echo "full_zone=true" >> /tmp/cloudflare-live-verification.txt
                echo "site_limit=12" >> /tmp/cloudflare-live-verification.txt
                cat /tmp/cloudflare-live-verification.txt
                exit 0
              fi
            fi
            sleep 10
          done
          cp /tmp/apex-health.json /tmp/cloudflare-live-health.json 2>/dev/null || echo '{}' > /tmp/cloudflare-live-health.json
          echo "live_verification=false" >> /tmp/cloudflare-live-verification.txt
          cat /tmp/cloudflare-live-verification.txt
          exit 1

      - name: Publish production recovery result
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/cloudflare-diagnostic.txt', 'utf8');
            const value = (key) => text.match(new RegExp(`^${key}=(.*)$`, 'm'))?.[1]?.trim() || 'unknown';
            const scriptsSuccess = value('workers_scripts_success');
            const whoami = value('wrangler_whoami_exit');
            const deploy = process.env.DEPLOY_OUTCOME || 'unknown';
            const verify = process.env.VERIFY_OUTCOME || 'unknown';
            const ready = scriptsSuccess === 'true' && whoami === '0' && deploy === 'success' && verify === 'success';
            const description = `scripts=${scriptsSuccess}; deploy=${deploy}; live=${verify}`.slice(0, 140);
            for (const contextName of ['Cloudflare token diagnostic', 'Ngeblogging Cloudflare production']) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: ready ? 'success' : 'failure',
                context: contextName,
                description,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-recovery-${{ github.run_id }}
          path: |
            /tmp/cloudflare-diagnostic.txt
            /tmp/cloudflare-deploy-diagnostic.txt
            /tmp/cloudflare-live-verification.txt
            /tmp/cloudflare-live-health.json
          retention-days: 3
          if-no-files-found: warn

      - name: Preserve production result
        if: steps.deploy.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
