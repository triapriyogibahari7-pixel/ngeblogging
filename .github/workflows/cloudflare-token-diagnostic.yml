name: Cloudflare token diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-token-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        run: npm ci --ignore-scripts

      - name: Diagnose Cloudflare token permissions
        shell: bash
        run: |
          set +e
          : > /tmp/cloudflare-diagnostic.txt

          echo "account_id_shape=$([[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] && echo valid || echo invalid)" >> /tmp/cloudflare-diagnostic.txt
          echo "token_present=$([[ -n "${CLOUDFLARE_API_TOKEN}" ]] && echo true || echo false)" >> /tmp/cloudflare-diagnostic.txt

          token_code="$(curl -sS -o /tmp/token-verify.json -w '%{http_code}' \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          echo "token_verify_http=${token_code}" >> /tmp/cloudflare-diagnostic.txt

          TOKEN_VERIFY_FILE=/tmp/token-verify.json node --input-type=module <<'NODE' >> /tmp/cloudflare-diagnostic.txt
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.TOKEN_VERIFY_FILE, 'utf8'));
          console.log(`token_verify_success=${payload.success === true}`);
          console.log(`token_status=${payload.result?.status || 'unknown'}`);
          console.log(`token_error_codes=${(payload.errors || []).map((error) => error.code).join(',') || 'none'}`);
          NODE

          scripts_code="$(curl -sS -o /tmp/workers-scripts.json -w '%{http_code}' \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          echo "workers_scripts_http=${scripts_code}" >> /tmp/cloudflare-diagnostic.txt

          WORKERS_FILE=/tmp/workers-scripts.json node --input-type=module <<'NODE' >> /tmp/cloudflare-diagnostic.txt
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.WORKERS_FILE, 'utf8'));
          console.log(`workers_scripts_success=${payload.success === true}`);
          console.log(`workers_script_count=${Array.isArray(payload.result) ? payload.result.length : 0}`);
          console.log(`workers_error_codes=${(payload.errors || []).map((error) => error.code).join(',') || 'none'}`);
          NODE

          set -o pipefail
          npx wrangler whoami 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' \
            | tail -n 40 >> /tmp/cloudflare-diagnostic.txt
          echo "wrangler_whoami_exit=${PIPESTATUS[0]}" >> /tmp/cloudflare-diagnostic.txt

          cat /tmp/cloudflare-diagnostic.txt
          exit 0

      - name: Build application
        run: npm run build

      - name: Build active Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          else
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=" >> "${GITHUB_ENV}"
          fi
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc

      - name: Attempt sanitized Cloudflare deployment
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars 2>&1 \
            | sed -E 's/[a-fA-F0-9]{32}/[cloudflare-id]/g; s/[A-Za-z0-9_-]{40,}/[redacted]/g' \
            | tee /tmp/cloudflare-deploy-diagnostic.txt

      - name: Publish sanitized permission result
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('/tmp/cloudflare-diagnostic.txt', 'utf8');
            const value = (key) => text.match(new RegExp(`^${key}=(.*)$`, 'm'))?.[1]?.trim() || 'unknown';
            const scriptsHttp = value('workers_scripts_http');
            const scriptsSuccess = value('workers_scripts_success');
            const whoami = value('wrangler_whoami_exit');
            const deploy = process.env.DEPLOY_OUTCOME || 'unknown';
            const ready = scriptsSuccess === 'true' && whoami === '0' && deploy === 'success';
            const description = `scripts=${scriptsSuccess}/${scriptsHttp}; whoami=${whoami}; deploy=${deploy}`.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Cloudflare token diagnostic',
              description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload sanitized token diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-token-diagnostic-${{ github.run_id }}
          path: /tmp/cloudflare-diagnostic.txt
          retention-days: 3
          if-no-files-found: error

      - name: Upload sanitized deployment diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-diagnostic-${{ github.run_id }}
          path: /tmp/cloudflare-deploy-diagnostic.txt
          retention-days: 3
          if-no-files-found: error

      - name: Preserve deployment result
        if: steps.deploy.outcome != 'success'
        run: exit 1
