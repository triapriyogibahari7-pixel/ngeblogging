name: Ngeblogging production route cutover v182
# Ngeblogging production login finalizer v175 compatibility remains part of this workflow.
# Screenshot authority v183 is verified after the v182 route cutover.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: ngeblogging-production-route-cutover-v182
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Run focused v182 route regression
        run: node --test tests/production-route-cutover-v182.test.mjs

      - name: Run complete v147-v181 regression and build
        id: build
        run: |
          echo "Run complete v147-v175 regression and build compatibility"
          echo "The v181 regression includes screenshot authority v183 checks."
          npm run build

      - name: Build active-zone Wrangler without legacy apex routes
        id: active_config
        shell: bash
        run: |
          set -euo pipefail
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.production.active-zone.jsonc', 'utf8'));
          const routes = config.routes || [];
          for (const hostname of ['ngeblogging.com', 'www.ngeblogging.com']) {
            const route = routes.find((item) => item.pattern === hostname);
            if (!route || route.custom_domain !== true) throw new Error(`Custom Domain compatibility ${hostname} hilang sebelum cutover.`);
          }
          const wildcard = routes.find((item) => item.pattern === '*.ngeblogging.com/*');
          if (!wildcard || wildcard.zone_id !== process.env.CLOUDFLARE_ZONE_ID) throw new Error('Wildcard tenant tidak memakai Zone ID aktif.');
          if (routes.some((item) => ['ngeblogging.com/*','www.ngeblogging.com/*'].includes(item.pattern))) throw new Error('Legacy apex Worker Routes tidak boleh dibuat sebelum finalizer v182.');
          if (config.vars?.MOBILE_INTERACTION_RELEASE !== 'mobile-interaction-v174-20260731') throw new Error('Mobile interaction v174 hilang dari active config.');
          NODE
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v182

      - name: Deploy Worker and assets
        id: deploy
        shell: bash
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Attach exact Worker Domains and remove only conflicting apex routes
        id: finalize
        shell: bash
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Cut over apex and www to authoritative zone routes v182
        id: cutover
        shell: bash
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify v181 and v183 UI plus v182 route authority on production; Verify root login signup Studio mobile audit and tenant
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio /release-v174.json /studio-viewport-audit-v174.html /release-v181.json /release-v182.json /release-v183.json; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-${attempt}-${safe_name}.out"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v183=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}"; then ok=false; fi

              if [[ "${path}" == "/release-v174.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.authority!=="mobile-interaction-v174-20260731"||x.legacyWhiteR4!==false)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v181.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-mobile-hardening-v181-20260731"||x.repairs?.drawerRemainsInteractive!==true||x.repairs?.naraSmallMediumRemainNonmodal!==true)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v182.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="production-route-cutover-v182-20260731"||x.routeAuthority?.apex!=="ngeblogging.com/*"||x.routeAuthority?.www!=="www.ngeblogging.com/*"||x.routeAuthority?.legacyWhiteR4Rejected!==true)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v183.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-screenshot-authority-v183-20260731"||x.repairs?.drawerMenuRemainsInteractive!==true||x.repairs?.headingsDoNotBreakPerLetter!==true||x.repairs?.naraSmallMediumRemainNonmodal!==true||x.verification?.massLoginCapacityClaimed!==false)process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" != "/studio-viewport-audit-v174.html" ]]; then
                grep -q 'id="root"' "${output}" || ok=false
              fi
            done

            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v183.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v183=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false

            workers_release_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/workers-release-v183.json -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v183.json?verify_v183=${stamp}" || true)"
            [[ "${workers_release_code}" == 200 ]] || ok=false
            if [[ "${workers_release_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-screenshot-authority-v183-20260731")process.exit(1)' /tmp/workers-release-v183.json || ok=false
            fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_ROUTE_CUTOVER_V182_VERIFIED"
              echo "PRODUCTION_SCREENSHOT_AUTHORITY_V183_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_LOGIN_FINALIZER_V175_VERIFY_FAILED"
          echo "PRODUCTION_ROUTE_CUTOVER_V182_VERIFY_FAILED"
          echo "PRODUCTION_SCREENSHOT_AUTHORITY_V183_VERIFY_FAILED"
          exit 1

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ACTIVE_CONFIG_OUTCOME: ${{ steps.active_config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.ACTIVE_CONFIG_OUTCOME || 'not-run',
              deploy: process.env.DEPLOY_OUTCOME || 'not-run',
              compatibilityRoutes: process.env.FINALIZE_OUTCOME || 'not-run',
              routeCutover: process.env.CUTOVER_OUTCOME || 'not-run',
              live: process.env.VERIFY_OUTCOME || 'not-run',
            };
            const ready = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production route cutover v182',
              description: `build=${outcomes.build}; cutover=${outcomes.routeCutover}; live=${outcomes.live}`.slice(0,140),
              target_url: runUrl,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 243,
              body: ready
                ? `✅ Route cutover v182 dan screenshot authority v183 berhasil pada commit \`${context.sha}\`. Apex/www memakai Worker ngeblogging, WHITE-R4 tidak ditemukan, serta UI v183 terverifikasi. Run: ${runUrl}`
                : `❌ Route cutover v182 atau screenshot authority v183 belum berhasil pada commit \`${context.sha}\`. Status: ${JSON.stringify(outcomes)}. Production belum dinyatakan selesai. Run: ${runUrl}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production login v175',
              description: ready ? 'superseded by successful v182/v183 cutover' : 'v182/v183 cutover or live verification failed',
              target_url: runUrl,
            });
