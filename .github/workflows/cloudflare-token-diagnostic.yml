name: Ngeblogging production Studio v191

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-studio-v191
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"

      - name: Run v190 and v191 regression
        id: regression
        run: npm run verify:v191

      - name: Build production application
        id: build
        run: npm run build

      - name: Build active-zone Wrangler configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v191

      - name: Deploy Worker and assets
        id: deploy
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Preserve compatibility routing before cutover
        id: compatibility
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Cut over apex, www, and tenant routes
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify live auth, Studio, v191 assets and route authority
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio /release-v190.json /release-v191.json; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-v191-${attempt}-${safe_name}.out"
              headers="/tmp/ngeblogging-v191-${attempt}-${safe_name}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v191=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then ok=false; fi

              if [[ "${path}" == "/release-v190.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-real-device-v190-20260801")process.exit(1)' "${output}" || ok=false
              elif [[ "${path}" == "/release-v191.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-screenshot-recovery-v191-20260801"||x.repairs?.androidDesktopSiteRootScaleRemoved!==true||x.repairs?.drawerMenuClickable!==true||x.repairs?.naraSmallMediumNonModal!==true||x.repairs?.legacyWhiteR4RejectedByDeployment!==true)process.exit(1)' "${output}" || ok=false
              else
                grep -q 'id="root"' "${output}" || ok=false
              fi
            done

            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v191.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v191=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false

            workers_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/workers-v191.json -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v191.json?verify_v191=${stamp}" || true)"
            [[ "${workers_code}" == 200 ]] || ok=false
            if [[ "${workers_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-screenshot-recovery-v191-20260801")process.exit(1)' /tmp/workers-v191.json || ok=false
            fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_STUDIO_V191_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_STUDIO_V191_VERIFY_FAILED"
          exit 1

      - name: Publish production status
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              credentials: process.env.CREDENTIALS_OUTCOME || 'not-run',
              regression: process.env.REGRESSION_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.CONFIG_OUTCOME || 'not-run',
              deploy: process.env.DEPLOY_OUTCOME || 'not-run',
              compatibility: process.env.COMPATIBILITY_OUTCOME || 'not-run',
              cutover: process.env.CUTOVER_OUTCOME || 'not-run',
              verify: process.env.VERIFY_OUTCOME || 'not-run',
            };
            const ready = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ready ? 'success' : 'failure',
              context: 'Ngeblogging production Studio v191',
              description: `build=${outcomes.build}; cutover=${outcomes.cutover}; verify=${outcomes.verify}`.slice(0, 140),
              target_url: runUrl,
            });
