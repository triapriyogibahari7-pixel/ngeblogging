name: SaaS free-primary native PostgreSQL
on:
  push:
    branches: [fix/byod-saas-atomic-activation]
    paths:
      - server/drafts/saas-free-primary-handoff-v1.sql
      - tests/sql/saas-free-primary-handoff.sql
      - tests/sql/saas-free-primary-catalog-guards.sql
      - .github/workflows/saas-free-primary-native.yml
  pull_request:
    paths:
      - server/drafts/saas-free-primary-handoff-v1.sql
      - tests/sql/saas-free-primary-handoff.sql
      - tests/sql/saas-free-primary-catalog-guards.sql
      - .github/workflows/saas-free-primary-native.yml
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saas_primary_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: saas_primary_test
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Native regression and catalog-aligned guard slice
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/saas-free-primary-handoff.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/saas-free-primary-catalog-guards.sql
      - name: Concurrent refresh and complete rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -Atqc 'SELECT current_database()')" = saas_primary_test
          holder=''
          trap 'if [ -n "$holder" ]; then kill "$holder" 2>/dev/null || true; fi' EXIT
          PGAPPNAME=saas-handoff-holder psql -X -v ON_ERROR_STOP=1 >holder.log 2>&1 <<'SQL' &
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000010',true);
          UPDATE public.site_domains SET status='active',provider_status='active',ssl_status='active',is_primary=true WHERE hostname='www.example.test';
          SELECT pg_sleep(4);
          COMMIT;
          SQL
          holder=$!
          ready=0
          for i in $(seq 1 100); do
            if [ "$(psql -X -Atqc "SELECT count(*) FROM pg_stat_activity WHERE application_name='saas-handoff-holder' AND wait_event='PgSleep'")" = 1 ]; then ready=1; break; fi
            sleep 0.05
          done
          test "$ready" = 1
          PGOPTIONS='-c lock_timeout=500ms -c statement_timeout=2000' psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000010',true);
          SELECT public.handoff_expect($action$UPDATE public.site_domains SET status='active',provider_status='active',ssl_status='active',is_primary=true WHERE hostname='www.example.test'$action$,'55P03',NULL);
          ROLLBACK;
          SQL
          wait "$holder"
          holder=''
          PGOPTIONS='-c lock_timeout=5s -c statement_timeout=10000' psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000010',true);
          UPDATE public.site_domains SET status='active',provider_status='active',ssl_status='active',is_primary=true WHERE hostname='www.example.test';
          SELECT public.handoff_assert_active();
          COMMIT;
          SQL
          cat holder.log
