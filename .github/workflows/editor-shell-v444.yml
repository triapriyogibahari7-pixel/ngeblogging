name: Editor desktop v444 stage 1
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/ContentEditor.jsx', 'src/EditorShellV444.jsx', 'src/editor-shell-v444.css', 'scripts/editor-shell-v444.mjs', 'tests/editor-shell-v444.test.mjs', 'vite.config.js', '.github/workflows/editor-shell-v444.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/editor-shell-v444.test.mjs
      - run: npx vite build
