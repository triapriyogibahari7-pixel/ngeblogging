name: Editor tabs v445 stage 4a
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/EditorDesktopV445.jsx', 'src/editor-desktop-v445.css', 'scripts/editor-tabs-v445.mjs', 'tests/editor-tabs-v445.test.mjs', 'vite.config.js', '.github/workflows/editor-tabs-v445.yml']
permissions:
  contents: read
jobs:
  integration-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/editor-shell-v444.test.mjs tests/editor-tabs-v445.test.mjs tests/editor-catalog-v444.test.mjs tests/editor-presets-v444.test.mjs tests/editor-fonts-v444.test.mjs
      - run: npx vite build
