name: Apply visible site result v9 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-site-link-v9-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add visible public site links to Studio source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/StudioNext.jsx';
          let source = readFileSync(path, 'utf8');
          const replace = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Patch target missing: ${label}`);
            source = source.replace(from, to);
          };

          replace(
            '<div className="sn-top-actions"><button><Search/></button><button className="sn-nara-button" onClick={()=>setNaraOpen(true)}><Sparkles/> Tanya Nara</button>',
            '<div className="sn-top-actions">{site?.slug&&<a className="sn-view-site" href={`https://${site.slug}.ngeblogging.com`} target="_blank" rel="noreferrer" title="Lihat situs publik"><Eye/><span>Lihat situs</span></a>}<button aria-label="Cari"><Search/></button><button className="sn-nara-button" onClick={()=>setNaraOpen(true)}><Sparkles/> Tanya Nara</button>',
            'top site link',
          );

          replace(
            '<div><button onClick={()=>createDoc("page")}><BookOpen/> Buat Page</button><button className="sn-primary" onClick={()=>createDoc("article")}><FilePlus2/> Buat Post</button></div>',
            '<div>{site?.slug&&<a className="sn-secondary-link" href={`https://${site.slug}.ngeblogging.com`} target="_blank" rel="noreferrer"><Eye/> Lihat situs</a>}<button onClick={()=>createDoc("page")}><BookOpen/> Buat Page</button><button className="sn-primary" onClick={()=>createDoc("article")}><FilePlus2/> Buat Post</button></div>',
            'home site link',
          );

          if ((source.match(/Lihat situs/g) || []).length < 3) throw new Error('Visible site links were not added');
          writeFileSync(path, source);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "ngeblogging-release-bot"
          git config user.email "release-bot@ngeblogging.com"
          git add src/StudioNext.jsx
          git diff --cached --check
          git commit -m "Expose public site result throughout Studio"
          git push origin HEAD:main
