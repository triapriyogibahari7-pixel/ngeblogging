name: Ngeblogging custom-domain repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-custom-domain-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_SERVICE: ${{ vars.CLOUDFLARE_WORKER_SERVICE || 'ngeblogging' }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Repair Cloudflare Worker domains
        run: node scripts/attach-cloudflare-domains-v165.mjs

      - name: Verify public DNS and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for host in ngeblogging.com www.ngeblogging.com; do
            echo "=== ${host} ==="
            getent ahosts "${host}" | head -n 5
            code="$(curl -sS -L --connect-timeout 10 --max-time 30 -o "/tmp/${host}.html" -w '%{http_code}' -H 'cache-control: no-cache' "https://${host}/?custom-domain-repair=$(date +%s)")"
            test "${code}" = "200"
            grep -Eqi '<html|ngeblogging' "/tmp/${host}.html"
          done

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code="$(curl -sS -L --connect-timeout 10 --max-time 20 -o /tmp/health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${PUBLIC_SITE_URL%/}/api/health?custom-domain-repair=$(date +%s)" || true)"
            if [ "${code}" = "200" ] && grep -q '"status"' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health belum siap (${attempt}/12), menunggu 5 detik..."
            sleep 5
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Public smoke test passed
        run: |
          echo 'Custom-domain repair completed and public HTTPS smoke tests passed.'
          echo 'Runner repair retry marker: 2026-08-13T14:28+07:00'
