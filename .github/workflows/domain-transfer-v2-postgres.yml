name: Domain transfer V2 PostgreSQL smoke
on:
  push:
    branches: [fix/domain-react-api-timeout-diagnostics, feature/domain-stages5-10-integration-20261030]
    paths:
      - 'docs/drafts/domain-*.sql'
      - 'tests/sql/domain-transfer-v2-smoke.sql'
      - 'tests/browser/domain-transfer-catalog-matrix.html'
      - 'scripts/domain-stage5-native-acceptance.mjs'
      - '.github/workflows/domain-transfer-v2-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: domain_transfer_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated native database driver
        run: npm install --prefix "$RUNNER_TEMP/stage5-native-deps" --no-package-lock --ignore-scripts pg@8.13.1
      - name: Execute catalog matrix and native concurrent-session acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/stage5-native-deps/node_modules
          STAGE5_DISPOSABLE_NATIVE: 'true'
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: domain_transfer_test
          PGPASSWORD: isolated-ci-only
        run: node scripts/domain-stage5-native-acceptance.mjs
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-native-postgres-evidence
          path: output/stage5-native/result.json
          if-no-files-found: warn
          retention-days: 7
