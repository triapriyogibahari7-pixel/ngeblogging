name: Domain activation reconciliation tests

on:
  push:
    branches:
      - fix/domain-activation-reconciliation-20261122
    paths:
      - server/domain-handler.mjs
      - tests/domain-activation-reconciliation.test.mjs
      - .github/workflows/domain-activation-reconciliation-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-unit-tests:
    if: github.ref == 'refs/heads/fix/domain-activation-reconciliation-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run domain activation regression tests only
        run: node --test tests/domain-activation-reconciliation.test.mjs
