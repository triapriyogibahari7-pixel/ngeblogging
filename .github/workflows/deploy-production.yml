name: Deploy Ngeblogging Production v168-v169

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ngeblogging-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      VITE_SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      QWEN_API_KEY: ci-dry-run-only
      QWEN_WORKSPACE_ID: production-dry-run
      SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          test "$CLOUDFLARE_WORKER_SERVICE" = "ngeblogging" || { echo "CLOUDFLARE_WORKER_SERVICE_INVALID"; exit 1; }
          test "$CLOUDFLARE_ZONE_NAME" = "ngeblogging.com" || { echo "CLOUDFLARE_ZONE_NAME_INVALID"; exit 1; }

      - name: Install pinned dependencies
        id: dependencies
        run: npm ci --ignore-scripts

      - name: Run protected production contracts through v169
        id: contracts
        run: npm run test:production

      - name: Build production React assets
        id: build
        run: npm run build

      - name: Validate Cloudflare route recovery and first-site bundle
        id: dry_run
        run: npm run cloudflare:dry-run

      - name: Deploy Worker route v168 and first-site v169
        id: deploy_worker
        run: npm run deploy:cloudflare

      - name: Verify root login signup Studio auth route and first-site v169
        id: verify_production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            stamp=$(date +%s)
            root_code=$(curl -sS -D /tmp/root-headers.txt -o /tmp/root.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/?deploy_audit=$stamp" || true)
            www_code=$(curl -sS -D /tmp/www-headers.txt -o /tmp/www.html -w '%{http_code}' --max-time 20 "https://www.ngeblogging.com/?deploy_audit=$stamp" || true)
            login_code=$(curl -sS -D /tmp/login-headers.txt -o /tmp/login.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/login?deploy_audit=$stamp" || true)
            signup_code=$(curl -sS -D /tmp/signup-headers.txt -o /tmp/signup.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/signup?deploy_audit=$stamp" || true)
            studio_code=$(curl -sS -D /tmp/studio-headers.txt -o /tmp/studio.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/studio?deploy_audit=$stamp" || true)
            release168_code=$(curl -sS -o /tmp/release-v168.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/release-v168.json?deploy_audit=$stamp" || true)
            release169_code=$(curl -sS -D /tmp/release-v169-headers.txt -o /tmp/release-v169.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/release-v169.json?deploy_audit=$stamp" || true)
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/api/health?deploy_audit=$stamp" || true)
            auth_code=$(curl -sS -D /tmp/auth-headers.txt -o /tmp/auth-body.txt -w '%{http_code}' --max-time 20 \
              -X OPTIONS "https://ngeblogging.com/api/auth-proxy/auth/v1/token?grant_type=password&deploy_audit=$stamp" \
              -H 'Origin: https://ngeblogging.com' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: apikey,content-type,x-client-info' || true)

            root=$(cat /tmp/root.html 2>/dev/null || true)
            www=$(cat /tmp/www.html 2>/dev/null || true)
            login=$(cat /tmp/login.html 2>/dev/null || true)
            signup=$(cat /tmp/signup.html 2>/dev/null || true)
            studio=$(cat /tmp/studio.html 2>/dev/null || true)
            release168=$(tr -d '\n\r ' < /tmp/release-v168.json 2>/dev/null || true)
            release169=$(tr -d '\n\r ' < /tmp/release-v169.json 2>/dev/null || true)
            health=$(cat /tmp/health.json 2>/dev/null || true)
            root_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/root-headers.txt 2>/dev/null || true)
            www_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/www-headers.txt 2>/dev/null || true)
            login_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/login-headers.txt 2>/dev/null || true)
            signup_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/signup-headers.txt 2>/dev/null || true)
            studio_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/studio-headers.txt 2>/dev/null || true)
            release169_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/release-v169-headers.txt 2>/dev/null || true)
            auth_headers=$(tr '[:upper:]' '[:lower:]' < /tmp/auth-headers.txt 2>/dev/null || true)

            if [[ "$root" == *"ngeblogging-production-route-recovery-v168"* ]] \
              && [[ "$www" == *"ngeblogging-production-route-recovery-v168"* ]] \
              && [[ "$login" == *"ngeblogging-production-route-recovery-v168"* ]] \
              && [[ "$signup" == *"ngeblogging-production-route-recovery-v168"* ]] \
              && [[ "$studio" == *"ngeblogging-production-route-recovery-v168"* ]] \
              && [[ "$root" == *"ngeblogging-first-site-v169"* ]] \
              && [[ "$login" == *"ngeblogging-auth-callback-singleflight-v162"* ]] \
              && [[ "$root" == *'id="root"'* ]] \
              && [[ "$www" == *'id="root"'* ]] \
              && [[ "$login" == *'id="root"'* ]] \
              && [[ "$signup" == *'id="root"'* ]] \
              && [[ "$studio" == *'id="root"'* ]] \
              && [[ "$root" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$www" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$login" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$signup" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$studio" != *"WHITE-R4-2026.07.12"* ]] \
              && [[ "$release168" == *'"release":"2026.07.30-production-route-recovery-v168"'* ]] \
              && [[ "$release169" == *'"firstSiteRelease":"first-site-onboarding-v169-20260730"'* ]] \
              && [[ "$release169" == *'"maxSitesPerAccount":25'* ]] \
              && [[ "$release169" == *'"firstSiteBeforeStudio":true'* ]] \
              && [[ "$release169" == *'"installAppProfileAction":true'* ]] \
              && [[ "$release169" == *'"legacyWhiteR4":false'* ]] \
              && [[ "$health" == *"2026.07.30-auth-gateway-v153"* ]] \
              && [[ "$root_headers" == *"x-ngeblogging-production-recovery: 2026.07.30-production-route-recovery-v168"* ]] \
              && [[ "$www_headers" == *"x-ngeblogging-production-recovery: 2026.07.30-production-route-recovery-v168"* ]] \
              && [[ "$root_headers" == *"x-ngeblogging-first-site: first-site-onboarding-v169-20260730"* ]] \
              && [[ "$login_headers" == *"x-ngeblogging-auth-entry: 2026.07.30-auth-entry-v158"* ]] \
              && [[ "$signup_headers" == *"x-ngeblogging-ui-contract: 2026.07.30-studio-ui-contract-v160"* ]] \
              && [[ "$studio_headers" == *"x-ngeblogging-studio-route: 2026.07.30-studio-route-v160"* ]] \
              && [[ "$release169_headers" == *"x-ngeblogging-site-policy: site-policy-v169-20260730"* ]] \
              && [[ "$auth_headers" == *"2026.07.30-auth-gateway-v153"* ]] \
              && [[ "$root_code" == "200" ]] \
              && [[ "$www_code" == "200" ]] \
              && [[ "$login_code" == "200" ]] \
              && [[ "$signup_code" == "200" ]] \
              && [[ "$studio_code" == "200" ]] \
              && [[ "$release168_code" == "200" ]] \
              && [[ "$release169_code" == "200" ]] \
              && [[ "$health_code" == "200" ]] \
              && [[ "$auth_code" == "204" ]]; then
              echo "Production route v168 and first-site v169 verified on attempt $attempt."
              exit 0
            fi

            echo "Route v168 / first-site v169 belum aktif (attempt $attempt/48)."
            sleep 10
          done
          echo "DEPLOY_VERIFY_PRODUCTION_V168_V169_FAILED"
          exit 1

      - name: Publish production deployment status to issue 243
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          DEPLOY_WORKER_OUTCOME: ${{ steps.deploy_worker.outcome }}
          VERIFY_PRODUCTION_OUTCOME: ${{ steps.verify_production.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = process.env.JOB_STATUS || "unknown";
            const icon = status === "success" ? "✅" : "❌";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## ${icon} Deployment produksi v168-v169 ${status}`,
              "",
              `- Commit: \`${context.sha}\``,
              `- Run: ${runUrl}`,
              `- Route authority: \`2026.07.30-production-route-recovery-v168\``,
              `- First-site authority: \`first-site-onboarding-v169-20260730\``,
              `- Site policy: \`site-policy-v169-20260730\` (maksimal 25 situs milik akun)`,
              `- Waktu UTC: \`${new Date().toISOString()}\``,
              "",
              "### Hasil tahap",
              `- Kredensial: **${process.env.CREDENTIALS_OUTCOME || "not-run"}**`,
              `- Dependensi: **${process.env.DEPENDENCIES_OUTCOME || "not-run"}**`,
              `- Regression: **${process.env.CONTRACTS_OUTCOME || "not-run"}**`,
              `- Build React: **${process.env.BUILD_OUTCOME || "not-run"}**`,
              `- Dry-run Cloudflare: **${process.env.DRY_RUN_OUTCOME || "not-run"}**`,
              `- Deploy route Worker: **${process.env.DEPLOY_WORKER_OUTCOME || "not-run"}**`,
              `- Verifikasi root/login/Studio/auth/onboarding: **${process.env.VERIFY_PRODUCTION_OUTCOME || "not-run"}**`,
              "",
              status === "success"
                ? "Route v168 aktif, WHITE-R4 hilang, auth surface lulus, dan marker onboarding/kuota v169 tampil di produksi."
                : "Produksi belum dinyatakan selesai. Lihat run untuk tahap yang gagal.",
            ].join("\n");
            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 243,
              body,
              state: status === "success" ? "closed" : "open",
            };
            if (status === "success") update.state_reason = "completed";
            await github.rest.issues.update(update);
