name: Deploy Ngeblogging Production v172 manual fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ngeblogging-production-v172-manual-fallback
  cancel-in-progress: false

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate complete production source
        run: npm run build

      - name: Explain fallback behavior
        run: |
          echo "This workflow is validation-only and manual."
          echo "Use Ngeblogging production login finalizer v175 for deployment, exact Worker Domains, route cleanup, and live verification."
