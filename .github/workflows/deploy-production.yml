name: Deploy Ngeblogging Production v172 Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]]
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]]
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run protected production contracts through v173
        run: npm run test:production

      - name: Build production React assets
        run: npm run build

      - name: Validate Cloudflare Custom Domain bundle
        run: npm run cloudflare:dry-run

      - name: Build active-zone Custom Domain configuration
        run: |
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-manual-v173

      - name: Deploy Worker and React assets v172
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Attach and verify exact apex and www Worker Domains
        run: npm run cloudflare:attach-domains

      - name: Remove only legacy apex routes and preserve wildcard tenant
        run: npm run cloudflare:finalize-routes

      - name: Verify root login signup Studio auth onboarding and mobile layout v172
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            stamp="$(date +%s)-${attempt}"
            release_code="$(curl -sS -L --max-time 20 -o /tmp/release-v172.json -w '%{http_code}' "https://ngeblogging.com/release-v172.json?manual=${stamp}" || true)"
            root_code="$(curl -sS -L --max-time 20 -o /tmp/root.html -w '%{http_code}' "https://ngeblogging.com/?manual=${stamp}" || true)"
            login_code="$(curl -sS -L --max-time 20 -o /tmp/login.html -w '%{http_code}' "https://ngeblogging.com/login?manual=${stamp}" || true)"
            studio_code="$(curl -sS -L --max-time 20 -o /tmp/studio.html -w '%{http_code}' "https://ngeblogging.com/studio?manual=${stamp}" || true)"
            release="$(tr -d '\n\r ' < /tmp/release-v172.json 2>/dev/null || true)"
            pages="$(cat /tmp/root.html /tmp/login.html /tmp/studio.html 2>/dev/null || true)"
            if [[ "${release_code}" == 200 && "${root_code}" == 200 && "${login_code}" == 200 && "${studio_code}" == 200 ]] \
              && [[ "${release}" == *'"release":"2026.07.30-production-custom-domain-v172"'* ]] \
              && [[ "${release}" == *'"maxSitesPerAccount":25'* ]] \
              && [[ "${release}" == *'"firstSiteBeforeStudio":true'* ]] \
              && [[ "${release}" == *'"legacyWhiteR4":false'* ]] \
              && [[ "${pages}" == *"ngeblogging-mobile-public-v171"* ]] \
              && [[ "${pages}" != *"WHITE-R4-2026.07.12"* ]]; then
              echo "Manual fallback production v173 verified."
              exit 0
            fi
            sleep 10
          done
          echo "DEPLOY_VERIFY_PRODUCTION_CUSTOM_DOMAIN_V172_FAILED"
          exit 1

      - name: Record manual fallback result on issue 243
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 243,
              body: `Manual fallback v172/v173 finished with job status **${{ job.status }}**. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
