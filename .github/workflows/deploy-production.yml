name: Deploy Ngeblogging Production v201

on:
  push:
    branches: [main, production]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "cloudflare/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.production.jsonc"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v201
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate production regressions and build
        run: npm run build

      - name: Verify v201 build markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'studio-production-v201-20260802' public/release-v201.json
          grep -q 'ngeblogging-app-v201-production-ui-20260802' public/sw.js
          grep -q 'ngeblogging-pwa-v201-20260802' src/pwa-runtime.js
          grep -q 'studio-production-v201.js' src/Studio.jsx
          test -d dist
          test -f dist/index.html

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify live release marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v201.json?verify=${GITHUB_SHA}" | grep -q 'studio-production-v201-20260802'; then
              echo "Live release v201 confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose release-v201.json after deployment." >&2
          exit 1

      - name: Verify live service worker version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?verify=${GITHUB_SHA}" | grep -q 'ngeblogging-app-v201-production-ui-20260802'
