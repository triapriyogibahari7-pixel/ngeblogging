name: Editor formulas v453 stage 6c
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/lib/editor-formulas-v453.mjs', 'src/EditorFormulaToolsV453.jsx', 'src/editor-formulas-v453.css', 'scripts/editor-formulas-v453.mjs', 'tests/editor-formulas-v453.test.mjs', 'tests/editor-formulas-v453.browser.mjs', 'vite.config.js', '.github/workflows/editor-formulas-v453.yml']
permissions:
  contents: read
jobs:
  formulas-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/editor-formulas-v453.test.mjs tests/editor-table-v450.test.mjs tests/content-limit-v449.test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor-formulas-v453.browser.mjs
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-formula-report
          path: editor-formula-report.json
          if-no-files-found: ignore
