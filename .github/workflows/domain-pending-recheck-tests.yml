name: Pending-zone recheck source tests
on:
  pull_request:
    paths:
      - 'shared/domain-pending-recheck-policy.mjs'
      - 'server/domain-pending-recheck-*.mjs'
      - 'src/DomainActivationRecheck.jsx'
      - 'src/DomainConnectionMenu.jsx'
      - 'cloudflare/domain-recovery-worker-v2.mjs'
      - 'tests/domain-pending-recheck.test.mjs'
      - 'supabase/migrations/*domain_pending_recheck*'
      - '.github/workflows/domain-pending-recheck-tests.yml'
permissions:
  contents: read
jobs:
  pending-recheck-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: node --test tests/domain-pending-recheck.test.mjs
