name: Deploy API Keys v135 Now

on:
  pull_request:
    branches:
      - main
    paths:
      - ".deploy-api-keys-v135"

permissions:
  contents: read

concurrency:
  group: ngeblogging-api-keys-v135-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/api-keys-v135-now'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      QWEN_API_KEY: ci-dry-run-only
      QWEN_WORKSPACE_ID: production-dry-run

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npm run cloudflare:dry-run

      - name: Deploy to Cloudflare production
        run: npm run deploy:cloudflare

      - name: Verify production marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp=$(date +%s)
            worker=$(curl -fsSL --max-time 20 "https://ngeblogging.com/sw.js?deploy_audit=$stamp" || true)
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/api/health?deploy_audit=$stamp" || true)
            if [[ "$worker" == *"ngeblogging-app-v135-api-keys-20260729"* ]] && [[ "$health_code" == "200" ]]; then
              echo "API Keys v135 is live."
              exit 0
            fi
            echo "Waiting for v135 production propagation ($attempt/30)."
            sleep 10
          done
          echo "V135_PRODUCTION_VERIFY_FAILED"
          exit 1
