name: Cloudflare for SaaS optional manual audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-optional-saas-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
      SAAS_ZONE_NAME: ngeblogging.com
      SAAS_HEALTH_URL: https://ngeblogging.com/api/health

    steps:
      - name: Read-only Cloudflare for SaaS capability audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const apiBase = 'https://api.cloudflare.com/client/v4';
          const zoneName = String(process.env.SAAS_ZONE_NAME || '');
          const healthUrl = String(process.env.SAAS_HEALTH_URL || '');
          const candidates = [
            { source: 'domain', token: String(process.env.CLOUDFLARE_DOMAIN_API_TOKEN || '') },
            { source: 'deploy', token: String(process.env.CLOUDFLARE_API_TOKEN || '') },
          ].filter((candidate) => candidate.token);
          const evidencePath = '/tmp/ngeblogging-optional-saas-v72.json';
          const evidence = {
            checkedAt: new Date().toISOString(),
            release: '2026.07.27-optional-saas-audit-v72',
            mode: 'manual-read-only',
            productionProvider: 'cloudflare-full-zone',
            requiredForProduction: false,
            zoneName,
            customHostnamesApi: false,
            customHostnamesTokenSource: null,
            customHostnamesTokenProbes: [],
            health: null,
            error: null,
          };

          async function raw(path, token) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
            });
            const payload = await response.json().catch(() => ({}));
            return { response, payload };
          }

          try {
            if (!candidates.length) throw new Error('Token Cloudflare audit belum tersedia.');
            let zoneId = '';
            for (const candidate of candidates) {
              const zones = await raw(`/zones?name=${encodeURIComponent(zoneName)}&status=active&per_page=10`, candidate.token);
              const zone = Array.isArray(zones.payload?.result)
                ? zones.payload.result.find((item) => item?.name === zoneName && item?.status === 'active')
                : null;
              if (zones.response.ok && zones.payload?.success === true && zone?.id) {
                zoneId = String(zone.id);
                break;
              }
            }
            if (!/^[a-f0-9]{32}$/i.test(zoneId)) throw new Error(`Zone aktif ${zoneName} belum dapat dibaca oleh token audit.`);

            for (const candidate of candidates) {
              const probe = await raw(`/zones/${zoneId}/custom_hostnames?per_page=5`, candidate.token);
              const allowed = probe.response.ok
                && probe.payload?.success === true
                && Array.isArray(probe.payload?.result);
              evidence.customHostnamesTokenProbes.push({
                source: candidate.source,
                httpStatus: probe.response.status,
                allowed,
                errors: probe.payload?.errors || [],
              });
              if (allowed && !evidence.customHostnamesTokenSource) {
                evidence.customHostnamesTokenSource = candidate.source;
                evidence.customHostnamesApi = true;
              }
            }

            const healthResponse = await fetch(`${healthUrl}?optional_saas_audit=${Date.now()}`, {
              headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            });
            const health = await healthResponse.json().catch(() => ({}));
            evidence.health = {
              httpStatus: healthResponse.status,
              status: health?.status || null,
              productionProvider: health?.customDomainProvider || null,
              paidSaasRequired: health?.customDomainPaidSaasRequired ?? null,
              freeSubdomainPersistent: health?.customDomainArchitecture?.freeSubdomainPersistent ?? null,
            };

            if (health?.customDomainProvider !== 'cloudflare-full-zone') {
              throw new Error('Produksi tidak melaporkan provider Full Zone gratis.');
            }
            if (health?.customDomainPaidSaasRequired !== false) {
              throw new Error('Produksi belum menegaskan bahwa SaaS berbayar tidak diperlukan.');
            }
          } catch (error) {
            evidence.error = { message: String(error?.message || error) };
          } finally {
            fs.writeFileSync(evidencePath, JSON.stringify(evidence, null, 2));
            console.log(JSON.stringify(evidence, null, 2));
          }
          NODE

      - name: Upload optional SaaS audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-optional-saas-v72-${{ github.run_id }}
          path: /tmp/ngeblogging-optional-saas-v72.json
          if-no-files-found: error
          retention-days: 3
