name: Studio v248 PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "public/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/studio-v248-pr.yml"

permissions:
  contents: read

concurrency:
  group: studio-v248-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build v248
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run production regression contracts
        run: npm run test:production

      - name: Build production bundle
        run: npm run build
