name: Inspect current v9 live Studio source

on:
  push:
    branches: [ci/verify-v8-live]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify deployed Studio source, Nara, themes, and readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Live v9 inspection ${attempt}/30"
            if node --input-type=module <<'NODE'
          const site = 'https://ngeblogging.com';
          const stamp = `inspect=${Date.now()}`;
          const get = async (url, options = {}) => {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}${stamp}`, {
              ...options,
              headers: { 'cache-control': 'no-cache', ...(options.headers || {}) },
            });
            return { response, text: await response.text() };
          };

          try {
            const [healthResult, swResult, htmlResult] = await Promise.all([
              get(`${site}/api/health`),
              get(`${site}/sw.js`),
              get(`${site}/`),
            ]);
            if (!healthResult.response.ok || !swResult.response.ok || !htmlResult.response.ok) throw new Error('public endpoints unavailable');
            const health = JSON.parse(healthResult.text || '{}');

            const queue = [...htmlResult.text.matchAll(/(?:src|href)="([^"]+\.(?:js|css)(?:\?[^\"]*)?)"/g)].map((match) => new URL(match[1], site).href);
            const seen = new Set();
            const assets = new Map();
            for (let depth = 0; depth < 7; depth += 1) {
              const batch = [...new Set(queue)].filter((url) => !seen.has(url));
              if (!batch.length) break;
              batch.forEach((url) => seen.add(url));
              await Promise.all(batch.map(async (url) => {
                const result = await get(url);
                if (!result.response.ok) throw new Error(`asset ${url} returned ${result.response.status}`);
                assets.set(url, result.text);
                for (const match of result.text.matchAll(/(?:^|["'(])\/?(assets\/[A-Za-z0-9._-]+\.(?:js|css))/g)) queue.push(new URL(`/${match[1]}`, site).href);
              }));
            }

            const studioEntry = [...assets.entries()].find(([url]) => /\/assets\/Studio-[^/]+\.js(?:\?|$)/.test(url));
            if (!studioEntry) throw new Error('Studio production chunk not found');
            const [studioUrl, studioJs] = studioEntry;
            const allAssets = [...assets.values()].join('\n');
            const errors = [];

            if (!swResult.text.includes('ngeblogging-app-v8-20260724')) errors.push('PWA v8');
            if (!studioJs.includes('studio-source-navigation-v9-20260724')) errors.push('Studio source navigation v9 marker');
            for (const forbidden of ['sn-mobile-nav', 'sn-mobile-sheet-layer', 'mobileMore', 'sn-side-bottom']) {
              if (studioJs.includes(forbidden)) errors.push(`React still contains ${forbidden}`);
            }
            if (studioJs.includes('Pembayaran')) errors.push('inactive payment destination still bundled in Studio');
            if ((studioJs.match(/sn-icon/g) || []).length !== 1) errors.push('Studio does not have exactly one sidebar toggle');
            for (const required of ['Pengaturan', 'Keluar', 'Nara AI', 'Domain', 'Situs saya', '.ngeblogging.com']) {
              if (!studioJs.includes(required)) errors.push(`Studio missing ${required}`);
            }

            if (health.nara !== true || !health.naraProviders || (!health.naraProviders.qwen && !health.naraProviders.workersAi)) errors.push('Nara provider');
            if (health.managedSubdomains !== true || health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push('managed subdomain/site limits');
            if (health.billing !== false) errors.push('billing should remain hidden until live');
            if (health.emailRegistration !== false) errors.push('email registration should remain hidden until delivery passes');
            if (health.customDomains !== false) errors.push('custom domains should remain hidden until provisioning is configured');

            const nara = await get(`${site}/api/nara`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', origin: site },
              body: JSON.stringify({ message: 'uji koneksi', model: 'nara-mini', intelligence: 'standard', attachments: [], history: [] }),
            });
            let naraPayload = {};
            try { naraPayload = JSON.parse(nara.text || '{}'); } catch {}
            if (nara.response.status !== 401 || naraPayload.code !== 'NARA_SESSION_REQUIRED') errors.push(`Nara auth ${nara.response.status}/${naraPayload.code || 'none'}`);
            if (/konfigurasi autentikasi/i.test(String(naraPayload.error || ''))) errors.push('obsolete Nara authentication configuration error');

            for (const marker of ['Mobile', 'Tablet', 'Laptop', 'Komputer', 'tn-widget-summary', 'ng-widget-recent-posts', 'ng-widget-popular-posts']) {
              if (!allAssets.includes(marker)) errors.push(`theme/widget ${marker}`);
            }
            const families = ['Editorial', 'Journal', 'Newsroom', 'Business', 'Collective', 'Forum', 'Canvas', 'Identity', 'Diary', 'Atlas', 'Magazine', 'Market', 'Voyage', 'Academy', 'Wellness', 'Circuit', 'Lens', 'Prime', 'Dawn', 'Night', 'Coast', 'Atelier'];
            if (!families.every((name) => allAssets.includes(name))) errors.push('100-theme family catalog');

            console.log(JSON.stringify({
              health,
              studioUrl,
              assetCount: assets.size,
              nara: { status: nara.response.status, code: naraPayload.code },
              errors,
            }, null, 2));
            if (errors.length) process.exit(1);
            console.log('LIVE_STUDIO_SOURCE_V9_CONFIRMED');
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          NODE
            then
              exit 0
            fi
            sleep 20
          done
          echo "Production did not expose the v9 Studio source within ten minutes."
          exit 1
