name: Isolated domain reference FX check
on:
  push:
    branches: [fix/domain-reference-fx-recovery-20261104]
    paths:
      - server/domain-reference-fx.mjs
      - tests/domain-reference-fx.test.mjs
      - scripts/probe-domain-reference-fx.mjs
      - .github/workflows/domain-reference-fx-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Test existing FX safety contract
        run: node --test tests/domain-reference-fx.test.mjs
      - name: Probe public reference endpoint with existing validator
        if: always()
        run: node scripts/probe-domain-reference-fx.mjs
