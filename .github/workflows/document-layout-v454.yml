name: Document layout v454 stage 7
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/lib/document-layout-v454.mjs', 'src/DocumentLayoutToolsV454.jsx', 'src/document-layout-v454.css', 'scripts/document-layout-v454.mjs', 'tests/document-layout-v454.test.mjs', 'tests/document-layout-v454.browser.mjs', 'vite.config.js', '.github/workflows/document-layout-v454.yml']
permissions:
  contents: read
jobs:
  document-layout-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/document-layout-v454.test.mjs tests/editor-formulas-v453.test.mjs tests/content-limit-v449.test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/document-layout-v454.browser.mjs
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-layout-report
          path: document-layout-report.json
          if-no-files-found: ignore
