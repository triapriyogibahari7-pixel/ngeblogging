name: Editor advanced table v451 stage 6b
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/lib/editor-table-v451.mjs', 'src/EditorTableToolsV450.jsx', 'tests/editor-table-v451.browser.mjs', '.github/workflows/editor-table-v451.yml']
permissions:
  contents: read
jobs:
  advanced-table-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/editor-table-v450.test.mjs tests/content-limit-v449.test.mjs tests/editor-media-v448.test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/editor-table-v451.browser.mjs
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-table-advanced-report
          path: editor-table-advanced-report.json
          if-no-files-found: ignore
