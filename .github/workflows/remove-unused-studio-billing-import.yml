name: Remove unused Studio billing import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-unused-studio-billing-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove unused imports from Studio source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/StudioNext.jsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Activity, BarChart3, BookOpen, Check, ChevronDown, Cloud, CloudOff, CreditCard,', 'Activity, BarChart3, BookOpen, Check, ChevronDown, Cloud, CloudOff,')
          text = text.replace('  Menu, MoreHorizontal, Palette, PanelLeftClose, Plus, Search, Send, Settings,', '  MoreHorizontal, Palette, PanelLeftClose, Plus, Search, Send, Settings,')
          text = text.replace('import BillingView from "./BillingView";\n', '')
          if 'BillingView' in text or 'CreditCard' in text or '\n  Menu,' in text:
              raise SystemExit('Inactive Studio import remains')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit clean Studio source
        shell: bash
        run: |
          git config user.name "ngeblogging-release-bot"
          git config user.email "release-bot@ngeblogging.com"
          git add src/StudioNext.jsx
          git diff --cached --check
          git commit -m "Remove unused inactive billing code from Studio bundle"
          git pull --rebase origin main
          git push origin HEAD:main
