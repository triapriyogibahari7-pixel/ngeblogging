name: Apply source navigation v9 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-navigation-v9-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove bottom navigation and inactive billing from React source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'src/StudioNext.jsx';
          let source = readFileSync(path, 'utf8');
          const replace = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Patch target missing: ${label}`);
            source = source.replace(from, to);
          };

          replace('  const [mobileMore,setMobileMore] = useState(false);\n', '', 'mobileMore state');
          replace('  const chooseView=(next)=>{setView(next);setMobileMore(false);if(["posts","pages"].includes(next))setQuery("");};', '  const chooseView=(next)=>{setView(next);if(["posts","pages"].includes(next))setQuery("");};', 'chooseView mobile sheet reset');

          replace(
            '<button className={view==="domain"?"active":""} onClick={()=>chooseView("domain")}><Globe2/><span>Domain</span></button><button className={view==="billing"?"active":""} onClick={()=>chooseView("billing")}><CreditCard/><span>Pembayaran</span></button></nav><div className="sn-side-bottom"><button className={view==="settings"?"active":""} onClick={()=>chooseView("settings")}><Settings/><span>Pengaturan</span></button><button onClick={onExit}><LogOut/><span>Keluar</span></button></div></aside>',
            '<button className={view==="domain"?"active":""} onClick={()=>chooseView("domain")}><Globe2/><span>Domain</span></button><button className={view==="settings"?"active":""} onClick={()=>chooseView("settings")}><Settings/><span>Pengaturan</span></button><button onClick={onExit}><LogOut/><span>Keluar</span></button></nav></aside>',
            'sidebar destinations',
          );

          replace(' {view==="billing"&&<BillingView user={user} setToast={setToast}/>} ', ' ', 'billing view');

          source = source
            .replace(/^\s*<nav className="sn-mobile-nav">.*\n/m, '')
            .replace(/^\s*\{mobileMore&&<div className="sn-mobile-sheet-layer">.*\n/m, '');

          const forbidden = ['sn-mobile-nav', 'sn-mobile-sheet-layer', 'mobileMore', 'sn-side-bottom', 'view==="billing"', '<BillingView', '<span>Pembayaran</span>'];
          for (const token of forbidden) {
            if (source.includes(token)) throw new Error(`Forbidden source token remains: ${token}`);
          }
          if ((source.match(/className="sn-icon"/g) || []).length !== 1) throw new Error('Studio must contain exactly one sidebar toggle');

          writeFileSync(path, source);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "ngeblogging-release-bot"
          git config user.email "release-bot@ngeblogging.com"
          git add src/StudioNext.jsx
          git diff --cached --check
          git commit -m "Remove bottom navigation from Studio source"
          git push origin HEAD:main
