name: Advanced Studio Check

on:
  pull_request:
  push:
    branches:
      - agent/advanced-studio-sites-editor-media

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
