name: Ngeblogging live diagnostic

on:
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-live-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe apex, tenant, analytics, Nara, PWA, and Studio operations
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/ngeblogging-live
          stamp="$(date +%s)"

          for attempt in $(seq 1 18); do
            curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/health.headers -o /tmp/ngeblogging-live/health.body -w '%{http_code}\n' "https://ngeblogging.com/api/health?diagnostic=v62-${stamp}-${attempt}" > /tmp/ngeblogging-live/health.status 2>/tmp/ngeblogging-live/health.curl-error || true
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const health = JSON.parse(fs.readFileSync('/tmp/ngeblogging-live/health.body', 'utf8'));
            if (health.status !== 'ok' || health.domainRelease !== '2026.07.27-full-zone-domains-v62' || health.customDomainBindings?.domainApiToken !== true) process.exit(1);
          } catch { process.exit(1); }
          NODE
            then
              break
            fi
            sleep 10
          done

          curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/index.headers -o /tmp/ngeblogging-live/index.body -w '%{http_code}\n' "https://ngeblogging.com/?diagnostic=${stamp}" > /tmp/ngeblogging-live/index.status 2>/tmp/ngeblogging-live/index.curl-error || true
          curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/sw.headers -o /tmp/ngeblogging-live/sw.body -w '%{http_code}\n' "https://ngeblogging.com/sw.js?diagnostic=${stamp}" > /tmp/ngeblogging-live/sw.status 2>/tmp/ngeblogging-live/sw.curl-error || true
          curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/tenant.headers -o /tmp/ngeblogging-live/tenant.body -w '%{http_code}\n' "https://tri-apriyogi-bahari.ngeblogging.com/?diagnostic=${stamp}" > /tmp/ngeblogging-live/tenant.status 2>/tmp/ngeblogging-live/tenant.curl-error || true
          curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/analytics.headers -o /tmp/ngeblogging-live/analytics.body -w '%{http_code}\n' \
            -X POST -H 'content-type: application/json' -H 'origin: https://tri-apriyogi-bahari.ngeblogging.com' -H 'user-agent: NgebloggingLiveDiagnostic/62' \
            --data "{\"path\":\"/__live-diagnostic-v62\",\"visitorId\":\"diag-${stamp}\",\"sessionId\":\"diag-${stamp}\",\"language\":\"id-ID\",\"screenWidth\":390}" \
            "https://tri-apriyogi-bahari.ngeblogging.com/api/analytics/collect?diagnostic=${stamp}" > /tmp/ngeblogging-live/analytics.status 2>/tmp/ngeblogging-live/analytics.curl-error || true
          curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/ngeblogging-live/nara.headers -o /tmp/ngeblogging-live/nara.body -w '%{http_code}\n' \
            -X POST -H 'content-type: application/json' -H 'origin: https://ngeblogging.com' \
            --data '{"message":"uji","model":"nara-mini","intelligence":"standard","attachments":[],"history":[]}' \
            "https://ngeblogging.com/api/nara?diagnostic=${stamp}" > /tmp/ngeblogging-live/nara.status 2>/tmp/ngeblogging-live/nara.curl-error || true

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'https://ngeblogging.com';
          const index = fs.readFileSync('/tmp/ngeblogging-live/index.body', 'utf8');
          const queue = [...index.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)]
            .map((match) => new URL(match[1], root).href);
          const visited = new Set();
          const assets = [];
          while (queue.length && visited.size < 140) {
            const url = queue.shift();
            if (!url || visited.has(url)) continue;
            visited.add(url);
            try {
              const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}diagnostic=${Date.now()}`, { headers:{ 'cache-control':'no-cache' } });
              const text = await response.text();
              assets.push({ url, status:response.status, text });
              if (response.ok && /\.js(?:\?|$)/i.test(url)) {
                for (const match of text.matchAll(/["']((?:\/assets\/|\.\/)[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)) {
                  const child = new URL(match[1], url).href;
                  if (child.startsWith(`${root}/assets/`) && !visited.has(child)) queue.push(child);
                }
              }
            } catch (error) {
              assets.push({ url, status:0, text:String(error) });
            }
          }
          const combined = assets.map((asset) => asset.text).join('\n');
          const required = {
            responsiveV43:combined.includes('studio-responsive-repair-v43-20260726'),
            operations:combined.includes('studio-operations-v41-20260726'),
            analytics:combined.includes('get_site_analytics_dashboard') && combined.includes('DATA PRODUKSI NYATA'),
            members:combined.includes('get_site_member_quota') && combined.includes('/api/member-invitations/create'),
            domains:combined.includes('/api/domains/register') && combined.includes('/api/domains/remove'),
            activeSite:combined.includes('SITUS YANG SEDANG DIKELOLA') && combined.includes('Tambah situs'),
            domainFailoverV61:combined.includes('api-origin-failover-v61-20260727'),
            domainPrecisionV61:combined.includes('domain-mobile-precision-v61-20260727'),
          };
          const ok = Object.values(required).every(Boolean) && assets.every((asset) => asset.status === 200);
          fs.writeFileSync('/tmp/ngeblogging-live/operations.status', ok ? 'true' : 'false');
          fs.writeFileSync('/tmp/ngeblogging-live/bundle-markers.json', JSON.stringify({ required, assets:assets.map(({url,status}) => ({url,status})) }, null, 2));
          NODE

          {
            echo "Ngeblogging live diagnostic ${stamp}"
            for name in health index sw tenant analytics nara; do
              printf '%-10s HTTP %s\n' "$name" "$(cat /tmp/ngeblogging-live/${name}.status 2>/dev/null || echo missing)"
            done
            printf '%-10s %s\n' "operations" "$(cat /tmp/ngeblogging-live/operations.status 2>/dev/null || echo missing)"
            echo
            echo "HEALTH:"; cat /tmp/ngeblogging-live/health.body 2>/dev/null || true
            echo; echo "ANALYTICS:"; cat /tmp/ngeblogging-live/analytics.body 2>/dev/null || true
            echo; echo "NARA:"; cat /tmp/ngeblogging-live/nara.body 2>/dev/null || true
            echo; echo "BUNDLE MARKERS:"; cat /tmp/ngeblogging-live/bundle-markers.json 2>/dev/null || true
            echo; echo "SERVICE WORKER MARKERS:"; grep -Eo 'ngeblogging-app-v[0-9]+-[0-9]+' /tmp/ngeblogging-live/sw.body 2>/dev/null | head -20 || true
          } | tee /tmp/ngeblogging-live/summary.txt

      - name: Publish diagnostic commit status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const read = (name) => { try { return fs.readFileSync(`/tmp/ngeblogging-live/${name}`, 'utf8').trim(); } catch { return 'missing'; } };
            const healthCode = read('health.status');
            const indexCode = read('index.status');
            const swCode = read('sw.status');
            const tenantCode = read('tenant.status');
            const analyticsCode = read('analytics.status');
            const naraCode = read('nara.status');
            const operations = read('operations.status');
            const sw = read('sw.body');
            const index = read('index.body');
            let health = {};
            try { health = JSON.parse(read('health.body')); } catch {}
            const bindings = health.customDomainBindings || {};
            const ok = healthCode === '200'
              && indexCode === '200'
              && swCode === '200'
              && tenantCode === '200'
              && analyticsCode === '202'
              && naraCode === '401'
              && operations === 'true'
              && health.release === '2026.07.27-domain-api-v60'
              && health.domainRelease === '2026.07.27-full-zone-domains-v62'
              && health.customDomains === true
              && health.customDomainProvider === 'cloudflare-full-zone'
              && health.customDomainMode === 'full-zone-nameserver'
              && bindings.apiToken === true
              && bindings.domainApiToken === true
              && bindings.accountId === true
              && bindings.workerService === true
              && bindings.databaseAccess === true
              && health.siteCapacity?.mode === 'fixed'
              && health.siteCapacity?.defaultLimit === 12
              && health.siteLimits?.maximum === 12
              && sw.includes('ngeblogging-app-v61-20260727')
              && index.includes('/src/domain-mobile-precision-v61.js');
            const sha = context.eventName === 'workflow_run' ? context.payload.workflow_run.head_sha : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'Ngeblogging live diagnostic',
              description: `health ${healthCode}; tenant ${tenantCode}; domain-token ${bindings.domainApiToken === true}; v62 ${health.domainRelease === '2026.07.27-full-zone-domains-v62'}`.slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload live diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-live-diagnostic-${{ github.run_id }}
          path: /tmp/ngeblogging-live
          if-no-files-found: error
          retention-days: 3

