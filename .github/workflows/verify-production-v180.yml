name: Verify Ngeblogging Production v181

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: verify-ngeblogging-production-v181
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for production deployment
        run: sleep 45

      - name: Verify root, auth routes, Studio, v180 foundation, and v181 UI authority
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp="$(date +%s)-${attempt}"
            root_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/root.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/?v181=${stamp}" || true)"
            login_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/login.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/login?v181=${stamp}" || true)"
            signup_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/signup.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/signup?v181=${stamp}" || true)"
            studio_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/studio.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/studio?v181=${stamp}" || true)"
            release180_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/release-v180.json -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/release-v180.json?v181=${stamp}" || true)"
            release181_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/release-v181.json -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/release-v181.json?v181=${stamp}" || true)"

            if [[ "${root_code}" == 200 && "${login_code}" == 200 && "${signup_code}" == 200 && "${studio_code}" == 200 && "${release180_code}" == 200 && "${release181_code}" == 200 ]]; then
              if ! grep -R -q 'WHITE-R4-2026.07.12' /tmp/root.html /tmp/login.html /tmp/signup.html /tmp/studio.html \
                && grep -q 'id="root"' /tmp/root.html \
                && grep -q 'id="root"' /tmp/login.html \
                && grep -q 'id="root"' /tmp/signup.html \
                && grep -q 'id="root"' /tmp/studio.html \
                && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const v180 = JSON.parse(fs.readFileSync('/tmp/release-v180.json', 'utf8'));
          const v181 = JSON.parse(fs.readFileSync('/tmp/release-v181.json', 'utf8'));
          if (v180.release !== 'production-recovery-v180-20260731') process.exit(1);
          if (v180.productionAuthority?.requiredReleaseProbe !== '/release-v180.json') process.exit(1);
          if (v181.release !== 'studio-mobile-hardening-v181-20260731') process.exit(1);
          if (v181.status !== 'candidate') process.exit(1);
          if (v181.basedOn !== 'production-recovery-v180-20260731') process.exit(1);
          if (v181.repairs?.contentEditorMobileGeometryBounded !== true) process.exit(1);
          if (v181.repairs?.operationalPagesNormalFlowOnMobile !== true) process.exit(1);
          if (v181.repairs?.drawerRemainsInteractive !== true) process.exit(1);
          if (v181.repairs?.naraSmallMediumRemainNonmodal !== true) process.exit(1);
          if (v181.repairs?.loadingWatchdogExpanded !== true) process.exit(1);
          NODE
              then
                echo "PRODUCTION_MOBILE_HARDENING_V181_VERIFIED"
                exit 0
              fi
            fi
            sleep 20
          done

          echo "Production belum memakai authority v181, release probe belum aktif, atau WHITE-R4 masih ditemukan."
          exit 1

      - name: Publish commit and issue status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Ngeblogging production authority v181',
              description: state === 'success'
                ? 'release-v180/v181 aktif dan WHITE-R4 tidak ditemukan'
                : 'custom domain belum memakai release-v181',
              target_url: runUrl,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 243,
              body: state === 'success'
                ? `✅ Production probe v181 lulus pada commit \`${context.sha}\`. Root, login, signup, Studio, release-v180, dan release-v181 HTTP 200; WHITE-R4 tidak ditemukan. Run: ${runUrl}`
                : `❌ Production probe v181 belum lulus pada commit \`${context.sha}\`. Source tetap tidak dinyatakan selesai sampai custom domain menampilkan release-v181. Run: ${runUrl}`,
            });
