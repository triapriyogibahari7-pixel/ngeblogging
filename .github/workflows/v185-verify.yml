name: Verify Studio v185

on:
  pull_request:
    branches: [main]
    paths:
      - "src/Studio.jsx"
      - "src/studio-mobile-authority-v185.js"
      - "src/studio-mobile-authority-v185.css"
      - "tests/studio-source-v185.test.mjs"
      - ".github/workflows/v185-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v185-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression test
        run: node --test tests/studio-source-v185.test.mjs
      - name: Run production build
        run: npm run build
