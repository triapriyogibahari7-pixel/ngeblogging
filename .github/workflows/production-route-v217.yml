name: Ngeblogging production route activation v217

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  # Sama dengan workflow historis agar dua deployment Cloudflare tidak berlomba.
  group: ngeblogging-production-studio-v197
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate v217 route contract
        run: node --test tests/production-route-activation-v217.test.mjs

      - name: Run real production build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout production release
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"

      - name: Validate v217 route contract
        id: route_test
        run: node --test tests/production-route-activation-v217.test.mjs

      - name: Build production application and full regression
        id: build
        run: npm run build

      - name: Build pre-cutover Worker configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-precutover-wrangler-v217.mjs wrangler.production.jsonc wrangler.production.precutover-v217.jsonc
          npx wrangler deploy --config wrangler.production.precutover-v217.jsonc --dry-run --outdir .wrangler-production-v217

      - name: Deploy new Worker and assets before apex cutover
        id: deploy_worker
        run: npx wrangler deploy --config wrangler.production.precutover-v217.jsonc --keep-vars

      - name: Verify v216 bundle on workers.dev before route mutation
        id: worker_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            output="/tmp/workers-v216-${attempt}.json"
            headers="/tmp/workers-v216-${attempt}.headers"
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v216.json?verify_v217=${stamp}" || true)"
            if [[ "${code}" == 200 ]] && ! grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v216-20260802"||x.preserved?.themeCount!==100||x.preserved?.widgetCount!==26||x.preserved?.fourLeftAndFourRightWidgetAreas!==true||x.preserved?.postPageWordLimit!==5000||x.validation?.fakeProductionAnalyticsAdded!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${output}"; then
                echo "WORKERS_DEV_V216_VERIFIED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V216_VERIFY_FAILED"
          exit 1

      - name: Preserve compatibility utility without reattaching apex domains
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo "finalize-cloudflare-routes-v175.mjs remains available for historical regression only."
          echo "v217 intentionally does not attach exact Worker Domains before the authoritative route cutover."

      - name: Detach stale Worker Domains and install authoritative apex routes v217
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify live apex auth Studio tenant and v216 marker
        id: live_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio /release-v216.json; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-v217-${attempt}-${safe_name}.out"
              headers="/tmp/ngeblogging-v217-${attempt}-${safe_name}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v217=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then ok=false; fi

              if [[ "${path}" == "/release-v216.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v216-20260802"||x.preserved?.themeCount!==100||x.preserved?.widgetCount!==26||x.preserved?.fourLeftAndFourRightWidgetAreas!==true||x.preserved?.postPageWordLimit!==5000||x.validation?.fakeProductionAnalyticsAdded!==false||x.validation?.massCapacityClaimed!==false)process.exit(1)' "${output}" || ok=false
              else
                grep -q 'id="root"' "${output}" || ok=false
              fi
            done

            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v217.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v217=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false

            workers_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/workers-v216-live.json -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v216.json?verify_v217=${stamp}" || true)"
            [[ "${workers_code}" == 200 ]] || ok=false
            if [[ "${workers_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v216-20260802")process.exit(1)' /tmp/workers-v216-live.json || ok=false
            fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_ROUTE_V217_VERIFIED"
              echo "PRODUCTION_STUDIO_V216_VERIFIED"
              echo "LEGACY_WHITE_R4_REJECTED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_ROUTE_V217_VERIFY_FAILED"
          exit 1

      - name: Publish v217 production status
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          ROUTE_TEST_OUTCOME: ${{ steps.route_test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_WORKER_OUTCOME: ${{ steps.deploy_worker.outcome }}
          WORKER_VERIFY_OUTCOME: ${{ steps.worker_verify.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          LIVE_VERIFY_OUTCOME: ${{ steps.live_verify.outcome }}
        with:
          script: |
            const outcomes = {
              credentials: process.env.CREDENTIALS_OUTCOME,
              routeTest: process.env.ROUTE_TEST_OUTCOME,
              build: process.env.BUILD_OUTCOME,
              config: process.env.CONFIG_OUTCOME,
              deployWorker: process.env.DEPLOY_WORKER_OUTCOME,
              workerVerify: process.env.WORKER_VERIFY_OUTCOME,
              cutover: process.env.CUTOVER_OUTCOME,
              liveVerify: process.env.LIVE_VERIFY_OUTCOME,
            };
            const success = Object.values(outcomes).every((value) => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'Ngeblogging production route v217',
              description: success ? 'v216 bundle live; WHITE-R4 rejected' : `v217 failed: ${JSON.stringify(outcomes).slice(0, 110)}`,
            });
