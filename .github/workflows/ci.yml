name: CI

on:
  pull_request:
    branches: [main, agent/production-vps-platform]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test, build, and validate production files
        run: npm run test:production && npm run build

      - name: Validate Cloudflare Worker bundle
        env:
          QWEN_API_KEY: ci-dry-run-only
          QWEN_WORKSPACE_ID: ci-dry-run
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: npm run cloudflare:dry-run

  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose manifest
        run: NGEBLOGGING_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e SITE_HOSTS=staging.example.com \
            -e ACME_EMAIL=admin@example.com \
            -v "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API container for AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=ci-ngeblogging-api
          cache-to: type=gha,mode=max,scope=ci-ngeblogging-api

      - name: Build web container for AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_test
            VITE_PUBLIC_SITE_URL=https://staging.example.com
          cache-from: type=gha,scope=ci-ngeblogging-web
          cache-to: type=gha,mode=max,scope=ci-ngeblogging-web
