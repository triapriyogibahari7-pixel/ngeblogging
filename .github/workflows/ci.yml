name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test, build, and validate production files
        run: npm run test:production && npm run build

  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose manifest
        run: NGEBLOGGING_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e SITE_HOSTS=staging.example.com \
            -e ACME_EMAIL=admin@example.com \
            -v "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build API container
        run: docker build --file Dockerfile.api --tag ngeblogging-api:test .

      - name: Build web container
        run: |
          docker build --file Dockerfile.web --tag ngeblogging-web:test \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_test \
            --build-arg VITE_PUBLIC_SITE_URL=https://staging.example.com .
