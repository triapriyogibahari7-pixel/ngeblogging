name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-production-v14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-production-v14:
    if: github.head_ref == 'audit/live-production-v14'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      SITE_URL: https://ngeblogging.com
      TENANT_URL: https://tri-apriyogi-bahari.ngeblogging.com
    steps:
      - name: Checkout audited merge commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo CLOUDFLARE_ACCOUNT_ID_MISSING; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 1; }
          test -n "${VITE_SUPABASE_URL}" || { echo VITE_SUPABASE_URL_MISSING; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo VITE_SUPABASE_PUBLISHABLE_KEY_MISSING; exit 1; }

      - name: Install test and build
        run: npm ci --ignore-scripts && npm run test:production && npm run build && npm run cloudflare:dry-run

      - name: Deploy v14 to Cloudflare production routes
        run: npm run deploy:cloudflare

      - name: Verify live v14 apex Nara PWA and tenant
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = process.env.SITE_URL.replace(/\/$/, "");
          const tenant = process.env.TENANT_URL.replace(/\/$/, "");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function read(url, options = {}) {
            const response = await fetch(`${url}${url.includes("?") ? "&" : "?"}audit=${Date.now()}`, {
              redirect: "follow",
              ...options,
              headers: { "cache-control": "no-cache", ...(options.headers || {}) },
            });
            return { response, text: await response.text() };
          }

          let lastErrors = [];
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const errors = [];
            try {
              const [healthResult, indexResult, swResult, tenantResult] = await Promise.all([
                read(`${site}/api/health`, { headers: { accept: "application/json" } }),
                read(`${site}/`),
                read(`${site}/sw.js`),
                read(`${tenant}/`),
              ]);
              if (!healthResult.response.ok) errors.push(`health:${healthResult.response.status}`);
              if (!indexResult.response.ok) errors.push(`index:${indexResult.response.status}`);
              if (!swResult.response.ok) errors.push(`sw:${swResult.response.status}`);
              if (!tenantResult.response.ok) errors.push(`tenant:${tenantResult.response.status}`);

              const health = JSON.parse(healthResult.text || "{}");
              if (health.status !== "ok" || health.service !== "ngeblogging-cloudflare") errors.push("health-payload");
              if (health.release !== "2026.07.24-studio-v14") errors.push(`release:${health.release || "missing"}`);
              if (health.nara !== true) errors.push(`nara:${health.nara}`);
              if (health.naraProviders?.vision !== true) errors.push(`vision:${health.naraProviders?.vision}`);
              if (health.imageGeneration !== true) errors.push(`imageGeneration:${health.imageGeneration}`);
              if (health.managedSubdomains !== true) errors.push("wildcard-subdomains");
              if (health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push(`siteLimits:${JSON.stringify(health.siteLimits)}`);
              if (!indexResult.text.includes("studio-v14-authority.css")) errors.push("index-v14-css");
              if (!indexResult.text.includes("nara-command-center-bridge.js")) errors.push("index-nara-command-center");
              for (const legacy of ["WHITE-R4-2026.07.12", "studio-runtime-layout-guard.js", "studio-mobile-navigation.js", "studio-production-guard.js", "nara-availability-bridge.js", "studio-v10-authority.css", "studio-v11-mobile-repair.css", "nara-interaction-authority.css", "nara-interaction-guard.js"]) {
                if (indexResult.text.includes(legacy)) errors.push(`legacy:${legacy}`);
              }
              if (!swResult.text.includes("ngeblogging-app-v14-20260724")) errors.push("pwa-v14");
              if (/Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenantResult.text)) errors.push("tenant-404");
              if (!tenantResult.text.includes("/src/main.jsx") && !tenantResult.text.includes("/assets/")) errors.push("tenant-app-shell");

              const unauth = await read(`${site}/api/nara`, {
                method: "POST",
                headers: { "content-type": "application/json", origin: site },
                body: JSON.stringify({ message: "uji", model: "nara-mini", intelligence: "standard", attachments: [], history: [] }),
              });
              const unauthPayload = JSON.parse(unauth.text || "{}");
              if (unauth.response.status !== 401 || unauthPayload.code !== "NARA_SESSION_REQUIRED") {
                errors.push(`nara-auth:${unauth.response.status}/${unauthPayload.code || "none"}`);
              }

              if (!errors.length) {
                console.log(JSON.stringify({
                  release: health.release,
                  runtime: health.runtime,
                  nara: health.nara,
                  vision: health.naraProviders?.vision,
                  imageGeneration: health.imageGeneration,
                  siteLimits: health.siteLimits,
                  billing: health.billing,
                  emailRegistration: health.emailRegistration,
                  customDomains: health.customDomains,
                  tenant: tenantResult.response.status,
                  indexBytes: Buffer.byteLength(indexResult.text),
                }, null, 2));
                process.exit(0);
              }
            } catch (error) {
              errors.push(error.message);
            }
            lastErrors = errors;
            console.log(`Live v14 audit ${attempt}/30 belum siap: ${errors.join(", ")}`);
            await sleep(10000);
          }
          console.error(`LIVE_V14_AUDIT_FAILED: ${lastErrors.join(", ")}`);
          process.exit(1);
          NODE
