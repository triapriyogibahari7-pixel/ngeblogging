name: Domain SERVFAIL regression and public evidence
on:
  push:
    branches: [fix/domain-servfail-runtime-repair-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SERVFAIL regression tests
        run: node --test tests/domain-dns-servfail-20261107.test.mjs
      - name: Capture public DNS and HTTPS evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const hostname='triapriyoginotes.my.id';
          const observations=await Promise.all(['https://dns.google/resolve','https://cloudflare-dns.com/dns-query'].flatMap(base=>[['NS',false],['NS',true],['DS',false],['A',false],['AAAA',false]].map(async ([type,cd])=>{
            const url=new URL(base);url.searchParams.set('name',hostname);url.searchParams.set('type',type);if(cd)url.searchParams.set('cd','1');
            try{const r=await fetch(url,{headers:{accept:'application/dns-json'},redirect:'error',signal:AbortSignal.timeout(10000)});const d=await r.json();return {resolver:url.hostname,type,checkingDisabled:cd,httpStatus:r.status,dnsStatus:d.Status,authenticatedData:d.AD,answers:d.Answer??[],authority:d.Authority??[],comment:d.Comment??null};}catch(e){return {resolver:url.hostname,type,checkingDisabled:cd,error:String(e.message)};}
          })));
          let https;try{const r=await fetch('https://'+hostname,{redirect:'manual',signal:AbortSignal.timeout(10000)});const text=(await r.text()).slice(0,100000);https={status:r.status,location:r.headers.get('location'),server:r.headers.get('server'),ray:r.headers.get('cf-ray'),errorCodes:[...new Set(text.match(/(?:Error\s*(?:code)?\s*[:#]?\s*|error-code[\s\S]{0,40}?)(1\d{3})/gi)??[])].slice(0,10),title:text.match(/<title[^>]*>([^<]{0,300})/i)?.[1]??null};}catch(e){https={error:String(e.message)};}
          const report={hostname,checkedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA,scope:'public-observation-only',ownershipVerified:false,providerActivationVerified:false,observations,https};
          await writeFile('evidence/public-domain.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-public-evidence-${{ github.sha }}
          path: evidence/public-domain.json
          if-no-files-found: warn
          retention-days: 7
