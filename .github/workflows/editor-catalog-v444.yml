name: Editor catalog v444 stage 2
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/lib/editor-catalog-v444.mjs', 'src/EditorShellV444.jsx', 'tests/editor-catalog-v444.test.mjs', '.github/workflows/editor-catalog-v444.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/editor-shell-v444.test.mjs tests/editor-catalog-v444.test.mjs
      - run: npx vite build
