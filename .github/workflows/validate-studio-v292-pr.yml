name: Validate Studio v298

on:
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-studio-v298-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run current Studio regression
        run: |
          node --test \
            tests/studio-final-pass-v289.test.mjs \
            tests/studio-native-controls-v290.test.mjs \
            tests/studio-auth-sidebar-v291.test.mjs \
            tests/studio-startup-v292.test.mjs \
            tests/studio-production-recovery-v295.test.mjs \
            tests/studio-theme-catalog-v296.test.mjs \
            tests/studio-mode-startup-v297.test.mjs \
            tests/studio-shell-authority-v298.test.mjs

      - name: Build application with service-worker chain
        run: npm run check

      - name: Verify v292-v298 build markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'STUDIO_STARTUP_DIRECT_DATA_RELEASE_V292' public/sw.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' public/sw.js
          grep -q 'STUDIO_THEME_CATALOG_RELEASE_V296' public/sw.js
          grep -q 'STUDIO_MODE_STARTUP_AUTHORITY_RELEASE_V297' public/sw.js
          grep -q 'STUDIO_SHELL_AUTHORITY_RELEASE_V298' public/sw.js
          grep -q 'studio-shell-cache-v298' public/sw.js
          grep -q 'ngeblogging-app-v298-shell-authority-20260805' public/sw.js
          grep -R -q 'studio-startup-direct-data-v292-20260805' dist/assets
          grep -R -q 'studio-theme-catalog-100-v296-20260805' dist/assets
          grep -R -q 'studio-shell-authority-v298-20260805' dist/assets
          test -f public/release-v292.json
          test -f public/release-v296.json
          test -f public/release-v297.json
          test -f public/release-v298.json
