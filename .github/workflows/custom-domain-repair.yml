name: Ngeblogging custom domain repair

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-custom-domain-repair
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
  TARGET_DOMAIN: triapriyogi.com
  WORKER_SERVICE: ngeblogging

jobs:
  repair:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN belum tersedia pada environment cloudflare-production"; exit 1; }
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo "CLOUDFLARE_DOMAIN_API_TOKEN belum tersedia pada environment cloudflare-production"; exit 1; }

      - name: Repair authoritative Cloudflare Worker domain
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { resolveNs } from 'node:dns/promises';
          const domain = process.env.TARGET_DOMAIN.toLowerCase();
          const www = `www.${domain}`;
          const service = process.env.WORKER_SERVICE.trim();
          const zoneToken = process.env.CLOUDFLARE_DOMAIN_API_TOKEN.trim();
          const workerToken = process.env.CLOUDFLARE_API_TOKEN.trim();
          const base = 'https://api.cloudflare.com/client/v4';
          const norm = (v) => String(v || '').toLowerCase().replace(/\.$/, '').trim();
          async function cf(path, token, options = {}) {
            const headers = {
              authorization: `Bearer ${token}`,
              accept: 'application/json',
              ...(options.body ? { 'content-type': 'application/json' } : {}),
              ...(options.headers || {}),
            };
            const body = options.body && typeof options.body !== 'string' ? JSON.stringify(options.body) : options.body;
            const r = await fetch(base + path, { ...options, headers, body });
            const p = await r.json().catch(() => ({}));
            if (!r.ok || p.success !== true) throw new Error(`Cloudflare ${options.method || 'GET'} ${path} gagal (${r.status}): ${(p.errors || []).map((e) => e?.message).filter(Boolean).join('; ') || 'respons tidak valid'}`);
            return p.result;
          }
          async function smoke(host) {
            try {
              const r = await fetch(`https://${host}/?ngeblogging_domain_repair=1`, { redirect: 'follow', headers: { accept: 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.1', 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(10000) });
              const type = String(r.headers.get('content-type') || '').toLowerCase();
              const text = await r.text();
              return { host, status: r.status, html: /<!doctype\s+html|<html[\s>]/i.test(text.slice(0, 12000)), contentType: type, url: r.url };
            } catch (e) { return { host, status: 0, html: false, contentType: '', url: '', error: String(e?.message || e) }; }
          }

          // Do not depend on a separate CLOUDFLARE_ACCOUNT_ID secret. Resolve the
          // authoritative account directly from the active production zone.
          const zones = await cf(`/zones?name=${encodeURIComponent(domain)}&status=active&per_page=50`, zoneToken);
          const matches = (zones || []).filter((z) => norm(z?.name) === domain && norm(z?.status) === 'active');
          if (matches.length !== 1) throw new Error(`Zone aktif ${domain} harus tepat satu; ditemukan ${matches.length}.`);
          const zone = matches[0];
          const zoneId = String(zone.id || '');
          const accountId = String(zone.account?.id || '');
          const assignedNs = [...(zone.name_servers || [])].map(norm).filter(Boolean).sort();
          if (!/^[0-9a-f]{32}$/i.test(zoneId)) throw new Error('Zone ID custom domain tidak valid.');
          if (!/^[0-9a-f]{32}$/i.test(accountId)) throw new Error('Account ID pemilik zone tidak valid.');

          const publicNs = [...await resolveNs(domain)].map(norm).filter(Boolean).sort();
          if (assignedNs.join('|') !== publicNs.join('|')) throw new Error(`Nameserver publik belum sama. Cloudflare=${assignedNs.join(', ')}; publik=${publicNs.join(', ')}.`);

          for (const host of [domain, www]) {
            await cf(`/accounts/${accountId}/workers/domains`, workerToken, { method: 'PUT', body: { hostname: host, service, environment: 'production', zone_id: zoneId, zone_name: domain } });
          }

          const rows = await cf(`/accounts/${accountId}/workers/domains?service=${encodeURIComponent(service)}`, workerToken);
          for (const host of [domain, www]) {
            const row = (rows || []).find((x) => norm(x?.hostname) === host);
            if (!row || norm(row.service) !== service || norm(row.zone_id) !== norm(zoneId) || norm(row.zone_name) !== domain) throw new Error(`Worker domain ${host} belum terikat ke ${service}.`);
          }

          let live = [];
          for (let i = 1; i <= 12; i++) {
            live = await Promise.all([smoke(domain), smoke(www)]);
            console.log(JSON.stringify({ attempt: i, domain, zoneId, assignedNs, publicNs, live }, null, 2));
            if (live.every((x) => x.status >= 200 && x.status < 400 && x.html && x.contentType.includes('text/html'))) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!live.every((x) => x.status >= 200 && x.status < 400 && x.html && x.contentType.includes('text/html'))) throw new Error(`HTTPS publik belum menyajikan HTML untuk: ${live.filter((x) => !(x.status >= 200 && x.status < 400 && x.html && x.contentType.includes('text/html'))).map((x) => x.host).join(', ')}`);
          console.log(JSON.stringify({ ok: true, domain, www, zoneId, accountIdResolved: true, service, live }, null, 2));
          NODE
