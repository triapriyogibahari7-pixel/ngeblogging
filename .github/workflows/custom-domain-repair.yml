name: Ngeblogging custom domain configuration audit
# Legacy automatic domain attachment is retired. This workflow never provisions DNS or Worker domains.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check platform-only deployment routes
        run: node --test tests/platform-domain-deployment.test.mjs
      - name: Explain publication boundary
        run: echo 'Configuration audit only. Customer domains must use the authenticated Domain and Publication flow; no domain was attached or verified by this workflow.'
