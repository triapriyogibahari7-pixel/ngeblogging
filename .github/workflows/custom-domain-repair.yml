name: Ngeblogging custom domain repair

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-custom-domain-repair
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
  TARGET_DOMAIN: triapriyogi.com
  WORKER_SERVICE: ngeblogging

jobs:
  repair:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-production

    steps:
      - name: Reconcile Cloudflare zone, nameservers, Worker domains, and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "Ngeblogging custom-domain repair forced on main push; managed runner: ubuntu-latest"
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo "CLOUDFLARE_DOMAIN_API_TOKEN belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }

          node --input-type=module <<'NODE'
          import { resolveNs } from 'node:dns/promises';

          const domain = process.env.TARGET_DOMAIN.toLowerCase();
          const www = `www.${domain}`;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID.trim();
          const workerService = process.env.WORKER_SERVICE.trim();
          const domainToken = process.env.CLOUDFLARE_DOMAIN_API_TOKEN.trim();
          const workerToken = process.env.CLOUDFLARE_API_TOKEN.trim();
          const base = 'https://api.cloudflare.com/client/v4';

          async function cf(path, token, options = {}) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                ...(options.body ? { 'content-type': 'application/json' } : {}),
                ...(options.headers || {}),
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success !== true) {
              const message = (payload.errors || []).map((item) => item?.message).filter(Boolean).join('; ');
              throw new Error(`Cloudflare ${options.method || 'GET'} ${path} gagal (${response.status}): ${message || 'respons tidak valid'}`);
            }
            return payload.result;
          }

          function normalize(value) {
            return String(value || '').toLowerCase().replace(/\.$/, '').trim();
          }

          async function publicHttps(hostname) {
            const url = `https://${hostname}/`;
            try {
              const response = await fetch(`${url}?ngeblogging_domain_repair=1`, {
                redirect: 'follow',
                headers: { accept: 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.1', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              });
              const contentType = String(response.headers.get('content-type') || '').toLowerCase();
              const text = await response.text();
              const html = /<!doctype\s+html|<html[\s>]/i.test(text.slice(0, 12000));
              return { hostname, status: response.status, contentType, html, reachable: response.ok && contentType.includes('text/html') && html, finalUrl: response.url };
            } catch (error) {
              return { hostname, status: 0, contentType: '', html: false, reachable: false, finalUrl: '', error: String(error?.message || error) };
            }
          }

          const zones = await cf(`/zones?name=${encodeURIComponent(domain)}&account.id=${encodeURIComponent(accountId)}&per_page=50`, domainToken);
          const matches = (zones || []).filter((zone) => normalize(zone?.name) === domain);
          if (matches.length !== 1) throw new Error(`Cloudflare harus memiliki tepat satu zone ${domain}; ditemukan ${matches.length}.`);
          const zone = matches[0];
          const zoneId = String(zone.id || '');
          const zoneStatus = normalize(zone.status);
          const assignedNs = [...(zone.name_servers || [])].map(normalize).filter(Boolean).sort();
          if (!/^[0-9a-f]{32}$/i.test(zoneId)) throw new Error('Zone ID custom domain tidak valid.');
          if (zoneStatus !== 'active') {
            throw new Error(`Zone ${domain} belum active di Cloudflare (status=${zone.status}). Nameserver registrar harus menunjuk ke ${assignedNs.join(', ')} sebelum Worker dapat melayani domain.`);
          }

          let publicNs = [];
          try {
            publicNs = [...await resolveNs(domain)].map(normalize).filter(Boolean).sort();
          } catch (error) {
            throw new Error(`DNS publik ${domain} masih tidak dapat di-resolve dari GitHub runner: ${error?.message || error}`);
          }
          if (assignedNs.join('|') !== publicNs.join('|')) {
            throw new Error(`Nameserver publik ${domain} belum sama dengan Cloudflare zone. Cloudflare=${assignedNs.join(', ')}; publik=${publicNs.join(', ')}.`);
          }

          for (const hostname of [domain, www]) {
            await cf(`/accounts/${encodeURIComponent(accountId)}/workers/domains`, workerToken, {
              method: 'PUT',
              body: {
                hostname,
                service: workerService,
                environment: 'production',
                zone_id: zoneId,
                zone_name: domain,
              },
            });
          }

          const workerDomains = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/domains?service=${encodeURIComponent(workerService)}`, workerToken);
          const exact = (workerDomains || []).filter((item) => [domain, www].includes(normalize(item?.hostname)));
          for (const hostname of [domain, www]) {
            const item = exact.find((row) => normalize(row?.hostname) === hostname);
            if (!item || normalize(item.service) !== workerService || normalize(item.zone_id) !== normalize(zoneId) || normalize(item.zone_name) !== domain) {
              throw new Error(`Worker domain ${hostname} belum terikat ke ${workerService} pada zone ${domain}.`);
            }
          }

          let live = [];
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            live = await Promise.all([publicHttps(domain), publicHttps(www)]);
            console.log(JSON.stringify({ attempt, zone: { id: zoneId, status: zone.status, assignedNs }, publicNs, workerDomains: exact, live }, null, 2));
            if (live.every((item) => item.reachable)) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          if (!live.every((item) => item.reachable)) {
            throw new Error(`Worker domain sudah terpasang tetapi HTTPS publik belum menyajikan HTML untuk ${live.filter((item) => !item.reachable).map((item) => item.hostname).join(', ')}.`);
          }

          console.log(JSON.stringify({
            ok: true,
            domain,
            www,
            zoneId,
            zoneStatus: zone.status,
            assignedNameServers: assignedNs,
            publicNameServers: publicNs,
            workerService,
            live,
          }, null, 2));
          NODE
