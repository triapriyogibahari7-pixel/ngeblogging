name: Ngeblogging custom domain repair

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-custom-domain-repair
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN }}
  TARGET_DOMAIN: triapriyogi.com
  WORKER_SERVICE: ngeblogging

jobs:
  repair:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - name: Runner preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node --version)"
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN belum tersedia pada environment cloudflare-production"; exit 1; }
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo "CLOUDFLARE_DOMAIN_API_TOKEN belum tersedia pada environment cloudflare-production"; exit 1; }

      - name: Repair authoritative Cloudflare Worker domains
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { resolveNs } from 'node:dns/promises';

          const domain = process.env.TARGET_DOMAIN.toLowerCase();
          const www = `www.${domain}`;
          const service = process.env.WORKER_SERVICE.trim();
          const zoneToken = process.env.CLOUDFLARE_DOMAIN_API_TOKEN.trim();
          const workerToken = process.env.CLOUDFLARE_API_TOKEN.trim();
          const base = 'https://api.cloudflare.com/client/v4';
          const norm = (v) => String(v || '').toLowerCase().replace(/\.$/, '').trim();

          async function cf(path, token, options = {}) {
            const headers = {
              authorization: `Bearer ${token}`,
              accept: 'application/json',
              ...(options.body ? { 'content-type': 'application/json' } : {}),
              ...(options.headers || {}),
            };
            const body = options.body && typeof options.body !== 'string' ? JSON.stringify(options.body) : options.body;
            const response = await fetch(base + path, { ...options, headers, body });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || []).map((e) => e?.message).filter(Boolean).join('; ') || 'respons tidak valid';
              throw new Error(`Cloudflare ${options.method || 'GET'} ${path} gagal (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          async function smoke(host) {
            try {
              const response = await fetch(`https://${host}/?ngeblogging_domain_repair=1`, {
                redirect: 'follow',
                headers: {
                  accept: 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.1',
                  'cache-control': 'no-cache',
                },
                signal: AbortSignal.timeout(15000),
              });
              const contentType = String(response.headers.get('content-type') || '').toLowerCase();
              const text = await response.text();
              return {
                host,
                status: response.status,
                html: /<!doctype\\s+html|<html[\\s>]/i.test(text.slice(0, 12000)),
                contentType,
                url: response.url,
              };
            } catch (error) {
              return { host, status: 0, html: false, contentType: '', url: '', error: String(error?.message || error) };
            }
          }

          // Resolve the authoritative Cloudflare account from the active zone.
          const zones = await cf(`/zones?name=${encodeURIComponent(domain)}&status=active&per_page=50`, zoneToken);
          const matches = (zones || []).filter((zone) => norm(zone?.name) === domain && norm(zone?.status) === 'active');
          if (matches.length !== 1) throw new Error(`Zone aktif ${domain} harus tepat satu; ditemukan ${matches.length}.`);

          const zone = matches[0];
          const zoneId = String(zone.id || '');
          const accountId = String(zone.account?.id || '');
          const assignedNs = [...(zone.name_servers || [])].map(norm).filter(Boolean).sort();
          if (!/^[0-9a-f]{32}$/i.test(zoneId)) throw new Error('Zone ID custom domain tidak valid.');
          if (!/^[0-9a-f]{32}$/i.test(accountId)) throw new Error('Account ID pemilik zone tidak valid.');

          const publicNs = [...await resolveNs(domain)].map(norm).filter(Boolean).sort();
          if (assignedNs.join('|') !== publicNs.join('|')) {
            throw new Error(`Nameserver publik belum sama. Cloudflare=${assignedNs.join(', ')}; publik=${publicNs.join(', ')}.`);
          }

          // Cloudflare Workers Domains uses PUT on the collection to attach or
          // update a custom domain. Do not POST the collection or PUT /{id}.
          // Those endpoints are not the current Workers Domains API contract.
          for (const host of [domain, www]) {
            const payload = {
              hostname: host,
              service,
              zone_id: zoneId,
              zone_name: domain,
            };
            const attached = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/domains`, workerToken, {
              method: 'PUT',
              body: payload,
            });
            if (norm(attached?.hostname) !== host || norm(attached?.service) !== norm(service)) {
              throw new Error(`Cloudflare mengembalikan binding tidak sesuai untuk ${host}.`);
            }
            console.log(JSON.stringify({ attached: host, id: attached?.id, hostname: attached?.hostname, service: attached?.service, zone_id: attached?.zone_id, zone_name: attached?.zone_name }, null, 2));
          }

          const rows = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/domains?service=${encodeURIComponent(service)}`, workerToken);
          for (const host of [domain, www]) {
            const row = (rows || []).find((item) => norm(item?.hostname) === host);
            if (!row || norm(row.service) !== norm(service) || norm(row.zone_id) !== norm(zoneId) || norm(row.zone_name) !== norm(domain)) {
              throw new Error(`Worker domain ${host} belum terikat ke ${service}.`);
            }
          }

          let live = [];
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            live = await Promise.all([smoke(domain), smoke(www)]);
            console.log(JSON.stringify({ attempt, domain, zoneId, assignedNs, publicNs, live }, null, 2));
            if (live.every((item) => item.status >= 200 && item.status < 400 && item.html && item.contentType.includes('text/html'))) break;
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }

          if (!live.every((item) => item.status >= 200 && item.status < 400 && item.html && item.contentType.includes('text/html'))) {
            throw new Error(`HTTPS publik belum menyajikan HTML untuk: ${live.filter((item) => !(item.status >= 200 && item.status < 400 && item.html && item.contentType.includes('text/html'))).map((item) => `${item.host} (${item.status || item.error || 'no-response'})`).join(', ')}`);
          }

          console.log(JSON.stringify({ ok: true, domain, www, zoneId, accountIdResolved: true, service, live }, null, 2));
          NODE

      - name: Public smoke test passed
        run: |
          echo 'Custom-domain repair completed with the current Cloudflare Workers Domains API and public HTTPS smoke tests passed.'
