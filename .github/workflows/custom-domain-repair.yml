name: Ngeblogging custom domain repair

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain yang akan diperbaiki"
        required: false
        default: "triapriyogi.com"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ngeblogging-custom-domain-repair
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  TARGET_DOMAIN: ${{ github.event.inputs.domain || 'triapriyogi.com' }}
  WORKER_SERVICE: ngeblogging

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node --version)"\n          echo "event=$GITHUB_EVENT_NAME"\n          echo "sha=$GITHUB_SHA"\n          echo "target_domain=$TARGET_DOMAIN"\n          echo "cloudflare_account_id=$([ -n \"$CLOUDFLARE_ACCOUNT_ID\" ] && echo present || echo missing)"\n          echo "cloudflare_domain_api_token=$([ -n \"$CLOUDFLARE_DOMAIN_API_TOKEN\" ] && echo present || echo missing)"
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID belum tersedia pada environment cloudflare-production"; exit 1; }
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo "CLOUDFLARE_DOMAIN_API_TOKEN belum tersedia pada environment cloudflare-production"; exit 1; }
          test -n "${TARGET_DOMAIN}" || { echo "TARGET_DOMAIN kosong"; exit 1; }

      - name: Repair and verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-custom-domain-v350.mjs

      - name: Public smoke test passed
        run: echo "Custom-domain repair completed and public HTTPS smoke tests passed for ${TARGET_DOMAIN} and www.${TARGET_DOMAIN}."
