name: Ngeblogging custom domains v55

on:
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-custom-domains-v55
  cancel-in-progress: true

jobs:
  activate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      PRODUCTION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCTION_SHA }}

      - name: Mark domain audit pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'pending',
              context: 'Ngeblogging custom domains',
              description: 'Validating Cloudflare full-zone runtime, JWT/RLS, and live domain health.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Detect Cloudflare full-zone provider
        shell: bash
        run: |
          set -euo pipefail
          provider="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.production.jsonc', 'utf8'));
          process.stdout.write(String(config.vars?.CUSTOM_DOMAIN_PROVIDER || '').trim().toLowerCase());
          NODE
          )"
          [[ "${provider}" == "cloudflare-full-zone" ]] || {
            echo "Provider produksi wajib cloudflare-full-zone, ditemukan: ${provider:-kosong}"
            exit 1
          }
          echo "CUSTOM_DOMAIN_PROVIDER=${provider}" >> "${GITHUB_ENV}"

      - name: Validate credentials and production source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PUBLIC_SITE_URL}" == https://* ]] || { echo "PUBLIC_SITE_URL wajib HTTPS"; exit 1; }
          [[ "${WORKERS_DEV_SMOKE_TEST_URL}" == https://*.workers.dev ]] || { echo "WORKERS_DEV_SMOKE_TEST_URL wajib workers.dev"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          npm ci --ignore-scripts
          npm run test:production

      - name: Resolve authenticated account and validate Worker API
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"
          else
            echo "RESOLVED_CLOUDFLARE_ZONE_ID=" >> "${GITHUB_ENV}"
          fi

          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc

          account_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.production.active-zone.jsonc', 'utf8'));
          process.stdout.write(String(config.account_id || ''));
          NODE
          )"
          [[ "${account_id}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "Account ID terautentikasi tidak valid"; exit 1; }
          echo "::add-mask::${account_id}"
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

          http_code="$(curl -sS -o /tmp/workers-scripts.json -w '%{http_code}' \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts")"
          WORKERS_HTTP_CODE="${http_code}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/workers-scripts.json', 'utf8'));
          const scripts = Array.isArray(payload.result) ? payload.result : [];
          const worker = scripts.some((entry) => String(entry?.id || entry?.name || '') === 'ngeblogging');
          if (process.env.WORKERS_HTTP_CODE !== '200' || payload.success !== true || !worker) {
            const codes = (payload.errors || []).map((error) => error?.code).filter(Boolean).join(',');
            throw new Error(`Worker API belum siap (${process.env.WORKERS_HTTP_CODE}; ${codes || 'tanpa kode'}).`);
          }
          console.log('Worker ngeblogging ditemukan pada account yang dikenali token.');
          NODE

      - name: Verify live full-zone domain readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            apex_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/apex-health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${PUBLIC_SITE_URL%/}/api/health?domain_audit=v55-${stamp}" || true)"
            worker_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/worker-health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/api/health?domain_audit=v55-${stamp}" || true)"

            if [[ "${apex_code}" == "200" && "${worker_code}" == "200" ]] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const records = [
            ['apex', JSON.parse(fs.readFileSync('/tmp/apex-health.json', 'utf8'))],
            ['worker', JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'))],
          ];
          const errors = [];
          for (const [name, health] of records) {
            const bindings = health.customDomainBindings || {};
            if (health.status !== 'ok') errors.push(`${name}.status`);
            if (health.domainRelease !== '2026.07.26-full-zone-domains-v55') errors.push(`${name}.release`);
            if (health.customDomains !== true) errors.push(`${name}.enabled`);
            if (health.customDomainProvider !== 'cloudflare-full-zone') errors.push(`${name}.provider`);
            if (health.customDomainMode !== 'full-zone-nameserver') errors.push(`${name}.mode`);
            if (health.customDomainDatabaseMode !== 'user-jwt-rls') errors.push(`${name}.databaseMode`);
            if (health.customDomainServiceRoleRequired !== false) errors.push(`${name}.serviceRole`);
            for (const key of ['apiToken', 'accountId', 'workerService', 'databaseAccess']) {
              if (bindings[key] !== true) errors.push(`${name}.${key}`);
            }
            if (health.siteCapacity?.mode !== 'fixed' || health.siteCapacity?.defaultLimit !== 12) errors.push(`${name}.siteCapacity`);
            if (health.siteLimits?.maximum !== 12) errors.push(`${name}.siteLimit`);
          }
          if (errors.length) {
            console.error(errors.join(','));
            process.exit(1);
          }
          console.log(JSON.stringify({ provider: 'cloudflare-full-zone', mode: 'full-zone-nameserver', database: 'user-jwt-rls', siteLimit: 12 }, null, 2));
          NODE
            then
              cp /tmp/apex-health.json /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          cp /tmp/apex-health.json /tmp/health.json 2>/dev/null || true
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Upload full-zone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-custom-domains-v55-${{ github.run_id }}
          path: |
            /tmp/workers-scripts.json
            /tmp/apex-health.json
            /tmp/worker-health.json
            /tmp/health.json
          if-no-files-found: warn
          retention-days: 3

      - name: Mark domain audit successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'success',
              context: 'Ngeblogging custom domains',
              description: 'Cloudflare full-zone, JWT/RLS, Worker bindings, and live domain health passed.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark domain audit failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'failure',
              context: 'Ngeblogging custom domains',
              description: 'Cloudflare full-zone runtime or live domain health did not pass validation.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
