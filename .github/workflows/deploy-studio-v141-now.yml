name: Deploy Studio v141 Now

on:
  pull_request:
    branches: [main]
    paths:
      - ".deploy-studio-v141"

permissions:
  contents: read

concurrency:
  group: ngeblogging-studio-v141-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/studio-v141-now'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      QWEN_API_KEY: ci-dry-run-only
      QWEN_WORKSPACE_ID: production-dry-run

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run v141 production regression tests
        run: npm run test:production

      - name: Build production assets
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npm run cloudflare:dry-run

      - name: Deploy Studio v141 to Cloudflare production
        run: npm run deploy:cloudflare

      - name: Verify Studio v141 production markers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp=$(date +%s)
            worker=$(curl -fsSL --max-time 20 "https://ngeblogging.com/sw.js?deploy_audit=$stamp" || true)
            health_code=$(curl -sS -o /tmp/ngeblogging-health.json -w '%{http_code}' --max-time 20 "https://ngeblogging.com/api/health?deploy_audit=$stamp" || true)
            page_code=$(curl -sS -o /tmp/ngeblogging-home.html -w '%{http_code}' --max-time 20 "https://ngeblogging.com/?deploy_audit=$stamp" || true)
            if [[ "$worker" == *"ngeblogging-app-v141-studio-mobile-auth-20260729"* ]] \
              && [[ "$worker" == *"single-react-layout-handheld-direct-auth-v141"* ]] \
              && [[ "$health_code" == "200" ]] \
              && [[ "$page_code" == "200" ]]; then
              echo "STUDIO_V141_PRODUCTION_VERIFIED"
              exit 0
            fi
            echo "Waiting for Studio v141 production propagation ($attempt/30)."
            sleep 10
          done
          echo "STUDIO_V141_PRODUCTION_VERIFY_FAILED"
          exit 1
