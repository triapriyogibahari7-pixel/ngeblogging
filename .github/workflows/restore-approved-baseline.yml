name: Restore approved baseline once
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-approved-baseline.yml]
permissions:
  contents: write
concurrency:
  group: restore-approved-main-baseline
  cancel-in-progress: false
jobs:
  restore:
    if: github.event.head_commit.message == 'ops: request exact baseline restoration to 0c08b319'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact tree without rewriting history
        shell: bash
        env:
          APPROVED_TARGET: 0c08b3191fbfcc407c4eb32a0000779230522caf
        run: |
          set -euo pipefail
          git fetch origin "$APPROVED_TARGET"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TARGET_TREE=$(git rev-parse "${APPROVED_TARGET}^{tree}")
          RESTORE_COMMIT=$(printf '%s\n' "restore: exact approved baseline $APPROVED_TARGET" | git commit-tree "$TARGET_TREE" -p "$GITHUB_SHA")
          test "$(git rev-parse "${RESTORE_COMMIT}^{tree}")" = "$TARGET_TREE"
          git push origin "${RESTORE_COMMIT}:refs/heads/main"
          echo "Restored commit: $RESTORE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact baseline tree: $TARGET_TREE" >> "$GITHUB_STEP_SUMMARY"
