name: Main quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-main-quality
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mark quality gate pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Ngeblogging main quality',
              description: 'Production tests, build, and Cloudflare dry-run are running.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run production source tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:production 2>&1 | tee /tmp/ngeblogging-main-tests.log

      - name: Build production application
        id: build
        env:
          VITE_SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
          VITE_PUBLIC_SITE_URL: https://ngeblogging.com
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/ngeblogging-main-build.log

      - name: Validate Cloudflare bundle without deployment credentials
        id: dryrun
        env:
          QWEN_API_KEY: ci-dry-run-only
          QWEN_WORKSPACE_ID: ci-dry-run
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        shell: bash
        run: |
          set -o pipefail
          npm run cloudflare:dry-run 2>&1 | tee /tmp/ngeblogging-main-cloudflare.log

      - name: Upload quality failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-quality-failure-${{ github.run_id }}
          path: |
            /tmp/ngeblogging-main-tests.log
            /tmp/ngeblogging-main-build.log
            /tmp/ngeblogging-main-cloudflare.log
          if-no-files-found: warn
          retention-days: 3

      - name: Mark quality gate successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Ngeblogging main quality',
              description: 'Production tests, build, and Cloudflare dry-run passed.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark quality gate failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Ngeblogging main quality',
              description: 'Production tests, build, or Cloudflare dry-run failed. Logs were uploaded.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
