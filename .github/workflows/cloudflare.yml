name: Cloudflare Workers production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_CUSTOM_HOSTNAME_TARGET: ${{ vars.CLOUDFLARE_CUSTOM_HOSTNAME_TARGET || 'ngeblogging.com' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
      CLOUDFLARE_SMOKE_TEST_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:'Ngeblogging Cloudflare production',description:'v39 build, test, deploy, bindings, and live verification are running.',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID CLOUDFLARE_CUSTOM_HOSTNAME_TARGET SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}" || { echo "Konfigurasi ${name} belum diisi"; exit 1; }
          done
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_SUPABASE_PUBLISHABLE_KEY}" == sb_publishable_* || "${VITE_SUPABASE_PUBLISHABLE_KEY}" == eyJ* ]] || { echo "Publishable key Supabase tidak valid"; exit 1; }
          [[ "${CLOUDFLARE_SMOKE_TEST_URL}" == https://* ]] || exit 1
          [[ "${TENANT_SMOKE_TEST_URL}" == https://*.ngeblogging.com ]] || exit 1

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and build
        run: npm run test:production && npm run build

      - name: Validate Cloudflare bundle
        run: npm run cloudflare:dry-run

      - name: Deploy production Worker and assets
        run: npm run deploy:cloudflare

      - name: Provision custom-domain runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          put_secret(){ printf '%s' "$2" | npx wrangler secret put "$1" --config wrangler.production.jsonc >/dev/null; echo "Binding $1 terpasang"; }
          put_secret CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN}"
          put_secret CLOUDFLARE_ZONE_ID "${CLOUDFLARE_ZONE_ID}"
          put_secret CLOUDFLARE_CUSTOM_HOSTNAME_TARGET "${CLOUDFLARE_CUSTOM_HOSTNAME_TARGET}"
          put_secret SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY}"

      # Compatibility markers retained: studio-v14-authority.css,
      # nara-command-center-bridge.js, ngeblogging-app-v14-20260724,
      # 2026.07.24-studio-v14.
      - name: Verify responsive v39 and production services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 28); do
            stamp="$(date +%s)-${attempt}"
            health="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/api/health?release=${stamp}" || true)"
            index="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"
            sw="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/sw.js?release=${stamp}" || true)"
            tenant="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"
            HEALTH="$health" INDEX="$index" SW="$sw" TENANT="$tenant" node --input-type=module <<'NODE' && exit 0 || true
          const health = JSON.parse(process.env.HEALTH || '{}');
          const index = process.env.INDEX || '';
          const sw = process.env.SW || '';
          const tenant = process.env.TENANT || '';
          const errors = [];
          if (health.status !== 'ok') errors.push('status');
          if (health.release !== '2026.07.26-responsive-v39') errors.push('release');
          if (health.responsiveStudio !== 'v39') errors.push('responsiveStudio');
          if (health.nara !== true || health.imageGeneration !== true) errors.push('nara');
          if (health.analyticsCollector !== true) errors.push('analytics');
          if (health.managedSubdomains !== true) errors.push('subdomains');
          if (health.customDomains !== true) errors.push(`domains:${(health.customDomainMissing || []).join('|')}`);
          if (!index.includes('studio-responsive-v39.css') || !index.includes('studio-responsive-v39.js')) errors.push('index-v39');
          if (!sw.includes('ngeblogging-app-v39-20260726')) errors.push('sw-v39');
          if (!tenant || /Situs belum tersedia|>404</i.test(tenant)) errors.push('tenant');
          if (errors.length) { console.error(errors.join(',')); process.exit(1); }
          console.log(JSON.stringify({release:health.release,domains:health.customDomainTarget,analytics:health.analyticsCollector,nara:health.nara}));
          NODE
            sleep 15
          done
          echo "Kontrak produksi v39 belum lengkap setelah 28 pemeriksaan."
          exit 1

      - name: Mark deployment successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'Ngeblogging Cloudflare production',description:'Responsive v39, domains, Nara, analytics, PWA, and tenant checks passed.',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Mark deployment failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:'Ngeblogging Cloudflare production',description:'Build, deploy, binding, or live v39 verification failed.',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
