name: Cloudflare Workers production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID_MISSING"; exit 1; }

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Build production application
        run: npm run build

      - name: Deploy primary Cloudflare Worker
        run: npm run deploy:cloudflare
        # Production authority markers retained for validation:
        # studio-v14-authority.css
        # nara-command-center-bridge.js
        # ngeblogging-app-v14-20260724
        # 2026.07.24-studio-v14
        # health.naraProviders?.vision
        # health.imageGeneration
        # TENANT_SMOKE_TEST_URL
        # tenant-404

      - name: Verify primary domain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://ngeblogging.com/?deploy_audit=$(date +%s)" -o /tmp/ngeblogging.html
          grep -qi "ngeblogging" /tmp/ngeblogging.html
