name: Cloudflare Workers production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_CUSTOM_HOSTNAME_API_TOKEN: ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAME_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || secrets.CF_ZONE_ID || vars.CLOUDFLARE_ZONE_ID || vars.CF_ZONE_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
      CLOUDFLARE_SMOKE_TEST_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark production deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Ngeblogging Cloudflare production',
              description: 'Build, tests, deploy, and live verification are running.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_SUPABASE_PUBLISHABLE_KEY}" == sb_publishable_* || "${VITE_SUPABASE_PUBLISHABLE_KEY}" == eyJ* ]] || { echo "Publishable key Supabase tidak valid"; exit 1; }
          [[ "${CLOUDFLARE_SMOKE_TEST_URL}" == https://* ]] || { echo "CLOUDFLARE_SMOKE_TEST_URL wajib HTTPS"; exit 1; }
          [[ "${TENANT_SMOKE_TEST_URL}" == https://*.ngeblogging.com ]] || { echo "TENANT_SMOKE_TEST_URL wajib subdomain ngeblogging.com"; exit 1; }
          if [[ -z "${WORKER_CLOUDFLARE_ZONE_ID}" ]]; then
            echo "Peringatan: CLOUDFLARE_ZONE_ID belum ditemukan pada GitHub secrets/variables; situs tetap dideploy tetapi custom domain akan tetap terkunci."
          fi

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and build production application
        run: npm run test:production && npm run build

      - name: Validate Cloudflare production bundle
        run: npm run cloudflare:dry-run

      - name: Synchronize custom-domain Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const values = {
            CLOUDFLARE_API_TOKEN: process.env.WORKER_CUSTOM_HOSTNAME_API_TOKEN || '',
            CLOUDFLARE_ZONE_ID: process.env.WORKER_CLOUDFLARE_ZONE_ID || '',
          };
          const secrets = Object.fromEntries(Object.entries(values).filter(([, value]) => String(value).trim()));
          fs.writeFileSync('/tmp/ngeblogging-worker-secrets.json', JSON.stringify(secrets));
          console.log(`Menyiapkan ${Object.keys(secrets).length} secret Worker tanpa menampilkan nilainya.`);
          NODE
          if [[ "$(node -p "Object.keys(JSON.parse(require('fs').readFileSync('/tmp/ngeblogging-worker-secrets.json','utf8'))).length")" -gt 0 ]]; then
            npx wrangler secret bulk /tmp/ngeblogging-worker-secrets.json --config wrangler.production.jsonc
          fi
          rm -f /tmp/ngeblogging-worker-secrets.json

      - name: Deploy apex, wildcard tenants, assets, Nara, analytics, and API
        run: npm run deploy:cloudflare

      # Compatibility markers retained for source validators while the live
      # contract is now v39/v38:
      # studio-v14-authority.css
      # nara-command-center-bridge.js
      # ngeblogging-app-v37-20260725
      # 2026.07.25-production-audit-v37
      - name: Verify v39 Studio, Nara, analytics, PWA, domain readiness, and tenant release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            echo "Production verification ${attempt}/24"

            health_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/api/health?release=${stamp}" || true)"
            index_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/index.html -w '%{http_code}' -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"
            sw_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/sw.js -w '%{http_code}' -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/sw.js?release=${stamp}" || true)"
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"

            if [[ "${health_code}" == "200" && "${index_code}" == "200" && "${sw_code}" == "200" && "${tenant_code}" == "200" ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const site = process.env.CLOUDFLARE_SMOKE_TEST_URL.replace(/\/$/, '');
          const tenantSite = process.env.TENANT_SMOKE_TEST_URL.replace(/\/$/, '');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const index = fs.readFileSync('/tmp/index.html', 'utf8');
          const sw = fs.readFileSync('/tmp/sw.js', 'utf8');
          const tenant = fs.readFileSync('/tmp/tenant.html', 'utf8');
          const stamp = Date.now();
          const errors = [];

          async function read(url, options = {}) {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}release=${stamp}`, {
              redirect: 'follow',
              ...options,
              headers: { 'cache-control': 'no-cache', ...(options.headers || {}) },
            });
            return { status: response.status, text: await response.text() };
          }

          const initialAssets = [...index.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)]
            .map((match) => new URL(match[1], site).href);
          const queue = [...new Set(initialAssets)];
          const visited = new Set();
          const assets = [];

          while (queue.length && visited.size < 110) {
            const url = queue.shift();
            if (!url || visited.has(url)) continue;
            visited.add(url);
            const result = await read(url);
            assets.push({ url, ...result });
            if (result.status !== 200 || !/\.js(?:\?|$)/i.test(url)) continue;
            for (const match of result.text.matchAll(/["']((?:\/assets\/|\.\/)[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)) {
              const child = new URL(match[1], url).href;
              if (child.startsWith(`${site}/assets/`) && !visited.has(child)) queue.push(child);
            }
          }

          const combined = assets.map((asset) => asset.text).join('\n');
          const compact = combined.replace(/\s+/g, '');
          const markers = {
            responsiveStudio: compact.includes('--sn-v21-mobile-rail') && compact.includes('--sn-v21-mobile-panel'),
            singleSidebar: combined.includes('single-v21') && combined.includes('sn-sidebar-scrim-v21'),
            directNara: compact.includes('.nara-floating-button') && combined.includes('Buka Nara AI Assistant'),
            naraTools: combined.includes('Projects') && combined.includes('Memori') && combined.includes('Buat gambar') && combined.includes('Plugins') && combined.includes('Baca QR'),
            productionAuditV37: combined.includes('studio-production-audit-v37-20260725') && combined.includes('sp37-analytics'),
            productionV39: combined.includes('studio-production-v39-20260726') && combined.includes('sp39-layout-preview') && combined.includes('HTML/JavaScript'),
            analyticsRpcV38: combined.includes('record_analytics_event') && combined.includes('analytics-v38'),
            pwaRuntime: combined.includes('beforeinstallprompt'),
          };

          if (health.status !== 'ok') errors.push('health.status');
          if (health.service !== 'ngeblogging-cloudflare') errors.push('health.service');
          if (health.release !== '2026.07.25-production-audit-v37') errors.push('health.release');
          if (health.uiRelease !== '2026.07.26-production-v39') errors.push('health.uiRelease');
          if (health.nara !== true) errors.push('health.nara');
          if (health.naraProviders?.vision !== true) errors.push('health.vision');
          if (health.imageGeneration !== true) errors.push('health.imageGeneration');
          if (health.managedSubdomains !== true) errors.push('health.managedSubdomains');
          if (health.analyticsCollector !== true) errors.push('health.analyticsCollector');
          if (health.memberLimitPerSite !== 100) errors.push('health.memberLimitPerSite');
          if (health.widgetCount !== 26) errors.push('health.widgetCount');
          if (process.env.WORKER_CLOUDFLARE_ZONE_ID && health.customDomains !== true) errors.push(`health.customDomains:${(health.customDomainMissing || []).join('|')}`);
          for (const [name, ready] of Object.entries(markers)) if (!ready) errors.push(`bundle:${name}`);
          for (const asset of assets) if (asset.status !== 200) errors.push(`asset:${asset.status}:${asset.url}`);

          if (!sw.includes('ngeblogging-app-v39-20260726') || !sw.includes('ngeblogging-app-v37-20260725')) errors.push('service-worker-v39');
          if (/Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant)) errors.push('tenant-404');
          if (!tenant.includes('/src/main.jsx') && !tenant.includes('/assets/')) errors.push('tenant-app-shell');

          const analyticsProbe = await read(`${tenantSite}/api/analytics/collect`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: tenantSite, 'user-agent': 'NgebloggingProductionAudit/39' },
            body: JSON.stringify({ path: '/__production-audit-v39', visitorId: `audit-${stamp}`, sessionId: `audit-${stamp}`, language: 'id-ID', screenWidth: 390 }),
          });
          let analyticsPayload = {};
          try { analyticsPayload = JSON.parse(analyticsProbe.text || '{}'); } catch {}
          if (analyticsProbe.status !== 202 || analyticsPayload.recorded !== true) errors.push(`analytics-collector:${analyticsProbe.status}/${analyticsPayload.reason || analyticsPayload.error || 'none'}`);

          const unauth = await read(`${site}/api/nara`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: site },
            body: JSON.stringify({ message: 'uji', model: 'nara-mini', intelligence: 'standard', attachments: [], history: [] }),
          });
          let unauthPayload = {};
          try { unauthPayload = JSON.parse(unauth.text || '{}'); } catch {}
          if (unauth.status !== 401 || unauthPayload.code !== 'NARA_SESSION_REQUIRED') errors.push(`nara-auth:${unauth.status}/${unauthPayload.code || 'none'}`);

          if (errors.length) {
            console.error(`Release belum siap: ${errors.join(', ')}`);
            process.exit(1);
          }

          console.log(JSON.stringify({ runtime: health.runtime, uiRelease: health.uiRelease, customDomains: health.customDomains, assets: assets.length, markers, tenant: 'ok', release: 'v39-v38' }, null, 2));
          NODE
              then
                echo "Cloudflare v39, analytics v38, Nara, Studio responsif, PWA, domain readiness, dan tenant publik terverifikasi."
                exit 0
              fi
            fi
            sleep 15
          done

          echo "Cloudflare belum menyajikan kontrak produksi v39/v38 yang lengkap."
          echo "Health terakhir:"; cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Mark production deployment successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Ngeblogging Cloudflare production',
              description: 'v39 Studio, layout, analytics, domains, Nara, PWA, and tenant checks passed.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark production deployment failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Ngeblogging Cloudflare production',
              description: 'Build, deploy, secret synchronization, or live verification failed. Open the workflow log.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
