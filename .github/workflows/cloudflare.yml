name: Cloudflare Workers production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
      CLOUDFLARE_SMOKE_TEST_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment configuration
        shell: bash
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          test -n "${VITE_SUPABASE_URL}" || { echo "Variable VITE_SUPABASE_URL belum diisi"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo "Secret VITE_SUPABASE_PUBLISHABLE_KEY belum diisi"; exit 1; }
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_PUBLIC_SITE_URL}" == https://* ]] || { echo "VITE_PUBLIC_SITE_URL wajib HTTPS"; exit 1; }
          [[ "${CLOUDFLARE_SMOKE_TEST_URL}" == https://* ]] || { echo "CLOUDFLARE_SMOKE_TEST_URL wajib HTTPS"; exit 1; }

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and build production application
        run: npm run test:production && npm run build

      - name: Validate Cloudflare bundle and required secrets
        run: npm run cloudflare:dry-run

      - name: Deploy apex, wildcard tenants, assets, and API to Cloudflare Workers
        run: npm run deploy:cloudflare

      - name: Verify production health endpoint
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 4 --max-time 20 "${CLOUDFLARE_SMOKE_TEST_URL%/}/api/health")"
          echo "${response}" | node -e '
            let input="";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              if (payload.status !== "ok" || payload.service !== "ngeblogging-cloudflare") process.exit(1);
              console.log(`Cloudflare sehat: ${payload.runtime} · ${payload.hostname || "hostname tidak dilaporkan"}`);
            });
          '
