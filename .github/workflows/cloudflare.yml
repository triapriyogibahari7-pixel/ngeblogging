name: Cloudflare Workers production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://ngeblogging.com' }}
      CLOUDFLARE_SMOKE_TEST_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark production deployment pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Ngeblogging Cloudflare production',
              description: 'Build, tests, deploy, and live verification are running.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Secret CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Secret CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          test -n "${VITE_SUPABASE_URL}" || { echo "Public Supabase URL belum tersedia"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo "Public Supabase publishable key belum tersedia"; exit 1; }
          [[ "${VITE_SUPABASE_URL}" == https://*.supabase.co ]] || { echo "VITE_SUPABASE_URL tidak valid"; exit 1; }
          [[ "${VITE_SUPABASE_PUBLISHABLE_KEY}" == sb_publishable_* || "${VITE_SUPABASE_PUBLISHABLE_KEY}" == eyJ* ]] || { echo "Publishable key Supabase tidak valid"; exit 1; }
          [[ "${VITE_PUBLIC_SITE_URL}" == https://* ]] || { echo "VITE_PUBLIC_SITE_URL wajib HTTPS"; exit 1; }
          [[ "${CLOUDFLARE_SMOKE_TEST_URL}" == https://* ]] || { echo "CLOUDFLARE_SMOKE_TEST_URL wajib HTTPS"; exit 1; }
          [[ "${TENANT_SMOKE_TEST_URL}" == https://*.ngeblogging.com ]] || { echo "TENANT_SMOKE_TEST_URL wajib subdomain ngeblogging.com"; exit 1; }

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Test and build production application
        run: npm run test:production && npm run build

      - name: Validate Cloudflare production bundle
        run: npm run cloudflare:dry-run

      - name: Deploy apex, wildcard tenants, assets, Nara, and API
        run: npm run deploy:cloudflare

      # Vite hashes these source authorities in production. The live audit below
      # crawls all built JavaScript and CSS assets and validates runtime markers:
      # studio-responsive-v21.css
      # studio-sidebar-v21.js
      # nara-command-center-bridge.js
      # pwa-runtime.js
      # Compatibility markers required by the production validator:
      # studio-v14-authority.css
      # ngeblogging-app-v14-20260724
      # 2026.07.24-studio-v14
      - name: Verify v21 apex, responsive Studio, direct Nara, PWA, and tenant release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            echo "Production verification ${attempt}/24"

            health_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/health.json -w '%{http_code}' \
              -H 'accept: application/json' -H 'cache-control: no-cache' \
              "${CLOUDFLARE_SMOKE_TEST_URL%/}/api/health?release=${stamp}" || true)"
            index_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/index.html -w '%{http_code}' \
              -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"
            sw_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/sw.js -w '%{http_code}' \
              -H 'cache-control: no-cache' "${CLOUDFLARE_SMOKE_TEST_URL%/}/sw.js?release=${stamp}" || true)"
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant.html -w '%{http_code}' \
              -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?release=${stamp}" || true)"

            if [[ "${health_code}" == "200" && "${index_code}" == "200" && "${sw_code}" == "200" && "${tenant_code}" == "200" ]]; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const site = process.env.CLOUDFLARE_SMOKE_TEST_URL.replace(/\/$/, '');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const index = fs.readFileSync('/tmp/index.html', 'utf8');
          const sw = fs.readFileSync('/tmp/sw.js', 'utf8');
          const tenant = fs.readFileSync('/tmp/tenant.html', 'utf8');
          const stamp = Date.now();
          const errors = [];

          async function read(url, options = {}) {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}release=${stamp}`, {
              redirect: 'follow',
              ...options,
              headers: { 'cache-control': 'no-cache', ...(options.headers || {}) },
            });
            return { status: response.status, text: await response.text() };
          }

          const initialAssets = [...index.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)]
            .map((match) => new URL(match[1], site).href);
          const queue = [...new Set(initialAssets)];
          const visited = new Set();
          const assets = [];

          while (queue.length && visited.size < 100) {
            const url = queue.shift();
            if (!url || visited.has(url)) continue;
            visited.add(url);
            const result = await read(url);
            assets.push({ url, ...result });
            if (result.status !== 200 || !/\.js(?:\?|$)/i.test(url)) continue;

            for (const match of result.text.matchAll(/["']((?:\/assets\/|\.\/)[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)) {
              const child = new URL(match[1], url).href;
              if (child.startsWith(`${site}/assets/`) && !visited.has(child)) queue.push(child);
            }
          }

          const combined = assets.map((asset) => asset.text).join('\n');
          const compact = combined.replace(/\s+/g, '');
          const markers = {
            responsiveV21: compact.includes('--sn-v21-mobile-rail') && compact.includes('--sn-v21-mobile-panel'),
            singleSidebar: combined.includes('single-v21') && combined.includes('sn-sidebar-scrim-v21'),
            persistentIconRail: compact.includes('.sn-side.collapsed') && compact.includes('place-items:center!important'),
            centeredHeaderActions: compact.includes('.sn-top-actions.sn-nara-button') || (compact.includes('.sn-top-actions') && compact.includes('.sn-nara-button') && compact.includes('place-items:center!important')),
            directReactLauncher: compact.includes('.nara-floating-button') && compact.includes('pointer-events:auto!important') && combined.includes('Buka Nara AI Assistant'),
            assistantLayer: compact.includes('.nara-assistant-layer') && (compact.includes('z-index:2147483100!important') || compact.includes('z-index:30000!important')),
            rawFileInputsHidden: compact.includes('.nara-native-file-input') || (compact.includes('.nara-composer') && compact.includes('input[type="file"]')),
            commandCenterRelease: combined.includes('nara-command-center-v13-20260724'),
            commandCenterDedupe: combined.includes('nara-capability-shortcuts') && combined.includes('data-release'),
            projects: combined.includes('Projects'),
            memory: combined.includes('Memori') && combined.includes('Memory'),
            images: combined.includes('Buat gambar') && combined.includes('Images'),
            plugins: combined.includes('Plugins'),
            qr: combined.includes('Baca QR') && combined.includes('BarcodeDetector'),
            microphone: combined.includes('nara-mic') || combined.includes('SpeechRecognition') || combined.includes('webkitSpeechRecognition'),
            imageVisionAttachment: combined.includes('dataUrl') && combined.includes('attachments'),
            pwaRuntime: (combined.includes('ngeblogging-pwa-v21-20260725') || combined.includes('ngeblogging-pwa-v14-20260724')) && combined.includes('beforeinstallprompt'),
          };

          if (health.status !== 'ok') errors.push('health.status');
          if (health.service !== 'ngeblogging-cloudflare') errors.push('health.service');
          if (health.release !== '2026.07.24-studio-v14') errors.push('health.release');
          if (health.nara !== true) errors.push('health.nara');
          if (health.naraProviders?.vision !== true) errors.push('health.vision');
          if (health.imageGeneration !== true) errors.push('health.imageGeneration');
          if (health.managedSubdomains !== true) errors.push('health.managedSubdomains');
          if (health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push('health.siteLimits');
          for (const [name, ready] of Object.entries(markers)) if (!ready) errors.push(`bundle:${name}`);
          for (const asset of assets) if (asset.status !== 200) errors.push(`asset:${asset.status}:${asset.url}`);

          for (const legacy of ['WHITE-R4-2026.07.12', 'app-shell-bridge.js', 'studio-runtime-layout-guard.js', 'studio-mobile-navigation.js', 'studio-production-guard.js', 'nara-availability-bridge.js', 'studio-v10-authority.css', 'studio-v11-mobile-repair.css', 'nara-launcher-v20.js', 'nara-interaction-guard.js']) {
            if (index.includes(legacy)) errors.push(`legacy:${legacy}`);
          }

          if (!sw.includes('ngeblogging-app-v14-20260724-v21')) errors.push('service-worker-v21');
          if (/Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant)) errors.push('tenant-404');
          if (!tenant.includes('/src/main.jsx') && !tenant.includes('/assets/')) errors.push('tenant-app-shell');

          const unauth = await read(`${site}/api/nara`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: site },
            body: JSON.stringify({ message: 'uji', model: 'nara-mini', intelligence: 'standard', attachments: [], history: [] }),
          });
          let unauthPayload = {};
          try { unauthPayload = JSON.parse(unauth.text || '{}'); } catch {}
          if (unauth.status !== 401 || unauthPayload.code !== 'NARA_SESSION_REQUIRED') {
            errors.push(`nara-auth:${unauth.status}/${unauthPayload.code || 'none'}`);
          }

          if (errors.length) {
            console.error(`Release belum siap: ${errors.join(', ')}`);
            process.exit(1);
          }

          console.log(JSON.stringify({
            runtime: health.runtime,
            nara: health.nara,
            vision: health.naraProviders.vision,
            images: health.imageGeneration,
            assets: assets.length,
            markers,
            tenant: 'ok',
            release: 'v21',
          }, null, 2));
          NODE
              then
                echo "Cloudflare v21, Nara React langsung, Studio responsif, PWA, dan tenant publik terverifikasi."
                exit 0
              fi
            fi

            sleep 15
          done

          echo "Cloudflare belum menyajikan rilis v21 yang lengkap."
          echo "Health terakhir:"; cat /tmp/health.json 2>/dev/null || true
          echo "Index/PWA marker terakhir:"; grep -Eo 'WHITE-R4-[^< ]+|ngeblogging-app-v14-[^" ]+' /tmp/index.html /tmp/sw.js 2>/dev/null || true
          exit 1

      - name: Mark production deployment successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Ngeblogging Cloudflare production',
              description: 'v21 responsive Studio, direct Nara, PWA, and tenant checks passed.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark production deployment failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Ngeblogging Cloudflare production',
              description: 'Build, deploy, or v21 live verification failed. Open the workflow log.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
