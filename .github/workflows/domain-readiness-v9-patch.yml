name: Apply domain readiness v9 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/domain-readiness-v9-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove inactive custom-domain placeholders
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/domain-management-bridge.js';
          let source = readFileSync(path, 'utf8');
          const replace = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Patch target missing: ${label}`);
            source = source.replace(from, to);
          };

          replace(
            '  if (loading) {\n    container.innerHTML = `<section class="dm-panel"><div class="dm-loading">Memeriksa domain produksi…</div></section>`;\n    return;\n  }\n  if (error) {\n    container.innerHTML = `<section class="dm-panel"><header><div><small>DOMAIN CUSTOM</small><h2>Pengelolaan domain belum dapat dimuat</h2></div></header><p class="dm-error">${escapeHtml(error)}</p><button type="button" class="dm-retry">Coba lagi</button></section>`;\n    return;\n  }\n  if (!config?.enabled) {\n    container.innerHTML = `<section class="dm-panel dm-disabled"><header><div><small>DOMAIN CUSTOM</small><h2>Belum dibuka untuk produksi</h2></div><i>Aman</i></header><p>Form domain, tombol aktivasi, dan instruksi DNS disembunyikan sampai Cloudflare for SaaS, target CNAME, token server, dan penyimpanan domain benar-benar siap. Subdomain gratis tetap tersedia.</p></section>`;\n    return;\n  }\n  container.innerHTML = `',
            '  if (loading || error || !config?.enabled) {\n    container.hidden = true;\n    container.replaceChildren();\n    return;\n  }\n  container.hidden = false;\n  container.innerHTML = `',
            'domain readiness rendering',
          );

          replace('  container.className = "dm-root";\n', '  container.className = "dm-root";\n  container.hidden = true;\n', 'domain root initial visibility');

          if (source.includes('Belum dibuka untuk produksi') || source.includes('Pengelolaan domain belum dapat dimuat') || source.includes('Memeriksa domain produksi')) throw new Error('Inactive custom-domain placeholder remains');
          writeFileSync(path, source);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "ngeblogging-release-bot"
          git config user.email "release-bot@ngeblogging.com"
          git add src/domain-management-bridge.js
          git diff --cached --check
          git commit -m "Hide custom domain UI until provisioning is live"
          git push origin HEAD:main
