name: Ngeblogging production route activation v219

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-route-v219
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          echo "RESOLVED_CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          echo "RESOLVED_CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}" >> "${GITHUB_ENV}"

      - name: Build and run complete production regression
        id: build
        run: npm run build

      - name: Build safe pre-cutover v219 Worker configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-precutover-wrangler-v219.mjs wrangler.production.jsonc wrangler.production.precutover-v219.jsonc
          npx wrangler deploy --config wrangler.production.precutover-v219.jsonc --dry-run --outdir .wrangler-production-v219

      - name: Deploy v219 Worker and assets before apex cutover
        id: deploy_worker
        run: npx wrangler deploy --config wrangler.production.precutover-v219.jsonc --keep-vars

      - name: Verify v219 on workers.dev before route mutation
        id: worker_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            output="/tmp/workers-v219-${attempt}.json"
            headers="/tmp/workers-v219-${attempt}.headers"
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v219.json?verify_v219=${stamp}" || true)"
            if [[ "${code}" == 200 ]] && ! grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v219-20260802"||x.theme?.builtInThemesRequired!==100||x.theme?.eagerStudioSurface!==true||x.nara?.camera!==true||x.nara?.photo!==true||x.nara?.file!==true||x.authentication?.persistSessionRequired!==true||x.serviceWorker?.forcedNavigation!==false||x.claims?.massUserCapacityClaimed!==false)process.exit(1)' "${output}"; then
                echo "WORKERS_DEV_V219_VERIFIED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V219_VERIFY_FAILED"
          exit 1

      - name: Detach stale Worker Domains and install apex routes
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify live apex Studio auth tenant and v219
        id: live_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true
            for path in / /login /signup /studio /release-v219.json; do
              safe_name="$(printf '%s' "${path}" | tr '/.' '__')"
              output="/tmp/ngeblogging-v219-${attempt}-${safe_name}.out"
              headers="/tmp/ngeblogging-v219-${attempt}-${safe_name}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v219=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${output}" "${headers}"; then ok=false; fi
              if [[ "${path}" == "/release-v219.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v219-20260802"||x.theme?.builtInThemesRequired!==100||x.theme?.blankSurfaceRejected!==true||x.nara?.smallMediumNonModal!==true||x.serviceWorker?.version!=="ngeblogging-app-v219-theme-blank-resilience-20260802")process.exit(1)' "${output}" || ok=false
              else
                grep -q 'id="root"' "${output}" || ok=false
              fi
            done
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/tenant-v219.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v219=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false
            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_V219_LIVE_VERIFIED"
              echo "LEGACY_WHITE_R4_REJECTED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_V219_LIVE_VERIFY_FAILED"
          exit 1

      - name: Publish v219 production status
        if: always()
        uses: actions/github-script@v7
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_WORKER_OUTCOME: ${{ steps.deploy_worker.outcome }}
          WORKER_VERIFY_OUTCOME: ${{ steps.worker_verify.outcome }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          LIVE_VERIFY_OUTCOME: ${{ steps.live_verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = {
              credentials: process.env.CREDENTIALS_OUTCOME || 'not-run',
              build: process.env.BUILD_OUTCOME || 'not-run',
              config: process.env.CONFIG_OUTCOME || 'not-run',
              deployWorker: process.env.DEPLOY_WORKER_OUTCOME || 'not-run',
              workerVerify: process.env.WORKER_VERIFY_OUTCOME || 'not-run',
              cutover: process.env.CUTOVER_OUTCOME || 'not-run',
              liveVerify: process.env.LIVE_VERIFY_OUTCOME || 'not-run',
            };
            const success = Object.values(outcomes).every((value) => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'Ngeblogging production v219',
              description: success ? 'v219 live; WHITE-R4 rejected' : `v219: ${JSON.stringify(outcomes).slice(0,110)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
