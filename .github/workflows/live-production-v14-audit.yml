name: Live production v14 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Print live v14 diagnostics
        shell: bash
        run: |
          set -u
          stamp="$(date +%s)"
          health_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' -H 'accept: application/json' "https://ngeblogging.com/api/health?audit=${stamp}" -o health.json -w '%{http_code}' || true)"
          index_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' "https://ngeblogging.com/?audit=${stamp}" -o index.html -w '%{http_code}' || true)"
          sw_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' "https://ngeblogging.com/sw.js?audit=${stamp}" -o sw.js -w '%{http_code}' || true)"
          tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' "https://tri-apriyogi-bahari.ngeblogging.com/?audit=${stamp}" -o tenant.html -w '%{http_code}' || true)"
          export HEALTH_CODE="$health_code" INDEX_CODE="$index_code" SW_CODE="$sw_code" TENANT_CODE="$tenant_code"

          node <<'NODE'
          const fs = require('node:fs');
          const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
          const healthText = read('health.json');
          const index = read('index.html');
          const sw = read('sw.js');
          const tenant = read('tenant.html');
          let health = {};
          try { health = JSON.parse(healthText); } catch {}
          const legacy = ['WHITE-R4-2026.07.12','studio-runtime-layout-guard.js','studio-mobile-navigation.js','studio-production-guard.js','nara-availability-bridge.js','studio-v10-authority.css','studio-v11-mobile-repair.css','nara-interaction-authority.css','nara-interaction-guard.js'].filter((value) => index.includes(value));
          const result = {
            http: { health: process.env.HEALTH_CODE, index: process.env.INDEX_CODE, sw: process.env.SW_CODE, tenant: process.env.TENANT_CODE },
            health: {
              status: health.status,
              service: health.service,
              release: health.release,
              runtime: health.runtime,
              billing: health.billing,
              paypal: health.billingProviders?.paypal,
              localBilling: health.billingProviders?.local,
              nara: health.nara,
              qwen: health.naraProviders?.qwen,
              workersAi: health.naraProviders?.workersAi,
              vision: health.naraProviders?.vision,
              imageGeneration: health.imageGeneration,
              imageProviders: health.imageProviders,
              customDomains: health.customDomains,
              emailRegistration: health.emailRegistration,
              managedSubdomains: health.managedSubdomains,
              siteLimits: health.siteLimits,
            },
            index: {
              bytes: Buffer.byteLength(index),
              v14Css: index.includes('studio-v14-authority.css'),
              commandCenter: index.includes('nara-command-center-bridge.js'),
              legacy,
            },
            pwa: { bytes: Buffer.byteLength(sw), v14: sw.includes('ngeblogging-app-v14-20260724') },
            tenant: {
              bytes: Buffer.byteLength(tenant),
              is404: /Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant),
              appShell: tenant.includes('/src/main.jsx') || tenant.includes('/assets/'),
            },
          };
          console.log(`LIVE_V14_RESULT=${JSON.stringify(result)}`);
          NODE
