name: Live production v14 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout audit script
        uses: actions/checkout@v6
      - name: Inspect live v14 runtime and bundled capabilities
        run: node scripts/live-v14-audit.mjs
