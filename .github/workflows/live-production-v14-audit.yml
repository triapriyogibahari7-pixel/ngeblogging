name: Live production v14 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit live apex health PWA and tenant
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' -H 'accept: application/json' \
            "https://ngeblogging.com/api/health?audit=${stamp}" -o health.json -w 'health_http=%{http_code}\n'
          curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' \
            "https://ngeblogging.com/?audit=${stamp}" -o index.html -w 'index_http=%{http_code}\n'
          curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' \
            "https://ngeblogging.com/sw.js?audit=${stamp}" -o sw.js -w 'sw_http=%{http_code}\n'
          curl -sS -L --connect-timeout 10 --max-time 30 -H 'cache-control: no-cache' \
            "https://tri-apriyogi-bahari.ngeblogging.com/?audit=${stamp}" -o tenant.html -w 'tenant_http=%{http_code}\n'

          node <<'NODE'
          const fs = require('node:fs');
          const healthText = fs.readFileSync('health.json', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const tenant = fs.readFileSync('tenant.html', 'utf8');
          let health;
          try { health = JSON.parse(healthText); }
          catch { throw new Error(`Health bukan JSON: ${healthText.slice(0, 300)}`); }

          const errors = [];
          if (health.status !== 'ok') errors.push(`health.status=${health.status}`);
          if (health.service !== 'ngeblogging-cloudflare') errors.push(`health.service=${health.service}`);
          if (health.release !== '2026.07.24-studio-v14') errors.push(`health.release=${health.release}`);
          if (health.nara !== true) errors.push(`health.nara=${health.nara}`);
          if (health.naraProviders?.vision !== true) errors.push(`health.vision=${health.naraProviders?.vision}`);
          if (health.imageGeneration !== true) errors.push(`health.imageGeneration=${health.imageGeneration}`);
          if (health.managedSubdomains !== true) errors.push(`health.managedSubdomains=${health.managedSubdomains}`);
          if (health.siteLimits?.free !== 5 || health.siteLimits?.maximum !== 12) errors.push(`health.siteLimits=${JSON.stringify(health.siteLimits)}`);
          for (const marker of ['studio-v14-authority.css', 'nara-command-center-bridge.js']) {
            if (!index.includes(marker)) errors.push(`index missing ${marker}`);
          }
          for (const legacy of ['WHITE-R4-2026.07.12', 'studio-runtime-layout-guard.js', 'studio-mobile-navigation.js', 'studio-production-guard.js', 'nara-availability-bridge.js', 'studio-v10-authority.css', 'studio-v11-mobile-repair.css', 'nara-interaction-authority.css', 'nara-interaction-guard.js']) {
            if (index.includes(legacy)) errors.push(`index legacy ${legacy}`);
          }
          if (!sw.includes('ngeblogging-app-v14-20260724')) errors.push('service worker bukan v14');
          if (/Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant)) errors.push('tenant masih 404');
          if (!tenant.includes('/src/main.jsx') && !tenant.includes('/assets/')) errors.push('tenant tidak menyajikan app shell');

          console.log(JSON.stringify({
            health,
            indexBytes: Buffer.byteLength(index),
            indexV14: index.includes('studio-v14-authority.css'),
            serviceWorkerV14: sw.includes('ngeblogging-app-v14-20260724'),
            tenantBytes: Buffer.byteLength(tenant),
            tenant404: /Situs belum tersedia|>404<|404\s*[-–—]/i.test(tenant),
            errors,
          }, null, 2));
          if (errors.length) process.exit(1);
          NODE
