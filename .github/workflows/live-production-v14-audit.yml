name: Live production v14 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live v14 runtime and bundled capabilities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "authorization: Bearer ${GH_TOKEN}" \
            -H "accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/triapriyogibahari7-pixel/ngeblogging/contents/scripts/live-v14-audit.mjs?ref=audit/live-production-v14" \
            -o /tmp/live-v14-audit.mjs
          node /tmp/live-v14-audit.mjs
