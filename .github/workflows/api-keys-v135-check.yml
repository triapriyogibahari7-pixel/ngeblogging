name: API Keys v135 Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/ApiKeysPanel.jsx"
      - "src/api-keys-studio.css"
      - "src/api-keys-studio-bridge.jsx"
      - "src/api-keys-studio-bridge.css"
      - "src/nara-connectors-v29.js"
      - "supabase/**"
      - "tests/api-keys-restored-v135.test.mjs"
      - ".github/workflows/api-keys-v135-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
