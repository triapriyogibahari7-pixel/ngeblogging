name: Apply Domain single authority v112

# Trigger revision 2: workflow now existed before this push.
on:
  push:
    branches: [main]
    paths:
      - ".github/patches/domain-v112.patch.gz.b64"
      - ".github/workflows/apply-domain-v112.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-domain-v112-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/domain-v112.patch.gz.b64 | gzip -dc > /tmp/domain-v112.patch
          git apply --check /tmp/domain-v112.patch

      - name: Apply Domain v112 source changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/domain-v112.patch

      - name: Validate JavaScript and focused regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check server/domain-handler-v112.mjs
          node --check cloudflare/worker.mjs
          node --check src/domain-manager-v80.js
          node --check src/studio-production-audit-v37.js
          node --check src/studio-domain-single-authority-v112.js
          node --check src/lib/domain-scope-v112.js
          node --test \
            tests/domain-single-authority-v112.test.mjs \
            tests/domain-manager-v78.test.mjs \
            tests/domain-manager-v80.test.mjs \
            tests/studio-flow-integrity-v111.test.mjs \
            tests/readiness-v9.test.mjs \
            tests/source-navigation-v9.test.mjs

      - name: Commit one-authority Domain implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cloudflare/worker.mjs \
            public/sw.js \
            server/domain-handler-v112.mjs \
            src/StudioNext.jsx \
            src/StudioSecure.jsx \
            src/domain-manager-v80.css.js \
            src/domain-manager-v80.js \
            src/lib/domain-scope-v112.js \
            src/studio-domain-single-authority-v112.css \
            src/studio-domain-single-authority-v112.js \
            src/studio-production-audit-v37.js \
            tests/domain-single-authority-v112.test.mjs
          if git diff --cached --quiet; then
            echo "Domain v112 source is already applied."
            exit 0
          fi
          git commit -m "fix: enforce one active-site Domain authority v112"
          git push origin HEAD:main
