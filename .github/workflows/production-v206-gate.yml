name: Ngeblogging production Studio v206 live gate

on:
  workflow_run:
    workflows:
      - "Ngeblogging production route cutover v184 — Studio v191/v192/v195/v196/v197/v205"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-v206-live-gate
  cancel-in-progress: false

jobs:
  verify-v206-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APEX_URL: https://ngeblogging.com
      WORKERS_DEV_URL: https://ngeblogging.triapriyogibahari7.workers.dev
      TENANT_URL: https://tri-apriyogi-bahari.ngeblogging.com
      RELEASE_ID: studio-production-v206-20260802
      LEGACY_MARKER: WHITE-R4-2026.07.12

    steps:
      - name: Resolve deployed commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha='${{ github.event.workflow_run.head_sha }}'
          else
            sha='${{ github.sha }}'
          fi
          test -n "${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify v206 on Worker apex auth Studio and tenant
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          verify_release() {
            local url="$1"
            local output="$2"
            local stamp="$3"
            local code
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "${url%/}/release-v206.json?verify_v206=${stamp}" || true)"
            [[ "${code}" == "200" ]] || return 1
            ! grep -q "${LEGACY_MARKER}" "${output}" || return 1
            node - "${output}" "${RELEASE_ID}" <<'NODE'
          const fs = require('fs');
          const [file, expected] = process.argv.slice(2);
          const x = JSON.parse(fs.readFileSync(file, 'utf8'));
          const ok = x.release === expected
            && x.repairs?.themeLayoutActionNative === true
            && x.repairs?.themeLayoutActionSingleVisibleLabel === true
            && x.repairs?.mobileNLogoWhiteOnBlueOpen === true
            && x.repairs?.naraHeaderTwoRowsOnHandheld === true
            && x.repairs?.naraCameraPhotoFileInsideNativePlusMenu === true
            && x.repairs?.studioDirectMembershipRecovery === true
            && x.repairs?.emptyMembershipDoesNotCreateFakeSite === true
            && x.repairs?.transientDataFailureDoesNotLogout === true
            && x.validation?.realDeviceRequiredBeforeHundredPercentClaim === true
            && x.validation?.nineHundredMillionUserCapacityClaimed === false;
          if (!ok) process.exit(1);
          NODE
          }

          verify_shell() {
            local path="$1"
            local output="$2"
            local stamp="$3"
            local code
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${output}" -w '%{http_code}' -H 'cache-control: no-cache' "${APEX_URL}${path}?verify_v206=${stamp}" || true)"
            [[ "${code}" == "200" ]] || return 1
            ! grep -q "${LEGACY_MARKER}" "${output}" || return 1
            grep -q 'id="root"' "${output}"
          }

          for attempt in $(seq 1 60); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            verify_release "${WORKERS_DEV_URL}" /tmp/v206-worker.json "${stamp}" || ok=false
            verify_release "${APEX_URL}" /tmp/v206-apex.json "${stamp}" || ok=false

            for path in / /login /signup /studio; do
              safe="$(printf '%s' "${path}" | tr '/.' '__')"
              verify_shell "${path}" "/tmp/v206-shell-${safe}.html" "${stamp}" || ok=false
            done

            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/v206-tenant.html -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_URL%/}/?verify_v206=${stamp}" || true)"
            [[ "${tenant_code}" == "200" ]] || ok=false
            if grep -q "${LEGACY_MARKER}" /tmp/v206-tenant.html 2>/dev/null; then ok=false; fi

            if [[ "${ok}" == "true" ]]; then
              echo "PRODUCTION_STUDIO_V206_LIVE_VERIFIED"
              exit 0
            fi

            echo "v206 live gate attempt ${attempt}/60 belum konsisten; mencoba lagi..."
            sleep 10
          done

          echo "PRODUCTION_STUDIO_V206_LIVE_VERIFY_FAILED"
          exit 1

      - name: Publish v206 production status
        if: always()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.TARGET_SHA || context.sha;
            const outcome = process.env.VERIFY_OUTCOME || 'not-run';
            const success = outcome === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? 'success' : 'failure',
              context: 'Ngeblogging production Studio v206',
              description: success ? 'v206 live on Worker + apex + Studio + auth + tenant' : `v206 live gate=${outcome}`,
              target_url: runUrl,
            });
