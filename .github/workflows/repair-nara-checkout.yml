name: Repair Nara checkout integration
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-nara-checkout.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ngeblogging-cloudflare-compatibility-manual
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Replace legacy upgrade source with existing billing component
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/NaraAssistant.jsx';
          let source = readFileSync(path, 'utf8');
          const marker = 'data-nara-checkout-integration="midtrans-v1"';
          if (source.includes(marker)) process.exit(0);
          const replaceOne = (pattern, replacement, label) => {
            if ([...source.matchAll(pattern)].length !== 1) throw Error('SOURCE_SHAPE_MISMATCH: ' + label);
            source = source.replace(pattern, () => replacement);
          };
          replaceOne(/import "\.\/nara-v313\.css";/g, 'import "./nara-v313.css";\nimport BillingView from "./BillingView";', 'billing import');
          replaceOne(/  const requestPro = async \(\) => \{[\s\S]*?\n  \};\n(?=  const send =)/g, '', 'legacy request function');
          const card = `<div className="nara-upgrade-card" data-nara-checkout-integration="midtrans-v1" style={{textAlign: "left"}}>
            <button type="button" className="nara-upgrade-close" onClick={() => setShowUpgrade(false)} aria-label="Tutup pembayaran Nara Pro"><X /></button>
            <BillingView setToast={setNotice} />
          </div>`;
          replaceOne(/<div className="nara-upgrade-card"[^>]*>[\s\S]*?<\/div>(?=\s*\)\})/g, card, 'upgrade card');
          if (source.includes('requestPro') || source.includes('Permintaan akses awal Nara Pro sudah tersimpan') || source.includes('Minta akses awal Pro')) throw Error('LEGACY_UPGRADE_REMAINS');
          writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test billing catalog
        run: node --test tests/billing-catalog.test.mjs
      - name: Build actual application
        run: npx vite build
      - name: Verify legacy upgrade absent from built assets
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const files = readdirSync('dist/assets').filter(name => name.endsWith('.js'));
          const bundle = files.map(name => readFileSync('dist/assets/' + name, 'utf8')).join('\n');
          for (const text of ['Permintaan akses awal Nara Pro sudah tersimpan', 'Minta akses awal Pro']) if (bundle.includes(text)) throw Error('LEGACY_TEXT_IN_BUNDLE');
          if (!bundle.includes('midtrans-v1') || !bundle.includes('/api/billing/midtrans/create')) throw Error('CHECKOUT_NOT_IN_BUNDLE');
          NODE
      - name: Commit validated component repair
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- src/NaraAssistant.jsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/NaraAssistant.jsx
            git commit -m 'fix(nara): replace early-access upgrade with Midtrans billing'
            git push origin HEAD:main
          fi
          echo "DEPLOY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Version repaired application caches
        run: |
          GITHUB_SHA="$DEPLOY_COMMIT" node scripts/version-service-worker.mjs
          cp public/sw.js dist/sw.js
      - name: Stamp actual deployed source commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'dist/release-v344.json';
          const release = JSON.parse(readFileSync(path, 'utf8'));
          release.deployment_commit = process.env.DEPLOY_COMMIT;
          writeFileSync(path, JSON.stringify(release));
          NODE
      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy validated Worker and assets
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars
      - name: Verify exact live code and catalog
        run: GITHUB_SHA="$DEPLOY_COMMIT" node scripts/verify-midtrans-deployment.mjs
