name: Verify Studio v205

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-v205.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-studio-v205-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: v205 regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify v205 contract
        run: npm run verify:v205

      - name: Production build
        run: npm run build
