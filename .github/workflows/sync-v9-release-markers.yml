name: Sync v9 release markers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-v9-release-markers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace stale v7 and v8 release assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'ngeblogging-app-v8-20260724': 'ngeblogging-app-v9-20260724',
              '2026.07.24-mobile-final-v7': '2026.07.24-studio-v9',
              "uiRelease: 'mobile-final-v7'": "uiRelease: 'studio-v9'",
              "pwaRelease: 'ngeblogging-app-v7-20260724'": "pwaRelease: 'ngeblogging-app-v9-20260724'",
          }
          changed = []
          for root in (Path('tests'), Path('.github/workflows')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.mjs', '.js', '.yml', '.yaml'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No stale release assertions found')
          PY

      - name: Commit synchronized assertions
        shell: bash
        run: |
          git config user.name "ngeblogging-release-bot"
          git config user.email "release-bot@ngeblogging.com"
          git add tests .github/workflows
          git diff --cached --check
          git commit -m "Synchronize tests and smoke checks with v9 release"
          git pull --rebase origin main
          git push origin HEAD:main
