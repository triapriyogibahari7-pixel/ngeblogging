name: Deploy Ngeblogging Production v290

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v290
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run v289 and v290 regression, service-worker rotation and portable production build
        run: npm run build

      - name: Verify production source and built markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          node -e 'const p=require("./package.json"); if (p.scripts.build.includes("cloudflare:dry-run")) throw new Error("generic build must stay platform-neutral"); if (!p.scripts["test:production"].includes("studio-final-pass-v289.test.mjs") || !p.scripts["test:production"].includes("studio-native-controls-v290.test.mjs")) throw new Error("v289/v290 regression missing from production test");'
          for release in 273 274 275 276 277 278 279 280 281 282 283 284 285 286 287 288 289 290; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-native-controls-v290-20260805' public/release-v290.json
          grep -q 'auth-studio-handoff-v290-20260805' public/release-v290.json
          grep -q 'import "./auth-studio-handoff-v290.js"' src/auth-provider-gateway-v250.js
          grep -Fq 'import("./studio-native-controls-v290.js")' src/studio-final-pass-v289.js
          if grep -q 'import "./studio-native-controls-v290.js"' src/auth-provider-gateway-v250.js; then
            echo 'v290 UI must load after the Studio v289 CSS authority, not from the early auth entry.' >&2
            exit 1
          fi
          grep -q '/studio?auth=callback' src/auth-studio-handoff-v290.js
          grep -q 'moveCallbackPathToStudio' src/auth-studio-handoff-v290.js
          grep -q 'immediateNativeToggle' src/studio-native-controls-v290.js
          grep -q 'pointerdown' src/studio-native-controls-v290.js
          grep -q 'body.sn-mobile-sidebar-open .sn-side-backdrop' src/studio-native-controls-v290.css
          grep -q 'pointer-events:none!important' src/studio-native-controls-v290.css
          grep -q '.nara-floating-button{' src/studio-native-controls-v290.css
          grep -q 'position:fixed!important' src/studio-native-controls-v290.css
          grep -q 'studio-final-pass-v289-20260805' public/release-v289.json
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-native-controls-v290-20260805"' wrangler.production.jsonc
          grep -q '"AUTH_STUDIO_HANDOFF_RELEASE": "auth-studio-handoff-v290-20260805"' wrangler.production.jsonc
          grep -q 'STUDIO_NATIVE_CONTROLS_RELEASE_V290' public/sw.js
          grep -q 'AUTH_STUDIO_HANDOFF_RELEASE_V290' public/sw.js
          grep -q 'studio-native-controls-cache-v290' public/sw.js
          grep -q 'ngeblogging-app-v290-native-controls-20260805' public/sw.js
          grep -R -q 'studio-native-controls-v290-20260805' dist/assets
          grep -R -q 'auth-studio-handoff-v290-20260805' dist/assets
          if grep -q '^import "./studio-production-v208.js";' src/Studio.jsx; then
            echo 'v208 legacy hard-reload runtime must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./nara-size-authority-v144.js";' src/Studio.jsx; then
            echo 'legacy Nara observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./studio-interface-v148.js";' src/Studio.jsx; then
            echo 'legacy interface observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q 'new MutationObserver' src/nara-controls-v135.js; then
            echo 'legacy Nara fullscreen observer must remain retired.' >&2
            exit 1
          fi

      - name: Validate Cloudflare bundle separately from the portable app build
        run: npm run cloudflare:dry-run

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler custom-domain deployment tetap dijalankan dan live gate berikutnya wajib membuktikan apex.'
          fi

      - name: Verify live v290 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v290.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-native-controls-v290-20260805' && printf '%s' "$body" | grep -q 'auth-studio-handoff-v290-20260805'; then
              echo "Live v290 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v290.json after deployment." >&2
          exit 1

      - name: Verify live Studio v290 bundle
        shell: bash
        run: |
          set -euo pipefail
          chunk_path="$(grep -Rl 'studio-native-controls-v290-20260805' dist/assets | head -n 1)"
          test -n "$chunk_path"
          live_path="/${chunk_path#dist/}"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com${live_path}?commit=${GITHUB_SHA}" -o /tmp/studio-v290.js
          grep -q 'studio-native-controls-v290-20260805' /tmp/studio-v290.js
          grep -q 'auth-studio-handoff-v290-20260805' /tmp/studio-v290.js

      - name: Verify live Studio callback shell and service worker v290
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/studio?auth=callback&commit=${GITHUB_SHA}" -o /tmp/studio-callback-v290.html
          grep -q 'id="root"' /tmp/studio-callback-v290.html
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v290.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_NATIVE_CONTROLS_RELEASE_V290' /tmp/sw-v290.js
          grep -q 'AUTH_STUDIO_HANDOFF_RELEASE_V290' /tmp/sw-v290.js
          grep -q 'studio-native-controls-cache-v290' /tmp/sw-v290.js
          grep -q 'ngeblogging-app-v290-native-controls-20260805' /tmp/sw-v290.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v290-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
