name: Deploy Ngeblogging Production v291

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v291
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run v289 v290 v291 regression and production build
        run: |
          node --test tests/studio-final-pass-v289.test.mjs tests/studio-native-controls-v290.test.mjs tests/studio-auth-sidebar-v291.test.mjs
          npm run build

      - name: Verify v291 source and built markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 273 274 275 276 277 278 279 280 281 282 283 284 285 286 287 288 289 290 291; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-auth-sidebar-v291-20260805' public/release-v291.json
          grep -q 'studio-auth-sidebar-cache-v291' public/release-v291.json
          grep -q 'auth-provider-navigation-v291-20260805' src/auth-provider-gateway-v250.js
          if grep -q 'import "./auth-studio-handoff-v290.js"' src/auth-provider-gateway-v250.js; then
            echo 'Speculative /studio callback monkey patch must stay retired.' >&2
            exit 1
          fi
          grep -Fq 'appUrl("/?auth=callback")' src/lib/supabase.js
          grep -Fq 'appUrl("/?auth=recovery")' src/lib/supabase.js
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q 'Sidebar n ownership was retired in v291' src/studio-react-shell-v287.js
          if grep -q 'const reactToggle' src/studio-react-shell-v287.js; then
            echo 'v287 must not own sidebar n interaction.' >&2
            exit 1
          fi
          grep -q 'studio-auth-sidebar-v291-20260805' src/studio-native-controls-v290.js
          grep -q 'function nativeToggle(event)' src/studio-native-controls-v290.js
          grep -Fq 'document.addEventListener("click", nativeToggle, true)' src/studio-native-controls-v290.js
          grep -q 'nativeToggleKeyboard' src/studio-native-controls-v290.js
          if grep -Eq 'pointerdown|immediateNativeToggle|toggle\.disabled[[:space:]]*=[[:space:]]*true|muteTimer' src/studio-native-controls-v290.js; then
            echo 'Double-toggle / temporary-disable regression detected.' >&2
            exit 1
          fi
          grep -q 'body.sn-mobile-sidebar-open .sn-side-backdrop' src/studio-native-controls-v290.css
          grep -q 'pointer-events:none!important' src/studio-native-controls-v290.css
          grep -q '.nara-floating-button{' src/studio-native-controls-v290.css
          grep -q 'position:fixed!important' src/studio-native-controls-v290.css
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-auth-sidebar-v291-20260805"' wrangler.production.jsonc
          grep -q '"AUTH_STUDIO_HANDOFF_RELEASE": "root-callback-compat-v291-20260805"' wrangler.production.jsonc
          grep -q 'STUDIO_AUTH_SIDEBAR_RELEASE_V291' public/sw.js
          grep -q 'studio-auth-sidebar-cache-v291' public/sw.js
          grep -q 'ngeblogging-app-v291-auth-sidebar-20260805' public/sw.js
          grep -R -q 'studio-auth-sidebar-v291-20260805' dist/assets
          if grep -q '^import "./studio-production-v208.js";' src/Studio.jsx; then
            echo 'v208 legacy hard-reload runtime must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./nara-size-authority-v144.js";' src/Studio.jsx; then
            echo 'legacy Nara observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./studio-interface-v148.js";' src/Studio.jsx; then
            echo 'legacy interface observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q 'new MutationObserver' src/nara-controls-v135.js; then
            echo 'legacy Nara fullscreen observer must remain retired.' >&2
            exit 1
          fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler custom-domain deployment tetap dijalankan dan live gate berikutnya wajib membuktikan apex.'
          fi

      - name: Verify live v291 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v291.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-auth-sidebar-v291-20260805'; then
              echo "Live v291 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v291.json after deployment." >&2
          exit 1

      - name: Verify live Studio v291 bundle
        shell: bash
        run: |
          set -euo pipefail
          chunk_path="$(grep -Rl 'studio-auth-sidebar-v291-20260805' dist/assets | head -n 1)"
          test -n "$chunk_path"
          live_path="/${chunk_path#dist/}"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com${live_path}?commit=${GITHUB_SHA}" -o /tmp/studio-v291.js
          grep -q 'studio-auth-sidebar-v291-20260805' /tmp/studio-v291.js

      - name: Verify live root auth callback shell and service worker v291
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/?auth=callback&commit=${GITHUB_SHA}" -o /tmp/auth-callback-v291.html
          grep -q 'id="root"' /tmp/auth-callback-v291.html
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v291.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_AUTH_SIDEBAR_RELEASE_V291' /tmp/sw-v291.js
          grep -q 'studio-auth-sidebar-cache-v291' /tmp/sw-v291.js
          grep -q 'ngeblogging-app-v291-auth-sidebar-20260805' /tmp/sw-v291.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v291-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
