name: Deploy Ngeblogging Production v312

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the previous production group name for this cutover so a still-running
  # v310 deployment is cancelled instead of racing the v312 deployment.
  group: ngeblogging-production-v310
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run production regression and build
        run: npm run build

      - name: Verify v312 source, generated assets, and preserved v310/v311 authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f public/release-v310.json
          test -f public/release-v311.json
          test -f public/release-v312.json
          test -f src/theme-studio-v312.css
          test -f src/studio-domain-v312.css
          test -f tests/studio-theme-members-domain-v312.test.mjs
          test -f supabase/migrations/20260806030000_members_owner_transfer_v312.sql
          test -f supabase/migrations/20260806032000_members_rpc_anon_hardening_v312.sql

          grep -q 'studio-theme-members-domain-v312-20260806' public/release-v312.json
          grep -q '"themes": 100' public/release-v312.json
          grep -q '"layoutAreas": 26' public/release-v312.json
          grep -q '"layoutModels": 2' public/release-v312.json
          grep -q '"codeLineNumbers": 10000' public/release-v312.json
          grep -q '"memberRoleChoices": 5' public/release-v312.json
          grep -q '"ownerTransferAtomic": true' public/release-v312.json
          grep -q '"customDomainAutoReconcile": true' public/release-v312.json
          grep -q '"sidebarUntouched": true' public/release-v312.json
          grep -q '"massiveCapacityClaimed": false' public/release-v312.json

          grep -q 'theme-map-code-editor-v312-20260806' src/ThemeStudio.jsx
          grep -q 'Array.from({ length: 10000 }' src/ThemeStudio.jsx
          grep -q 'Model editorial' src/ThemeStudio.jsx
          grep -q 'Model majalah' src/ThemeStudio.jsx
          grep -q 'HTML / CSS / JavaScript' src/widget-system.js
          grep -q 'composeThemeLayoutV170' src/theme-system.js
          grep -q 'transfer_site_owner_v312' src/studio-members-v304.js
          grep -q 'member-more-menu-v312' src/studio-members-v304.css
          grep -q 'routing Worker sedang disinkronkan otomatis' src/DomainPanelV124.jsx
          grep -q 'sv124-domain-auto-v312' src/studio-domain-v312.css

          grep -q 'current_owner <> auth.uid()' supabase/migrations/20260806030000_members_owner_transfer_v312.sql
          grep -q 'from anon, public' supabase/migrations/20260806032000_members_rpc_anon_hardening_v312.sql

          if grep -Eq '#ngeblogging-studio-sidebar|\.sn-side|\.sn-logo-mark|\.nara-assistant' src/theme-studio-v312.css; then
            echo 'v312 Theme Studio attempted to restyle the already-correct Studio sidebar/Nara.' >&2
            exit 1
          fi

          grep -q 'first-site-onboarding-stability-v311-20260806' src/StudioOnboardingGate.jsx
          grep -q 'studio-fast-entry-v311-20260806' src/StudioFastGate.jsx
          grep -q 'studio-content-editor-desktop-site-v310-20260806' src/studio-content-editor-responsive-v308.js
          grep -q '@media (min-width:820px) and (max-width:1080px)' src/studio-content-editor-desktop-site-v310.css
          if grep -Eq '#ngeblogging-studio-sidebar|\.sn-side|\.sn-logo-mark' src/studio-content-editor-desktop-site-v310.css; then
            echo 'v310/v312 editor attempted to restyle the Studio sidebar.' >&2
            exit 1
          fi

          grep -q 'STUDIO_THEME_MEMBERS_DOMAIN_RELEASE_V312' public/sw.js
          grep -q 'studio-theme-members-domain-cache-v312' public/sw.js
          grep -q 'ngeblogging-app-v312-theme-members-domain-20260806' public/sw.js
          grep -q 'STUDIO_FIRST_SITE_STABILITY_RELEASE_V311' public/sw.js
          grep -q 'STUDIO_CONTENT_EDITOR_DESKTOP_SITE_RELEASE_V310' public/sw.js
          grep -q 'STUDIO_SITE_SWITCH_FIRST_SITE_RELEASE_V305' public/sw.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' public/sw.js

          grep -R -q 'theme-map-code-editor-v312-20260806' dist/assets
          grep -R -q 'transfer_site_owner_v312' dist/assets
          grep -R -q 'routing Worker sedang disinkronkan otomatis' dist/assets
          grep -R -q 'first-site-onboarding-stability-v311-20260806' dist/assets
          grep -R -q 'studio-content-editor-desktop-site-v310-20260806' dist/assets

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler deployment tetap dijalankan dan live gate wajib membuktikan apex.'
          fi

      - name: Verify live v312 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v312.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-theme-members-domain-v312-20260806'; then
              echo "Live v312 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v312.json after deployment." >&2
          exit 1

      - name: Verify live v312 bundles plus preserved v311 and v310
        shell: bash
        run: |
          set -euo pipefail
          theme_chunk="$(grep -Rl 'theme-map-code-editor-v312-20260806' dist/assets | head -n 1)"
          member_chunk="$(grep -Rl 'transfer_site_owner_v312' dist/assets | head -n 1)"
          domain_chunk="$(grep -Rl 'routing Worker sedang disinkronkan otomatis' dist/assets | head -n 1)"
          onboarding_chunk="$(grep -Rl 'first-site-onboarding-stability-v311-20260806' dist/assets | head -n 1)"
          editor_chunk="$(grep -Rl 'studio-content-editor-desktop-site-v310-20260806' dist/assets | head -n 1)"
          for chunk in "$theme_chunk" "$member_chunk" "$domain_chunk" "$onboarding_chunk" "$editor_chunk"; do test -n "$chunk"; done

          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${theme_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-theme-v312.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${member_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-members-v312.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${domain_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-domain-v312.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${onboarding_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-onboarding-v311.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${editor_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-editor-v310.js

          grep -q 'theme-map-code-editor-v312-20260806' /tmp/studio-theme-v312.js
          grep -q 'transfer_site_owner_v312' /tmp/studio-members-v312.js
          grep -q 'routing Worker sedang disinkronkan otomatis' /tmp/studio-domain-v312.js
          grep -q 'first-site-onboarding-stability-v311-20260806' /tmp/studio-onboarding-v311.js
          grep -q 'studio-content-editor-desktop-site-v310-20260806' /tmp/studio-editor-v310.js

      - name: Verify live auth shell and service worker v312
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/?auth=callback&commit=${GITHUB_SHA}" -o /tmp/auth-callback-v312.html
          grep -q 'id="root"' /tmp/auth-callback-v312.html
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v312.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_THEME_MEMBERS_DOMAIN_RELEASE_V312' /tmp/sw-v312.js
          grep -q 'studio-theme-members-domain-cache-v312' /tmp/sw-v312.js
          grep -q 'ngeblogging-app-v312-theme-members-domain-20260806' /tmp/sw-v312.js
          grep -q 'STUDIO_FIRST_SITE_STABILITY_RELEASE_V311' /tmp/sw-v312.js
          grep -q 'STUDIO_CONTENT_EDITOR_DESKTOP_SITE_RELEASE_V310' /tmp/sw-v312.js
          grep -q 'STUDIO_SITE_SWITCH_FIRST_SITE_RELEASE_V305' /tmp/sw-v312.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' /tmp/sw-v312.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v312-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
