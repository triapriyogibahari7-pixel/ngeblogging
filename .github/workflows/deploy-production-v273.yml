name: Deploy Ngeblogging Production v318

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v318
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run production regression and build
        run: npm run build

      - name: Verify v318 and inherited production authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 310 311 312 313 314 315 316 317 318; do test -f "public/release-v${release}.json"; done
          test -f src/studio-hotfix-v318.css
          test -f scripts/patch-studio-hotfix-v318.mjs
          test -f supabase/migrations/20260806053000_api_keys_pgcrypto_search_path_v318.sql

          grep -q 'studio-screenshot-hotfix-v318-20260806' public/release-v318.json
          grep -q '"themeModalViewportSafe": true' public/release-v318.json
          grep -q '"themeMapModelsPreserved": 2' public/release-v318.json
          grep -q '"themeLayoutAreasPreserved": 26' public/release-v318.json
          grep -q '"themeCountPreserved": 100' public/release-v318.json
          grep -q '"apiKeyCryptoSearchPathFixed": true' public/release-v318.json
          grep -q '"apiKeyCreateListRevokeRotateValidated": true' public/release-v318.json
          grep -q 'studio-hotfix-v318.css' src/studio-content-editor-responsive-v308.js
          grep -q 'studio-screenshot-hotfix-v318-20260806' src/studio-content-editor-responsive-v308.js
          grep -q '.tn-modal-layer{position:fixed!important;inset:0!important' src/studio-hotfix-v318.css
          grep -q 'grid-template-areas:"preview" "code"' src/studio-hotfix-v318.css
          grep -q 'data-theme-code-v312="line-numbers-10000"' src/studio-hotfix-v318.css
          grep -q 'tn-layout-models-v312' src/studio-hotfix-v318.css
          grep -q '.sn-api-modal-layer{position:fixed!important;inset:0!important' src/studio-hotfix-v318.css
          grep -q 'search_path = public, extensions, pg_temp' supabase/migrations/20260806053000_api_keys_pgcrypto_search_path_v318.sql

          # Preserve every earlier authority required by the Studio.
          grep -q 'studio-final-responsive-v317-20260806' public/release-v317.json
          grep -q '"workerDomainAttachVerification": true' public/release-v317.json
          grep -q 'studio-content-editor-final-v316-20260806' public/release-v316.json
          grep -q '"wordLimit": 5000' public/release-v316.json
          grep -q '"draftNeverTrimmed": true' public/release-v316.json
          grep -q 'auth-callback-session-recovery-v315-20260806' public/release-v315.json
          grep -q '"persistSessionPreserved": true' public/release-v315.json
          grep -q 'studio-domain-fullzone-v314-20260806' public/release-v314.json
          grep -q '"fakeActiveStatusAllowed": false' public/release-v314.json
          grep -q 'studio-nara-nonmodal-v313-20260806' public/release-v313.json
          grep -q '"smallNonModal": true' public/release-v313.json
          grep -q '"mediumNonModal": true' public/release-v313.json
          grep -q 'studio-theme-members-domain-v312-20260806' public/release-v312.json
          grep -q '"themes": 100' public/release-v312.json
          grep -q '"layoutAreas": 26' public/release-v312.json
          grep -q '"layoutModels": 2' public/release-v312.json
          grep -q '"codeLineNumbers": 10000' public/release-v312.json
          grep -q 'first-site-onboarding-stability-v311-20260806' public/release-v311.json
          grep -q 'cloudflare-worker-domain-verified-v317-20260806' server/cloudflare-full-zone-provider.mjs
          grep -q 'verifyWorkerDomainAttachment' server/cloudflare-full-zone-provider.mjs
          grep -q 'Workers Scripts Write' server/cloudflare-full-zone-provider.mjs

          # v318 must be the final cache authority while inherited markers remain.
          grep -q 'STUDIO_SCREENSHOT_HOTFIX_RELEASE_V318' public/sw.js
          grep -q 'studio-screenshot-hotfix-cache-v318' public/sw.js
          grep -q 'ngeblogging-app-v318-screenshot-hotfix-20260806' public/sw.js
          grep -q 'STUDIO_FINAL_RESPONSIVE_RELEASE_V317' public/sw.js
          grep -q 'STUDIO_CONTENT_EDITOR_FINAL_RELEASE_V316' public/sw.js
          grep -q 'STUDIO_DOMAIN_FULLZONE_RELEASE_V314' public/sw.js
          grep -q 'STUDIO_NARA_NONMODAL_RELEASE_V313' public/sw.js
          grep -q 'STUDIO_THEME_MEMBERS_DOMAIN_RELEASE_V312' public/sw.js

          grep -R -q 'studio-screenshot-hotfix-v318-20260806' dist/assets
          grep -R -q 'studio-final-responsive-v317-20260806' dist/assets
          grep -R -q 'studio-content-editor-final-v316-20260806' dist/assets

      - name: Verify Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'CLOUDFLARE_ACCOUNT_ID wajib tersedia.' >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'CLOUDFLARE_API_TOKEN wajib tersedia.' >&2
            exit 1
          fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative Ngeblogging routes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; melewati route reassertion.'
          fi

      - name: Verify live v318 and inherited manifests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            latest="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v318.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            previous="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v317.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$latest" | grep -q 'studio-screenshot-hotfix-v318-20260806' && printf '%s' "$previous" | grep -q 'studio-final-responsive-v317-20260806'; then
              echo 'Live v318 plus v317 inheritance confirmed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Live production did not expose v318.' >&2
          exit 1

      - name: Verify live v318 bundle and service worker
        shell: bash
        run: |
          set -euo pipefail
          latest_chunk="$(grep -Rl 'studio-screenshot-hotfix-v318-20260806' dist/assets | head -n 1)"
          test -n "$latest_chunk"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${latest_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-v318.js
          grep -q 'studio-screenshot-hotfix-v318-20260806' /tmp/studio-v318.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v318.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_SCREENSHOT_HOTFIX_RELEASE_V318' /tmp/sw-v318.js
          grep -q 'studio-screenshot-hotfix-cache-v318' /tmp/sw-v318.js
          grep -q 'ngeblogging-app-v318-screenshot-hotfix-20260806' /tmp/sw-v318.js
          grep -q 'STUDIO_FINAL_RESPONSIVE_RELEASE_V317' /tmp/sw-v318.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v318-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
