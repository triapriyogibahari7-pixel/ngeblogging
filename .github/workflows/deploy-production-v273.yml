name: Deploy Ngeblogging Production v283

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v283
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate rollout contract
        run: node --test tests/production-rollout-v273.test.mjs tests/studio-shell-content-v274.test.mjs tests/studio-final-stability-v275.test.mjs tests/studio-sidebar-recovery-v276.test.mjs tests/studio-interaction-authority-v277.test.mjs tests/studio-shell-precision-v278.test.mjs tests/studio-live-shell-v279.test.mjs tests/studio-native-shell-v280.test.mjs tests/studio-native-controls-v281.test.mjs tests/public-edge-v282.test.mjs tests/studio-native-recovery-v283.test.mjs

      - name: Run complete production regression and build
        run: npm run build

      - name: Verify production source markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 273 274 275 276 277 278 279 280 281 282 283; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-production-rollout-v273-20260804' public/release-v273.json
          grep -q 'studio-shell-content-v274-20260804' public/release-v274.json
          grep -q 'studio-final-stability-v275-20260804' public/release-v275.json
          grep -q 'studio-sidebar-recovery-v276-20260804' public/release-v276.json
          grep -q 'studio-interaction-authority-v277-20260804' public/release-v277.json
          grep -q 'studio-shell-precision-v278-20260804' public/release-v278.json
          grep -q 'studio-live-shell-v279-20260804' public/release-v279.json
          grep -q 'studio-native-shell-v280-20260804' public/release-v280.json
          grep -q 'studio-native-controls-v281-20260805' public/release-v281.json
          grep -q 'public-edge-request-dedup-v282-20260805' public/release-v282.json
          grep -q 'studio-native-recovery-v283-20260805' public/release-v283.json
          grep -q 'studio-native-controls-v281.js' src/Studio.jsx
          grep -q 'studio-native-controls-v281.css' src/Studio.jsx
          grep -q 'studio-native-recovery-v283.js' src/Studio.jsx
          grep -q 'studio-native-recovery-v283.css' src/Studio.jsx
          grep -q 'studio-theme-layout-v264.js' src/Studio.jsx
          grep -q 'studio-sidebar-single-toggle-v267.js' src/Studio.jsx
          grep -q 'function activateLogo' src/studio-native-recovery-v283.js
          grep -q 'loadAnalytics(view, 30, false)' src/studio-native-recovery-v283.js
          grep -q 'MAX_CODE_LINES = 10000' src/studio-native-recovery-v283.js
          if grep -q 'new MutationObserver' src/studio-native-recovery-v283.js; then
            echo 'v283 tidak boleh memasang observer shell kontinu.' >&2
            exit 1
          fi
          if grep -q 'addEventListener("scroll"' src/studio-native-recovery-v283.js; then
            echo 'v283 tidak boleh menulis DOM pada scroll halaman.' >&2
            exit 1
          fi
          if grep -q 'window.addEventListener("pointerdown", stopLegacyPointer, true)' src/studio-shell-precision-v278.js; then
            echo 'Pointerdown capture sidebar aktif kembali dan dapat memacetkan tap mobile.' >&2
            exit 1
          fi
          grep -q 'POINTERDOWN_CAPTURE_RETIRED_BY' src/studio-shell-precision-v278.js
          if grep -q 'addEventListener("scroll"' src/studio-live-shell-v279.js src/studio-native-shell-v280.js src/studio-native-controls-v281.js; then
            echo 'Scroll-time shell DOM mutation aktif kembali pada compatibility layer.' >&2
            exit 1
          fi
          grep -q 'data-device-mode="large"' src/studio-native-recovery-v283.css
          grep -q 'data-device-mode="small"' src/studio-native-recovery-v283.css
          grep -q '.nara-attachment-menu' src/studio-native-recovery-v283.css
          grep -q '.tn-layout-map-v264' src/studio-native-recovery-v283.css
          grep -q '.sv124-free-domain' src/studio-native-recovery-v283.css
          grep -q 'MAX_CONTENT_WORDS = 5000' src/studio-native-controls-v281.js
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q 'public-edge-request-dedup-v282-20260805' cloudflare/worker-v70.mjs
          grep -q 'url.pathname.startsWith("/assets/")' cloudflare/worker-v70.mjs
          grep -q 'x-ngeblogging-static-fast-path' cloudflare/worker-v70.mjs
          grep -q 'x-ngeblogging-static-fallback-blocked' cloudflare/worker-v70.mjs
          grep -q '"main": "./cloudflare/worker-v70.mjs"' wrangler.production.jsonc
          grep -q '"PUBLIC_EDGE_RELEASE": "public-edge-request-dedup-v282-20260805"' wrangler.production.jsonc
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-native-recovery-v283-20260805"' wrangler.production.jsonc
          if grep -Eq 'if \(/refreshStaleWindow\|' scripts/patch-service-worker-v277.mjs scripts/patch-service-worker-v278.mjs; then
            echo 'Build gate masih menolak helper compatibility refreshStaleWindow.' >&2
            exit 1
          fi
          grep -q 'STUDIO_NATIVE_RECOVERY_RELEASE_V283' public/sw.js
          grep -q 'studio-native-recovery-cache-v283' public/sw.js

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify live v283 Studio release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v283.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-native-recovery-v283-20260805'; then
              echo "Live v283 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v283.json after deployment." >&2
          exit 1

      - name: Verify live service worker, v283 cache and v282 static fast path
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -D /tmp/sw-headers.txt -o /tmp/sw-v283.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -qi 'x-ngeblogging-public-edge: public-edge-request-dedup-v282-20260805' /tmp/sw-headers.txt
          grep -qi 'x-ngeblogging-static-fast-path: true' /tmp/sw-headers.txt
          grep -q 'STUDIO_NATIVE_CONTROLS_RELEASE_V281' /tmp/sw-v283.js
          grep -q 'STUDIO_NATIVE_RECOVERY_RELEASE_V283' /tmp/sw-v283.js
          grep -q 'studio-native-recovery-cache-v283' /tmp/sw-v283.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -D /tmp/health-headers.txt -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json
          grep -qi 'x-ngeblogging-public-edge: public-edge-request-dedup-v282-20260805' /tmp/health-headers.txt

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v283-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30