name: Deploy Ngeblogging Production v280

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v280
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate rollout contract
        run: node --test tests/production-rollout-v273.test.mjs tests/studio-shell-content-v274.test.mjs tests/studio-final-stability-v275.test.mjs tests/studio-sidebar-recovery-v276.test.mjs tests/studio-interaction-authority-v277.test.mjs tests/studio-shell-precision-v278.test.mjs tests/studio-live-shell-v279.test.mjs tests/studio-native-shell-v280.test.mjs

      - name: Run complete production regression and build
        run: npm run build

      - name: Verify production source markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 273 274 275 276 277 278 279 280; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-production-rollout-v273-20260804' public/release-v273.json
          grep -q 'studio-shell-content-v274-20260804' public/release-v274.json
          grep -q 'studio-final-stability-v275-20260804' public/release-v275.json
          grep -q 'studio-sidebar-recovery-v276-20260804' public/release-v276.json
          grep -q 'studio-interaction-authority-v277-20260804' public/release-v277.json
          grep -q 'studio-shell-precision-v278-20260804' public/release-v278.json
          grep -q 'studio-live-shell-v279-20260804' public/release-v279.json
          grep -q 'studio-native-shell-v280-20260804' public/release-v280.json
          grep -q 'studio-shell-precision-v278.js' src/Studio.jsx
          grep -q 'studio-live-shell-v279.js' src/Studio.jsx
          grep -q 'studio-native-shell-v280.js' src/Studio.jsx
          grep -q 'studio-native-shell-v280.css' src/Studio.jsx
          grep -q 'studio-theme-layout-v264.js' src/Studio.jsx
          grep -q 'studio-sidebar-single-toggle-v267.js' src/Studio.jsx
          grep -q 'window.addEventListener("pointerdown", stopLegacyPointer, true)' src/studio-shell-precision-v278.js
          grep -q 'window.addEventListener("click", activateLogo, true)' src/studio-shell-precision-v278.js
          grep -q 'RETIRED_LIVE_OBSERVERS_BY' src/studio-live-shell-v279.js
          if grep -q 'addEventListener("scroll"' src/studio-live-shell-v279.js src/studio-native-shell-v280.js; then
            echo 'Scroll-time shell DOM mutation aktif kembali.' >&2
            exit 1
          fi
          grep -q 'data-device-mode="large"' src/studio-native-shell-v280.css
          grep -q 'data-device-mode="small"' src/studio-native-shell-v280.css
          grep -q '.nara-attachment-menu' src/studio-native-shell-v280.css
          grep -q '.sv124-free-domain' src/studio-native-shell-v280.css
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          if grep -Eq 'if \(/refreshStaleWindow\|' scripts/patch-service-worker-v277.mjs scripts/patch-service-worker-v278.mjs; then
            echo 'Build gate masih menolak helper compatibility refreshStaleWindow.' >&2
            exit 1
          fi
          grep -q 'STUDIO_LIVE_SHELL_RELEASE_V279' public/sw.js
          grep -q 'studio-live-shell-cache-v279' public/sw.js
          grep -q 'STUDIO_NATIVE_SHELL_RELEASE_V280' public/sw.js
          grep -q 'studio-native-shell-cache-v280' public/sw.js

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify live v280 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v280.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-native-shell-v280-20260804'; then
              echo "Live v280 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v280.json after deployment." >&2
          exit 1

      - name: Verify live service worker contains v280 cache chain
        shell: bash
        run: |
          set -euo pipefail
          sw="$(curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}")"
          printf '%s' "$sw" | grep -q 'STUDIO_LIVE_SHELL_RELEASE_V279'
          printf '%s' "$sw" | grep -q 'studio-live-shell-cache-v279'
          printf '%s' "$sw" | grep -q 'STUDIO_NATIVE_SHELL_RELEASE_V280'
          printf '%s' "$sw" | grep -q 'studio-native-shell-cache-v280'

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v280-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30