name: Deploy Ngeblogging Production v293

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v293
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run v289-v293 regression and production build
        run: |
          node --test tests/studio-final-pass-v289.test.mjs tests/studio-native-controls-v290.test.mjs tests/studio-auth-sidebar-v291.test.mjs tests/studio-startup-v292.test.mjs
          npm run build

      - name: Verify v292 login and v293 UI markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 273 274 275 276 277 278 279 280 281 282 283 284 285 286 287 288 289 290 291 292 293; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-startup-direct-data-v292-20260805' public/release-v292.json
          grep -q 'auth-session-handoff-v292-20260805' public/release-v292.json
          grep -q 'studio-final-authority-v293-20260805' public/release-v293.json
          grep -q 'studio-final-authority-cache-v293' public/release-v293.json
          grep -q 'startup-membership-direct-first-v292-20260805' src/studio-startup-v292.js
          grep -q 'window.__ngebloggingVerifiedSession = verified' src/studio-startup-v292.js
          grep -q '/rest/v1/site_members' src/studio-startup-v292.js
          grep -q 'return await directMembership(userId)' src/studio-startup-v292.js
          grep -q 'import "./studio-startup-v292.js"' src/auth-provider-gateway-v250.js
          grep -q 'listUserSitesStartupV292' src/StudioOnboardingGate.jsx
          grep -q 'STARTUP_DATA_TIMEOUT_MS = 11_000' src/StudioOnboardingGate.jsx
          grep -q 'ngeblogging-active-site-snapshot-v292' src/StudioOnboardingGate.jsx
          if grep -Eq 'getVerifiedSession\(\{[[:space:]]*force:[[:space:]]*true' src/StudioOnboardingGate.jsx; then
            echo 'Studio startup must not force a second remote user verification after valid login.' >&2
            exit 1
          fi
          grep -q 'studio-fast-entry-v292-20260805' src/StudioFastGate.jsx
          grep -q 'studio-auth-sidebar-v291-20260805' src/studio-native-controls-v290.js
          grep -q 'function nativeToggle(event)' src/studio-native-controls-v290.js
          grep -Fq 'document.addEventListener("click", nativeToggle, true)' src/studio-native-controls-v290.js
          grep -q 'nativeToggleKeyboard' src/studio-native-controls-v290.js
          grep -q 'studio-final-authority-v293.js' src/studio-native-controls-v290.js
          if grep -Eq 'pointerdown|immediateNativeToggle|toggle\.disabled[[:space:]]*=[[:space:]]*true|muteTimer' src/studio-native-controls-v290.js; then
            echo 'Double-toggle / temporary-disable regression detected.' >&2
            exit 1
          fi
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q 'studio-final-authority-v293-20260805' src/studio-final-authority-v293.js
          grep -q 'CONTENT_WORD_LIMIT = 5_000' src/studio-final-authority-v293.js
          grep -q 'CODE_LINE_LIMIT = 10_000' src/studio-final-authority-v293.js
          grep -q -- '--v293-side-open:220px' src/studio-final-authority-v293.css
          grep -q -- '--v293-side-rail:70px' src/studio-final-authority-v293.css
          grep -q 'grid-template-areas:"code preview"' src/studio-final-authority-v293.css
          grep -q 'grid-template-areas:"preview" "code"' src/studio-final-authority-v293.css
          grep -q 'nara-assistant-layer\[data-nara-interaction="nonmodal"\]' src/studio-final-authority-v293.css
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-final-authority-v293-20260805"' wrangler.production.jsonc
          grep -q '"AUTH_STUDIO_HANDOFF_RELEASE": "auth-session-handoff-v292-20260805"' wrangler.production.jsonc
          grep -q 'STUDIO_STARTUP_DIRECT_DATA_RELEASE_V292' public/sw.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' public/sw.js
          grep -q 'STUDIO_FINAL_AUTHORITY_RELEASE_V293' public/sw.js
          grep -q 'studio-final-authority-cache-v293' public/sw.js
          grep -q 'ngeblogging-app-v293-final-authority-20260805' public/sw.js
          grep -R -q 'studio-startup-direct-data-v292-20260805' dist/assets
          grep -R -q 'studio-final-authority-v293-20260805' dist/assets
          if grep -q '^import "./studio-production-v208.js";' src/Studio.jsx; then echo 'v208 legacy hard-reload runtime must not be active.' >&2; exit 1; fi
          if grep -q '^import "./nara-size-authority-v144.js";' src/Studio.jsx; then echo 'legacy Nara observer must not be active.' >&2; exit 1; fi
          if grep -q '^import "./studio-interface-v148.js";' src/Studio.jsx; then echo 'legacy interface observer must not be active.' >&2; exit 1; fi
          if grep -q 'new MutationObserver' src/nara-controls-v135.js; then echo 'legacy Nara fullscreen observer must remain retired.' >&2; exit 1; fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler custom-domain deployment tetap dijalankan dan live gate berikutnya wajib membuktikan apex.'
          fi

      - name: Verify live v293 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v293.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-final-authority-v293-20260805'; then echo "Live v293 release manifest confirmed."; exit 0; fi
            sleep 10
          done
          echo "Live production did not expose release-v293.json after deployment." >&2
          exit 1

      - name: Verify live Studio v292 startup and v293 UI bundles
        shell: bash
        run: |
          set -euo pipefail
          startup_chunk="$(grep -Rl 'studio-startup-direct-data-v292-20260805' dist/assets | head -n 1)"
          ui_chunk="$(grep -Rl 'studio-final-authority-v293-20260805' dist/assets | head -n 1)"
          test -n "$startup_chunk"
          test -n "$ui_chunk"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${startup_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-startup-v292.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${ui_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-ui-v293.js
          grep -q 'studio-startup-direct-data-v292-20260805' /tmp/studio-startup-v292.js
          grep -q 'studio-final-authority-v293-20260805' /tmp/studio-ui-v293.js

      - name: Verify live auth callback shell and service worker v293
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/?auth=callback&commit=${GITHUB_SHA}" -o /tmp/auth-callback-v293.html
          grep -q 'id="root"' /tmp/auth-callback-v293.html
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v293.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_STARTUP_DIRECT_DATA_RELEASE_V292' /tmp/sw-v293.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' /tmp/sw-v293.js
          grep -q 'STUDIO_FINAL_AUTHORITY_RELEASE_V293' /tmp/sw-v293.js
          grep -q 'studio-final-authority-cache-v293' /tmp/sw-v293.js
          grep -q 'ngeblogging-app-v293-final-authority-20260805' /tmp/sw-v293.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v293-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
