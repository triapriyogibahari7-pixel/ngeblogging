name: Deploy Ngeblogging Production v315

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v310
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run production regression and build
        run: npm run build

      - name: Verify v315 editor and preserved authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f public/release-v310.json
          test -f public/release-v311.json
          test -f public/release-v312.json
          test -f public/release-v313.json
          test -f public/release-v314.json
          test -f public/release-v315.json
          test -f src/studio-content-editor-final-v315.css
          test -f src/studio-content-editor-final-v315.js
          test -f scripts/patch-studio-content-editor-v315.mjs
          test -f tests/studio-content-editor-post-page-v309.test.mjs
          test -f tests/studio-domain-fullzone-v314.test.mjs
          test -f tests/studio-nara-nonmodal-v313.test.mjs
          test -f tests/studio-theme-members-domain-v312.test.mjs

          grep -q 'studio-content-editor-final-v315-20260806' public/release-v315.json
          grep -q '"wordLimit": 5000' public/release-v315.json
          grep -q '"wordWarning": 4500' public/release-v315.json
          grep -q '"draftNeverTrimmed": true' public/release-v315.json
          grep -q '"publicationBlockedOverLimit": true' public/release-v315.json
          grep -q '"domainV314Preserved": true' public/release-v315.json
          grep -q '"sidebarUntouched": true' public/release-v315.json
          grep -q '"massiveCapacityClaimed": false' public/release-v315.json
          grep -q 'studio-content-editor-final-v315.js' src/studio-content-editor-responsive-v308.js
          grep -q 'CONTENT_WORD_LIMIT_V315 = 5000' src/studio-content-editor-final-v315.js
          grep -q 'CONTENT_WORD_WARNING_V315 = 4500' src/studio-content-editor-final-v315.js
          grep -q 'publishButton.disabled = over' src/studio-content-editor-final-v315.js
          grep -q 'publishedOption.disabled = over' src/studio-content-editor-final-v315.js
          grep -q 'grid-template-areas:"back file" "actions actions"' src/studio-content-editor-final-v315.css
          grep -q 'grid-template-columns:minmax(0,1fr) clamp(270px,27vw,340px)' src/studio-content-editor-final-v315.css
          if grep -Eq '#ngeblogging-studio-sidebar|\.sn-side|\.sn-logo-mark|\.nara-assistant|\.tn-studio' src/studio-content-editor-final-v315.css; then
            echo 'v315 editor attempted to restyle another Studio authority.' >&2
            exit 1
          fi

          grep -q 'studio-domain-fullzone-v314-20260806' public/release-v314.json
          grep -q '"provider": "cloudflare-full-zone"' public/release-v314.json
          grep -q '"legacyDomainMigration": true' public/release-v314.json
          grep -q '"fakeActiveStatusAllowed": false' public/release-v314.json
          grep -q '"CUSTOM_DOMAIN_PROVIDER": "cloudflare-full-zone"' wrangler.production.jsonc
          grep -q 'cloudflare-full-zone-authority-v314' wrangler.production.jsonc
          grep -q 'domain-legacy-to-full-zone-v314-20260806' wrangler.production.jsonc
          grep -q 'DOMAIN_FULL_ZONE_MIGRATION_RELEASE_V314' server/domain-handler.mjs
          grep -q 'migratingLegacyDomain' server/domain-handler.mjs
          grep -q 'return registerFullZoneDomain(' server/domain-handler.mjs
          if grep -q 'code: "DOMAIN_PROVIDER_MISMATCH"' server/domain-handler.mjs; then
            echo 'Legacy domain provider mismatch regression returned.' >&2
            exit 1
          fi

          grep -q 'studio-nara-nonmodal-v313-20260806' public/release-v313.json
          grep -q '"smallNonModal": true' public/release-v313.json
          grep -q '"mediumNonModal": true' public/release-v313.json
          grep -q 'data-nara-release-v313="studio-nara-nonmodal-v313-20260806"' src/NaraAssistant.jsx
          grep -q 'pointer-events:none!important' src/nara-v313.css

          grep -q 'studio-theme-members-domain-v312-20260806' public/release-v312.json
          grep -q '"themes": 100' public/release-v312.json
          grep -q '"layoutAreas": 26' public/release-v312.json
          grep -q '"codeLineNumbers": 10000' public/release-v312.json
          grep -q '"memberRoleChoices": 5' public/release-v312.json
          grep -q 'transfer_site_owner_v312' src/studio-members-v304.js
          grep -q 'memberRemoveV306' src/studio-members-v304.js
          grep -q 'routing Worker sedang disinkronkan otomatis' src/DomainPanelV124.jsx

          grep -q 'first-site-onboarding-stability-v311-20260806' src/StudioOnboardingGate.jsx
          grep -q 'studio-content-editor-desktop-site-v310-20260806' src/studio-content-editor-responsive-v308.js

          grep -q '"STUDIO_CONTENT_EDITOR_FINAL_RELEASE": "studio-content-editor-final-v315-20260806"' wrangler.production.jsonc
          grep -q '"CUSTOM_DOMAIN_PROVIDER": "cloudflare-full-zone"' wrangler.production.jsonc

          grep -q 'STUDIO_CONTENT_EDITOR_FINAL_RELEASE_V315' public/sw.js
          grep -q 'studio-content-editor-final-cache-v315' public/sw.js
          grep -q 'ngeblogging-app-v315-post-pages-final-20260806' public/sw.js
          grep -q 'STUDIO_DOMAIN_FULLZONE_RELEASE_V314' public/sw.js
          grep -q 'STUDIO_NARA_NONMODAL_RELEASE_V313' public/sw.js
          grep -q 'STUDIO_THEME_MEMBERS_DOMAIN_RELEASE_V312' public/sw.js
          grep -q 'STUDIO_FIRST_SITE_STABILITY_RELEASE_V311' public/sw.js
          grep -q 'STUDIO_CONTENT_EDITOR_DESKTOP_SITE_RELEASE_V310' public/sw.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' public/sw.js

          grep -R -q 'studio-content-editor-final-v315-20260806' dist/assets
          grep -R -q 'studio-nara-nonmodal-v313-20260806' dist/assets
          grep -R -q 'theme-map-code-editor-v312-20260806' dist/assets
          grep -R -q 'routing Worker sedang disinkronkan otomatis' dist/assets

      - name: Verify Full Zone deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'CLOUDFLARE_ACCOUNT_ID wajib tersedia untuk Full Zone custom domain.' >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'CLOUDFLARE_API_TOKEN wajib tersedia untuk Full Zone custom domain.' >&2
            exit 1
          fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; live gate tetap wajib membuktikan apex.'
          fi

      - name: Verify live v315 and preserved v314 manifests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            editor="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v315.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            domain="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v314.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$editor" | grep -q 'studio-content-editor-final-v315-20260806' && printf '%s' "$domain" | grep -q 'studio-domain-fullzone-v314-20260806'; then
              echo 'Live v315 editor and v314 Full Zone manifests confirmed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Live production did not expose both v315 editor and v314 domain manifests.' >&2
          exit 1

      - name: Verify live v315 service worker and bundles
        shell: bash
        run: |
          set -euo pipefail
          editor_chunk="$(grep -Rl 'studio-content-editor-final-v315-20260806' dist/assets | head -n 1)"
          test -n "$editor_chunk"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${editor_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-editor-v315.js
          grep -q 'studio-content-editor-final-v315-20260806' /tmp/studio-editor-v315.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v315.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_CONTENT_EDITOR_FINAL_RELEASE_V315' /tmp/sw-v315.js
          grep -q 'studio-content-editor-final-cache-v315' /tmp/sw-v315.js
          grep -q 'ngeblogging-app-v315-post-pages-final-20260806' /tmp/sw-v315.js
          grep -q 'STUDIO_DOMAIN_FULLZONE_RELEASE_V314' /tmp/sw-v315.js
          grep -q 'STUDIO_NARA_NONMODAL_RELEASE_V313' /tmp/sw-v315.js

      - name: Verify live auth shell and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/?auth=callback&commit=${GITHUB_SHA}" -o /tmp/auth-callback-v315.html
          grep -q 'id="root"' /tmp/auth-callback-v315.html
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v315-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
