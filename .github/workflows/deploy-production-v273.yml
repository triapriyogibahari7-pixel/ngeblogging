name: Deploy Ngeblogging Production v278

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v278
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate rollout contract
        run: node --test tests/production-rollout-v273.test.mjs tests/studio-shell-content-v274.test.mjs tests/studio-final-stability-v275.test.mjs tests/studio-sidebar-recovery-v276.test.mjs tests/studio-interaction-authority-v277.test.mjs tests/studio-shell-precision-v278.test.mjs

      - name: Run complete production regression and build
        run: npm run build

      - name: Verify production source markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f public/release-v273.json
          test -f public/release-v274.json
          test -f public/release-v275.json
          test -f public/release-v276.json
          test -f public/release-v277.json
          test -f public/release-v278.json
          grep -q 'studio-production-rollout-v273-20260804' public/release-v273.json
          grep -q 'studio-shell-content-v274-20260804' public/release-v274.json
          grep -q 'studio-final-stability-v275-20260804' public/release-v275.json
          grep -q 'studio-sidebar-recovery-v276-20260804' public/release-v276.json
          grep -q 'studio-interaction-authority-v277-20260804' public/release-v277.json
          grep -q 'studio-shell-precision-v278-20260804' public/release-v278.json
          grep -q 'studio-shell-authority-v272.js' src/Studio.jsx
          grep -q 'studio-shell-content-v274.js' src/Studio.jsx
          grep -q 'studio-final-stability-v275.css' src/Studio.jsx
          grep -q 'studio-sidebar-recovery-v276.js' src/Studio.jsx
          grep -q 'studio-interaction-authority-v277.js' src/Studio.jsx
          grep -q 'studio-shell-precision-v278.js' src/Studio.jsx
          grep -q 'studio-shell-precision-v278.css' src/Studio.jsx
          grep -q 'studio-theme-layout-v264.js' src/Studio.jsx
          grep -q 'studio-sidebar-single-toggle-v267.js' src/Studio.jsx
          if grep -q 'document.addEventListener("click", activateLogo' src/studio-sidebar-recovery-v276.js; then
            echo 'Legacy v276 document capture sidebar handler is still active.' >&2
            exit 1
          fi
          grep -q 'window.addEventListener("pointerdown", stopLegacyPointer, true)' src/studio-shell-precision-v278.js
          grep -q 'window.addEventListener("click", activateLogo, true)' src/studio-shell-precision-v278.js
          grep -q 'data-device-mode="large"' src/studio-shell-precision-v278.css
          grep -q 'data-device-mode="small"' src/studio-shell-precision-v278.css
          grep -q 'grid-template-areas:"preview" "code"' src/studio-shell-precision-v278.css
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q 'UI_PATCH_RELEASE_V272' public/sw.js
          grep -q 'studio-shell-cache-v272' public/sw.js
          grep -q 'UI_PATCH_RELEASE_V274' public/sw.js
          grep -q 'studio-shell-content-cache-v274' public/sw.js
          grep -q 'STUDIO_FINAL_STABILITY_RELEASE_V275' public/sw.js
          grep -q 'studio-final-stability-cache-v275' public/sw.js
          grep -q 'STUDIO_SIDEBAR_RECOVERY_RELEASE_V276' public/sw.js
          grep -q 'studio-sidebar-recovery-cache-v276' public/sw.js
          grep -q 'STUDIO_INTERACTION_AUTHORITY_RELEASE_V277' public/sw.js
          grep -q 'studio-interaction-authority-cache-v277' public/sw.js
          grep -q 'STUDIO_SHELL_PRECISION_RELEASE_V278' public/sw.js
          grep -q 'studio-shell-precision-cache-v278' public/sw.js

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify live v278 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v278.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-shell-precision-v278-20260804'; then
              echo "Live v278 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v278.json after deployment." >&2
          exit 1

      - name: Verify live service worker contains v278 cache chain
        shell: bash
        run: |
          set -euo pipefail
          sw="$(curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}")"
          printf '%s' "$sw" | grep -q 'UI_PATCH_RELEASE_V272'
          printf '%s' "$sw" | grep -q 'studio-shell-cache-v272'
          printf '%s' "$sw" | grep -q 'UI_PATCH_RELEASE_V274'
          printf '%s' "$sw" | grep -q 'studio-shell-content-cache-v274'
          printf '%s' "$sw" | grep -q 'STUDIO_FINAL_STABILITY_RELEASE_V275'
          printf '%s' "$sw" | grep -q 'studio-final-stability-cache-v275'
          printf '%s' "$sw" | grep -q 'STUDIO_SIDEBAR_RECOVERY_RELEASE_V276'
          printf '%s' "$sw" | grep -q 'studio-sidebar-recovery-cache-v276'
          printf '%s' "$sw" | grep -q 'STUDIO_INTERACTION_AUTHORITY_RELEASE_V277'
          printf '%s' "$sw" | grep -q 'studio-interaction-authority-cache-v277'
          printf '%s' "$sw" | grep -q 'STUDIO_SHELL_PRECISION_RELEASE_V278'
          printf '%s' "$sw" | grep -q 'studio-shell-precision-cache-v278'

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v278-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
