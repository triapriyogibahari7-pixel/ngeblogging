name: Deploy Ngeblogging Production v344

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v344
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run production regression and build
        run: npm run build

      - name: Verify v344 and inherited production authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 310 311 312 313 315 321 322 323 324 325 337 338 339 340 341 342 343 344; do
            test -f "public/release-v${release}.json"
          done

          # v344 is intentionally narrow: shorter source panel + clearer real gutter.
          test -f src/studio-theme-code-editor-v344.css
          test -f src/studio-theme-code-editor-v344.js
          test -f scripts/patch-studio-theme-code-editor-v344.mjs
          test -f tests/studio-theme-code-editor-v344.test.mjs
          node --test tests/studio-theme-code-editor-v344.test.mjs tests/studio-theme-code-editor-v343.test.mjs tests/studio-theme-code-editor-v342.test.mjs tests/studio-theme-surface-final-v341.test.mjs tests/studio-theme-final-v340.test.mjs tests/studio-theme-domain-final-v325.test.mjs
          grep -q 'studio-theme-code-editor-v344-20260807' public/release-v344.json
          grep -q '"inheritsV343StackedComposition": true' public/release-v344.json
          grep -q '"shorterCodeWorkspace": true' public/release-v344.json
          grep -q '"desktopCodeHeightMaxPx": 500' public/release-v344.json
          grep -q '"handheldCodeHeightMaxPx": 420' public/release-v344.json
          grep -q '"realLineNumbers": 10000' public/release-v344.json
          grep -q '"lineNumberGutterStrengthened": true' public/release-v344.json
          grep -q '"themesPreserved": 100' public/release-v344.json
          grep -q '"layoutAreasPreserved": 26' public/release-v344.json
          grep -q '"widgetsPreserved": 26' public/release-v344.json
          grep -q '"previewModesPreserved": 8' public/release-v344.json
          grep -q 'import "./studio-theme-code-editor-v344.js"' src/studio-theme-surface-final-v341.js
          grep -q 'grid-template-areas:"preview" "code"!important' src/studio-theme-code-editor-v344.css
          grep -q 'height:clamp(400px,45dvh,500px)!important' src/studio-theme-code-editor-v344.css
          grep -q 'height:clamp(340px,41dvh,420px)!important' src/studio-theme-code-editor-v344.css
          grep -q '.tn-code-gutter-v342' src/studio-theme-code-editor-v344.css
          grep -q 'width:60px!important' src/studio-theme-code-editor-v344.css
          grep -q 'color:#aebcd0!important' src/studio-theme-code-editor-v344.css
          if grep -Eq '#ngeblogging-studio-sidebar|\.sn-side|\.sn-logo-mark|\.nara-assistant|\.nara-floating-button|\.sv124-domain-page|\.ce-app' src/studio-theme-code-editor-v344.css; then
            echo 'v344 attempted to restyle protected sidebar, Nara, Domain, or Posts/Pages surfaces.' >&2
            exit 1
          fi

          # v343 keeps the preview-above-code reference composition.
          grep -q 'studio-theme-code-editor-v343-20260807' public/release-v343.json
          grep -q '"previewAboveCodeAllStudioModes": true' public/release-v343.json
          grep -q '"desktopSiteOnHandheldUsesStackedEditor": true' public/release-v343.json
          grep -q '"darkReadableCodeSurface": true' public/release-v343.json
          grep -q 'import "./studio-theme-code-editor-v343.js"' src/studio-theme-surface-final-v341.js

          # v342 remains the functional editor authority that creates and syncs 1-10000.
          grep -q 'studio-theme-code-editor-v342-20260807' public/release-v342.json
          grep -q '"realLineNumbers": 10000' public/release-v342.json
          grep -q 'THEME_CODE_EDITOR_LINE_GUIDE_V342 = 10000' src/studio-theme-code-editor-v342.js
          grep -q 'gutter.scrollTop = textarea.scrollTop' src/studio-theme-code-editor-v342.js
          grep -q '.tn-code-gutter-v342' src/studio-theme-code-editor-v342.css
          if grep -Eq '#ngeblogging-studio-sidebar|\.sn-side|\.sn-logo-mark|\.nara-assistant|\.nara-floating-button|\.sv124-domain-page|\.ce-app' src/studio-theme-code-editor-v342.css; then
            echo 'v342 attempted to restyle protected sidebar, Nara, Domain, or Posts/Pages surfaces.' >&2
            exit 1
          fi

          # v341 keeps the Theme surface and canonical 26-area layout map.
          grep -q 'studio-theme-surface-final-v341-20260807' public/release-v341.json
          grep -q '"mobilePreviewBounded": true' public/release-v341.json
          grep -q '"canonicalLayoutMapVisible": true' public/release-v341.json
          grep -q '"legacyFourAreaCanvasHidden": true' public/release-v341.json
          grep -q '"centerPostPreservedOnSmall": true' public/release-v341.json
          grep -q '"secondaryLayoutBelow": true' public/release-v341.json
          grep -q '"themes": 100' public/release-v341.json
          grep -q '"layoutAreas": 26' public/release-v341.json
          grep -q '"widgets": 26' public/release-v341.json
          grep -q '"previewModes": 8' public/release-v341.json
          grep -q 'import "./studio-theme-surface-final-v341.js"' src/studio-sidebar-direct-v300.js

          # v340/v325 and Posts/Pages remain inherited.
          grep -q 'studio-theme-final-v340-20260807' public/release-v340.json
          grep -q 'studio-theme-domain-final-v325-20260806' public/release-v325.json
          grep -q '"themesPreserved": 100' public/release-v325.json
          grep -q '"layoutModelsPreserved": 2' public/release-v325.json
          grep -q '"previewModesPreserved": 8' public/release-v325.json
          grep -q '"codeLineGuidePreserved": 10000' public/release-v325.json
          grep -q 'posts-pages-30000-v322-20260806' public/release-v322.json
          grep -q '"draftsAreNeverTrimmedByWordGuard": true' public/release-v322.json
          grep -q 'publishButton.disabled = over' src/studio-content-editor-final-v316.js
          grep -q 'publishedOption.disabled = over' src/studio-content-editor-final-v316.js

          # First-site onboarding, members, domain, authentication, sidebar and Nara remain protected.
          grep -q 'first-site-onboarding-stability-v311-20260806' public/release-v311.json
          grep -q 'animation:none!important' src/studio-first-site-stability-v311.css
          grep -q '"memberRoleChoices": 5' public/release-v312.json
          grep -q 'invite_site_member_v176' src/studio-members-v304.js
          grep -q 'remove_site_member_v176' src/studio-members-v304.js
          grep -q 'studio-theme-domain-v321-20260806' public/release-v321.json
          grep -q '"publicDnsVerificationRequired": true' public/release-v321.json
          grep -q '"nxdomainNeverReportedActive": true' public/release-v321.json
          grep -q 'PUBLIC_DNS_NOT_READY' server/cloudflare-full-zone-provider.mjs
          grep -q '"persistSessionPreserved": true' public/release-v315.json
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q '"smallNonModal": true' public/release-v313.json
          grep -q '"mediumNonModal": true' public/release-v313.json
          grep -q 'STUDIO_SIDEBAR_HARD_LOCK_RELEASE_V301' public/sw.js

          # Generated service worker must identify v344 and retain inherited authorities.
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V344' public/sw.js
          grep -q 'studio-theme-code-editor-cache-v344' public/sw.js
          grep -q 'ngeblogging-app-v344-theme-code-editor-20260807' public/sw.js
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V343' public/sw.js
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V342' public/sw.js
          grep -q 'STUDIO_THEME_SURFACE_FINAL_RELEASE_V341' public/sw.js
          grep -q 'STUDIO_THEME_FINAL_RELEASE_V340' public/sw.js
          grep -q 'STUDIO_THEME_DOMAIN_FINAL_RELEASE_V325' public/sw.js
          grep -q 'POSTS_PAGES_30000_RELEASE_V322' public/sw.js
          grep -q 'STUDIO_THEME_DOMAIN_RELEASE_V321' public/sw.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' public/sw.js

          # Validate generated browser bundle and production pointers.
          grep -R -q 'studio-theme-code-editor-v344-20260807' dist/assets
          grep -R -q 'studio-theme-code-editor-v343-20260807' dist/assets
          grep -R -q 'studio-theme-code-editor-v342-20260807' dist/assets
          grep -R -q 'studio-theme-surface-final-v341-20260807' dist/assets
          grep -R -q 'studio-theme-final-v340-20260807' dist/assets
          grep -R -q 'studio-theme-domain-v321-20260806' dist/assets
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-theme-code-editor-v344-20260807"' wrangler.production.jsonc
          grep -q '"STUDIO_THEME_CODE_EDITOR_RELEASE": "studio-theme-code-editor-v344-20260807"' wrangler.production.jsonc
          grep -q '"STUDIO_THEME_CODE_EDITOR_PREVIOUS_RELEASE": "studio-theme-code-editor-v343-20260807"' wrangler.production.jsonc
          grep -q '"STUDIO_THEME_CODE_EDITOR_BASE_RELEASE": "studio-theme-code-editor-v342-20260807"' wrangler.production.jsonc
          grep -q '"STUDIO_THEME_SURFACE_FINAL_RELEASE": "studio-theme-surface-final-v341-20260807"' wrangler.production.jsonc
          grep -q '"CUSTOM_DOMAIN_PROVIDER": "cloudflare-full-zone"' wrangler.production.jsonc

      - name: Verify Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'CLOUDFLARE_ACCOUNT_ID wajib tersedia.' >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'CLOUDFLARE_API_TOKEN wajib tersedia.' >&2
            exit 1
          fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative Ngeblogging routes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; melewati route reassertion.'
          fi

      - name: Verify live v344 and inherited authorities
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            latest="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v344.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            previous="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v343.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            domain="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v321.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$latest" | grep -q 'studio-theme-code-editor-v344-20260807' && printf '%s' "$previous" | grep -q 'studio-theme-code-editor-v343-20260807' && printf '%s' "$domain" | grep -q 'studio-theme-domain-v321-20260806'; then
              echo 'Live v344 shorter Theme code editor with inherited v343/v342 engine and v321 DNS truthfulness confirmed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Live production did not expose v344/v343/v321 within the verification window.' >&2
          exit 1

      - name: Verify live v344 service worker and visual bundle
        shell: bash
        run: |
          set -euo pipefail
          latest_chunk="$(grep -Rl 'studio-theme-code-editor-v344-20260807' dist/assets | head -n 1)"
          test -n "$latest_chunk"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${latest_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-v344.js
          grep -q 'studio-theme-code-editor-v344-20260807' /tmp/studio-v344.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v344.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V344' /tmp/sw-v344.js
          grep -q 'studio-theme-code-editor-cache-v344' /tmp/sw-v344.js
          grep -q 'ngeblogging-app-v344-theme-code-editor-20260807' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V343' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_CODE_EDITOR_RELEASE_V342' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_SURFACE_FINAL_RELEASE_V341' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_FINAL_RELEASE_V340' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_DOMAIN_FINAL_RELEASE_V325' /tmp/sw-v344.js
          grep -q 'POSTS_PAGES_30000_RELEASE_V322' /tmp/sw-v344.js
          grep -q 'STUDIO_THEME_DOMAIN_RELEASE_V321' /tmp/sw-v344.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v344-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
