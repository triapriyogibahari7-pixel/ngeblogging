name: Ngeblogging production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DOMAIN_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      TARGET_DOMAIN: triapriyogi.com
      WORKER_SERVICE: ngeblogging

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          test -n "${CLOUDFLARE_DOMAIN_API_TOKEN}" || { echo "CLOUDFLARE_DOMAIN_API_TOKEN_MISSING"; exit 1; }

      - name: Build production application
        run: npm run build

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify production shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/ngeblogging.html -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com/?deploy_verify=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "${code}" == "200" ]] && grep -q 'id="root"' /tmp/ngeblogging.html; then
              echo "PRODUCTION_SHELL_VERIFIED"
              exit 0
            fi
            sleep 5
          done
          echo "PRODUCTION_SHELL_VERIFY_FAILED"
          exit 1

      - name: Repair and verify active custom domain
        run: node scripts/repair-custom-domain-v350.mjs

      - name: Verify free and custom public roots
        shell: bash
        run: |
          set -euo pipefail
          for host in "tri-apriyogi-bahari.ngeblogging.com" "triapriyogi.com" "www.triapriyogi.com"; do
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/public-${host}.html -w '%{http_code}' -H 'cache-control: no-cache' "https://${host}/?public_verify=${GITHUB_SHA}" || true)"
            if [[ "${code}" != "200" ]] || ! grep -q 'id="root"' "/tmp/public-${host}.html"; then
              echo "PUBLIC_ROOT_VERIFY_FAILED ${host} HTTP=${code}"
              exit 1
            fi
          done
          echo "FREE_AND_CUSTOM_PUBLIC_ROOTS_VERIFIED"

      - name: Verify a published post on free and custom domains
        shell: bash
        run: |
          set -euo pipefail
          site_json="$(curl -sS --connect-timeout 10 --max-time 25 -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" -H "authorization: Bearer ${VITE_SUPABASE_PUBLISHABLE_KEY}" "https://polvmlrhqoiflumibfqs.supabase.co/rest/v1/sites?slug=eq.tri-apriyogi-bahari&status=eq.active&is_public=eq.true&select=id&limit=1")"
          site_id="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x[0]?.id || "")' "$site_json")"
          test -n "$site_id" || { echo "PUBLIC_SITE_NOT_FOUND"; exit 1; }
          posts_json="$(curl -sS --connect-timeout 10 --max-time 25 -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" -H "authorization: Bearer ${VITE_SUPABASE_PUBLISHABLE_KEY}" "https://polvmlrhqoiflumibfqs.supabase.co/rest/v1/contents?site_id=eq.${site_id}&kind=eq.article&status=eq.published&visibility=eq.public&select=slug&order=published_at.desc&limit=1")"
          post_slug="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x[0]?.slug || "")' "$posts_json")"
          if [[ -z "$post_slug" ]]; then echo "NO_PUBLISHED_POST_TO_VERIFY"; exit 0; fi
          encoded_slug="$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$post_slug")"
          for host in "tri-apriyogi-bahari.ngeblogging.com" "triapriyogi.com"; do
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "/tmp/post-${host}.html" -w '%{http_code}' -H 'cache-control: no-cache' "https://${host}/${encoded_slug}?public_post_verify=${GITHUB_SHA}" || true)"
            if [[ "$code" != "200" ]] || ! grep -q 'id="root"' "/tmp/post-${host}.html"; then
              echo "PUBLIC_POST_VERIFY_FAILED ${host} HTTP=${code} slug=${post_slug}"
              exit 1
            fi
          done
          echo "FREE_AND_CUSTOM_PUBLISHED_POST_VERIFIED ${post_slug}"
