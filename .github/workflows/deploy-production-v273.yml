name: Deploy Ngeblogging Production v298

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v298
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run v289-v298 regression and production build
        run: |
          node --test \
            tests/studio-final-pass-v289.test.mjs \
            tests/studio-native-controls-v290.test.mjs \
            tests/studio-auth-sidebar-v291.test.mjs \
            tests/studio-startup-v292.test.mjs \
            tests/studio-production-recovery-v295.test.mjs \
            tests/studio-theme-catalog-v296.test.mjs \
            tests/studio-mode-startup-v297.test.mjs \
            tests/studio-shell-authority-v298.test.mjs
          npm run build

      - name: Verify v298 production markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 291 292 293 294 295 296 297 298; do test -f "public/release-v${release}.json"; done

          grep -q 'studio-startup-direct-data-v292-20260805' public/release-v292.json
          grep -q 'auth-session-handoff-v292-20260805' public/release-v292.json
          grep -q 'studio-theme-catalog-100-v296-20260805' public/release-v296.json
          grep -q 'studio-mode-startup-authority-v297-20260805' public/release-v297.json
          grep -q 'studio-shell-authority-v298-20260805' public/release-v298.json
          grep -q '"themeCatalogCount": 100' public/release-v298.json

          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -Fq 'appUrl("/?auth=callback")' src/lib/supabase.js
          grep -q 'studio-native-capture-retired-v298-20260805' src/studio-native-controls-v290.js
          grep -q 'studio-shell-authority-v298.js' src/studio-native-controls-v290.js
          if grep -Eq 'function nativeToggle[[:space:]]*\(|document\.addEventListener\("click",[[:space:]]*nativeToggle|pointerdown|immediateNativeToggle|toggle\.disabled[[:space:]]*=[[:space:]]*true|muteTimer' src/studio-native-controls-v290.js; then
            echo 'Old n-toggle capture regression detected.' >&2
            exit 1
          fi

          grep -q 'studio-shell-authority-v298-20260805' src/studio-shell-authority-v298.js
          grep -q 'studio-single-n-owner-v298-20260805' src/studio-shell-authority-v298.js
          grep -q 'function toggleN(event)' src/studio-shell-authority-v298.js
          grep -q 'sn-profile-menu-v298' src/studio-shell-authority-v298.js
          grep -q -- '--v298-side-open:220px' src/studio-shell-authority-v298.css
          grep -q -- '--v298-side-rail:70px' src/studio-shell-authority-v298.css
          grep -Fq '.sn-shell[data-device-mode="small"]' src/studio-shell-authority-v298.css
          grep -Fq 'width:min(78vw,336px)!important' src/studio-shell-authority-v298.css
          grep -Fq 'grid-template-areas:"code" "preview"' src/studio-shell-authority-v298.css
          grep -Fq 'grid-template-areas:"code preview"' src/studio-shell-authority-v298.css
          grep -q 'CONTENT_WORD_LIMIT = 5_000' src/studio-final-authority-v293.js
          grep -q 'CODE_LINE_LIMIT = 10_000' src/studio-final-authority-v293.js
          grep -q 'STUDIO_THEME_TARGET_V296 = 100' src/studio-theme-catalog-v296.js

          if grep -Eq 'new MutationObserver|setInterval[[:space:]]*\(|stopImmediatePropagation' src/studio-shell-authority-v298.js src/studio-native-controls-v290.js; then
            echo 'v298 DOM churn/blocking regression detected.' >&2
            exit 1
          fi
          if grep -Eq 'localStorage\.clear[[:space:]]*\(|sessionStorage\.clear[[:space:]]*\(|location\.(reload|replace)[[:space:]]*\(' src/studio-shell-authority-v298.js src/studio-native-controls-v290.js; then
            echo 'v298 destructive session/navigation regression detected.' >&2
            exit 1
          fi

          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-shell-authority-v298-20260805"' wrangler.production.jsonc
          grep -q '"AUTH_STUDIO_HANDOFF_RELEASE": "auth-session-handoff-v292-20260805"' wrangler.production.jsonc
          grep -q 'STUDIO_SHELL_AUTHORITY_RELEASE_V298' public/sw.js
          grep -q 'studio-shell-cache-v298' public/sw.js
          grep -q 'ngeblogging-app-v298-shell-authority-20260805' public/sw.js
          grep -R -q 'studio-startup-direct-data-v292-20260805' dist/assets
          grep -R -q 'studio-theme-catalog-100-v296-20260805' dist/assets
          grep -R -q 'studio-shell-authority-v298-20260805' dist/assets

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler deployment tetap dijalankan dan live gate wajib membuktikan apex.'
          fi

      - name: Verify live v298 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v298.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-shell-authority-v298-20260805'; then echo "Live v298 release manifest confirmed."; exit 0; fi
            sleep 10
          done
          echo "Live production did not expose release-v298.json after deployment." >&2
          exit 1

      - name: Verify live Studio startup and v298 UI bundle
        shell: bash
        run: |
          set -euo pipefail
          startup_chunk="$(grep -Rl 'studio-startup-direct-data-v292-20260805' dist/assets | head -n 1)"
          ui_chunk="$(grep -Rl 'studio-shell-authority-v298-20260805' dist/assets | head -n 1)"
          test -n "$startup_chunk"
          test -n "$ui_chunk"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${startup_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-startup-v292.js
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/${ui_chunk#dist/}?commit=${GITHUB_SHA}" -o /tmp/studio-ui-v298.js
          grep -q 'studio-startup-direct-data-v292-20260805' /tmp/studio-startup-v292.js
          grep -q 'studio-shell-authority-v298-20260805' /tmp/studio-ui-v298.js

      - name: Verify live auth callback shell and service worker v298
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com/?auth=callback&commit=${GITHUB_SHA}" -o /tmp/auth-callback-v298.html
          grep -q 'id="root"' /tmp/auth-callback-v298.html
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v298.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_STARTUP_DIRECT_DATA_RELEASE_V292' /tmp/sw-v298.js
          grep -q 'AUTH_SESSION_HANDOFF_RELEASE_V292' /tmp/sw-v298.js
          grep -q 'STUDIO_SHELL_AUTHORITY_RELEASE_V298' /tmp/sw-v298.js
          grep -q 'studio-shell-cache-v298' /tmp/sw-v298.js
          grep -q 'ngeblogging-app-v298-shell-authority-20260805' /tmp/sw-v298.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v298-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
