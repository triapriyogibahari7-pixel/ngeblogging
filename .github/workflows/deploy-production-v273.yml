name: Deploy Ngeblogging Production v288

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-production-v288
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run v288 regression, service-worker rotation and production build
        run: npm run build

      - name: Verify production source and built markers before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          for release in 273 274 275 276 277 278 279 280 281 282 283 284 285 286 287 288; do test -f "public/release-v${release}.json"; done
          grep -q 'studio-screenshot-polish-v288-20260805' public/release-v288.json
          grep -q 'studio-screenshot-polish-v288.js' src/studio-live-visual-v286.js
          grep -q 'studio-screenshot-polish-v288.css' src/studio-screenshot-polish-v288.js
          grep -q 'closeSmallDrawerAfterOutsideClick' src/studio-screenshot-polish-v288.js
          grep -q '+ Tambahkan situs' src/studio-screenshot-polish-v288.js
          grep -q '.nara-attachment-menu{display:grid!important' src/studio-screenshot-polish-v288.css
          grep -q '.tn-layout-map-v264{display:grid!important;width:min(100%,760px)!important' src/studio-screenshot-polish-v288.css
          grep -q 'grid-template-areas:"preview" "code"' src/studio-screenshot-polish-v288.css
          grep -q 'grid-template-areas:"code preview"' src/studio-screenshot-polish-v288.css
          grep -q 'sn-profile-menu-v287' src/studio-react-shell-v287.js
          grep -q 'Ganti avatar' src/studio-react-shell-v287.js
          grep -q 'persistSession: true' src/lib/supabase.js
          grep -q 'autoRefreshToken: true' src/lib/supabase.js
          grep -q '"CURRENT_STUDIO_UI_RELEASE": "studio-screenshot-polish-v288-20260805"' wrangler.production.jsonc
          grep -q 'STUDIO_SCREENSHOT_POLISH_RELEASE_V288' public/sw.js
          grep -q 'studio-screenshot-polish-cache-v288' public/sw.js
          grep -q 'ngeblogging-app-v288-screenshot-polish-20260805' public/sw.js
          grep -R -q 'studio-screenshot-polish-v288-20260805' dist/assets
          if grep -q '^import "./studio-production-v208.js";' src/Studio.jsx; then
            echo 'v208 legacy hard-reload runtime must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./nara-size-authority-v144.js";' src/Studio.jsx; then
            echo 'legacy Nara observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q '^import "./studio-interface-v148.js";' src/Studio.jsx; then
            echo 'legacy interface observer must not be active in production.' >&2
            exit 1
          fi
          if grep -q 'new MutationObserver' src/nara-controls-v135.js; then
            echo 'legacy Nara fullscreen observer must remain retired.' >&2
            exit 1
          fi

      - name: Deploy Worker and static assets to Cloudflare production
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars

      - name: Reassert authoritative apex www and tenant routes when zone credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            node scripts/finalize-cloudflare-route-cutover-v182.mjs
          else
            echo 'CLOUDFLARE_ZONE_ID tidak tersedia; Wrangler custom-domain deployment tetap dijalankan dan live gate berikutnya wajib membuktikan apex.'
          fi

      - name: Verify live v288 release manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "https://ngeblogging.com/release-v288.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "$body" | grep -q 'studio-screenshot-polish-v288-20260805'; then
              echo "Live v288 release manifest confirmed."
              exit 0
            fi
            sleep 10
          done
          echo "Live production did not expose release-v288.json after deployment." >&2
          exit 1

      - name: Verify live Studio v288 chunk
        shell: bash
        run: |
          set -euo pipefail
          chunk_path="$(grep -Rl 'studio-screenshot-polish-v288-20260805' dist/assets | head -n 1)"
          test -n "$chunk_path"
          live_path="/${chunk_path#dist/}"
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://ngeblogging.com${live_path}?commit=${GITHUB_SHA}" -o /tmp/studio-v288.js
          grep -q 'studio-screenshot-polish-v288-20260805' /tmp/studio-v288.js

      - name: Verify live service worker and v288 cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --connect-timeout 10 --max-time 30 -o /tmp/sw-v288.js -H 'Cache-Control: no-cache' "https://ngeblogging.com/sw.js?commit=${GITHUB_SHA}"
          grep -q 'STUDIO_SCREENSHOT_POLISH_RELEASE_V288' /tmp/sw-v288.js
          grep -q 'studio-screenshot-polish-cache-v288' /tmp/sw-v288.js
          grep -q 'ngeblogging-app-v288-screenshot-polish-20260805' /tmp/sw-v288.js

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' https://ngeblogging.com/api/health > /tmp/ngeblogging-health.json
          test -s /tmp/ngeblogging-health.json

      - name: Archive validated dist
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-production-v288-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
