name: Document saves v456 stage 8b
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/lib/document-save-v456.mjs', 'src/useDocumentSaveV456.jsx', 'src/DocumentSaveToolsV456.jsx', 'scripts/document-save-v456.mjs', 'tests/document-save-v456.test.mjs', 'tests/document-save-transform-v456.test.mjs', 'vite.config.js', '.github/workflows/document-save-v456.yml']
permissions:
  contents: read
jobs:
  save-queue-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/document-save-v456.test.mjs tests/document-save-transform-v456.test.mjs tests/document-files-v455.test.mjs tests/document-layout-v454.test.mjs tests/content-limit-v449.test.mjs
      - run: npx vite build
