name: Probe Actions v157

on:
  pull_request:
    branches: [main]
    paths:
      - ".probe-actions-v157"

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'deploy/actions-probe-v157'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner startup
        run: echo "ACTIONS_V157_RUNNER_OK"
