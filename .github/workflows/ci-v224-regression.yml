name: Ngeblogging v225 regression build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply full production patch chain
        run: node scripts/patch-service-worker-v179.mjs

      - name: Verify v223 v224 and v225 contracts
        run: node --test tests/studio-production-v223.test.mjs tests/data-reauth-v224.test.mjs tests/studio-production-v225.test.mjs

      - name: Run complete production regression suite
        run: npm run test:production

      - name: Build production bundle
        run: npm run build
