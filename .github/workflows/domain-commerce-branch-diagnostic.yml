name: Domain commerce branch diagnostic
on:
  push:
    branches: [fix/domain-commerce-midtrans-20261102]
    paths: [.github/workflows/domain-commerce-branch-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect domain bindings without exposing secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!token)throw Error('GITHUB_CLOUDFLARE_CREDENTIALS_MISSING');
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/ngeblogging/settings`,{headers:{Authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error(`WORKER_SETTINGS_HTTP_${response.status}`);
          const data=await response.json();
          if(data.success!==true||!Array.isArray(data.result?.bindings))throw Error('WORKER_SETTINGS_INVALID_RESPONSE');
          const safeValue=/^DOMAIN_[A-Z0-9_]+_ENABLED$|^DOMAIN_CUSTOMER_SEARCH_HTTP_BUDGET$|^DOMAIN_CUSTOMER_REGISTRAR_PROVIDER$|^MIDTRANS_ENV$/;
          const bindings=data.result.bindings.filter(b=>/DOMAIN|REGISTRAR|MIDTRANS|OPENSRS/.test(b.name)).map(b=>({name:b.name,type:b.type,...(b.type==='plain_text'&&safeValue.test(b.name)?{value:b.text}:{})}));
          const report={commit:process.env.GITHUB_SHA,configurationRead:true,productionChanged:false,secretValuesIncluded:false,bindings};
          await writeFile('domain-configuration-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await writeFile(process.env.GITHUB_STEP_SUMMARY,'## Domain configuration diagnostic\n\nRead-only configuration inspection completed. No deployment, DNS changes, payment, or registration was performed. See the sanitized artifact.\n',{flag:'a'});
          NODE
      - name: Preserve sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: domain-configuration-${{ github.sha }}
          path: domain-configuration-report.json
          if-no-files-found: error
          retention-days: 3
