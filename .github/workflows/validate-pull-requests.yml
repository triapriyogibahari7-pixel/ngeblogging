name: Validate Pull Requests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://polvmlrhqoiflumibfqs.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      QWEN_API_KEY: ci-dry-run-only
      QWEN_WORKSPACE_ID: pull-request-validation
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run protected production regressions
        run: npm run test:production

      - name: Build React production assets
        run: npx vite build

      - name: Validate Worker bundle
        run: npm run cloudflare:dry-run
