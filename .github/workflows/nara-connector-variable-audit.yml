name: Nara connector variable audit (read only)
on:
  push:
    branches: [agent/nara-connector-variable-audit-20261108]
    paths:
      - .github/workflows/nara-connector-variable-audit.yml
      - scripts/nara-connector-variable-audit.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nara-connector-variable-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate retirement guard logic
        run: node --test tests/worker-variable-retirement-policy.test.mjs
      - name: Read inventory and report names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/nara-connector-variable-audit.mjs
      - name: Upload sanitized audit
        uses: actions/upload-artifact@v4
        with:
          name: nara-worker-variable-audit-${{ github.sha }}
          path: nara-worker-variable-audit.json
          retention-days: 3
          if-no-files-found: error
