name: V177 PR Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-v177:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify v177
        run: npm run verify:v177
