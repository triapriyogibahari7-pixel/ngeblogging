name: Ngeblogging v225 compatibility check (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngeblogging-v225-compat-manual
  cancel-in-progress: true

jobs:
  verify-v225-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Apply current production authority chain
        run: node scripts/patch-service-worker-v179.mjs

      - name: Verify v224 v225 and later compatibility markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'patch-data-reauth-v224.mjs' scripts/patch-service-worker-v179.mjs
          grep -q 'patch-production-v225.mjs' scripts/patch-service-worker-v179.mjs
          test -f public/release-v224.json
          test -f public/release-v225.json
          test -f public/release-v226.json
          test -f public/release-v227.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("public/release-v224.json","utf8"));const u=JSON.parse(fs.readFileSync("public/release-v225.json","utf8"));const g=JSON.parse(fs.readFileSync("public/release-v226.json","utf8"));const n=JSON.parse(fs.readFileSync("public/release-v227.json","utf8"));if(a.release!=="data-reauth-v224-20260803"||u.release!=="studio-production-v225-20260803"||g.release!=="studio-production-v226-native-green-layout-20260803"||n.release!=="nara-fallback-model-contract-v227-20260803")process.exit(1)'

      - name: Run production regression without deployment
        run: npm run test:production

# Historical v225 deployment logic is intentionally disabled here.
# cloudflare-production-v227.yml is the only automatic production deploy/cutover authority.
