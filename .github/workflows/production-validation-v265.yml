name: Production Validation v267

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-validation-v267-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build Ngeblogging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production regression tests and build
        run: npm run build

      - name: Assert v267 source and cache markers
        run: |
          test -f src/studio-screenshot-authority-v265.js
          test -f src/studio-theme-layout-v264.js
          test -f src/studio-shell-v265-final-hotfix.css
          test -f src/studio-editor-navigation-v266.js
          test -f src/studio-sidebar-single-toggle-v267.js
          test -f tests/studio-fixed-chrome-v267.test.mjs
          test -f public/release-v267.json
          test -f scripts/patch-service-worker-v267.mjs
          grep -q 'studio-sidebar-single-toggle-v267.js' src/Studio.jsx
          grep -q 'patch-service-worker-v267.mjs' scripts/patch-service-worker-v265.mjs
          grep -q 'studio-fixed-chrome-cache-v267' public/sw.js
          grep -q 'UI_PATCH_RELEASE_V267' public/sw.js
