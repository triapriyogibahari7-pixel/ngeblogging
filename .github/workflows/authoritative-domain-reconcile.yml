name: Ngeblogging authoritative domain reconcile

on:
  workflow_run:
    workflows: ["Cloudflare Workers production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-authoritative-domain
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://ngeblogging.com' }}
    steps:
      - name: Mark authoritative reconciliation pending
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'pending',
              context: 'Ngeblogging authoritative domain',
              description: 'Auditing DNS authority, Worker domains, routes, and the live release.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Audit DNS authority and reconcile Worker domains
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID belum diisi"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN belum diisi"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveNs } from 'node:dns/promises';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const base = 'https://api.cloudflare.com/client/v4';
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };

          async function cf(path, options = {}) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: { ...headers, ...(options.body ? { 'content-type': 'application/json' } : {}), ...(options.headers || {}) },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success !== true) {
              const messages = [...(payload.errors || []), ...(payload.messages || [])].map((item) => item?.message).filter(Boolean).join('; ');
              throw new Error(`Cloudflare ${options.method || 'GET'} ${path} gagal (${response.status}): ${messages || 'respons tidak valid'}`);
            }
            return payload.result;
          }

          const zones = await cf('/zones?name=ngeblogging.com&status=active&per_page=10');
          const matches = (zones || []).filter((zone) => zone?.name === 'ngeblogging.com' && zone?.status === 'active');
          if (matches.length !== 1) throw new Error(`Ditemukan ${matches.length} zone aktif ngeblogging.com pada akun deployment; wajib tepat satu.`);
          const zone = matches[0];
          const assignedNs = [...(zone.name_servers || [])].map((value) => String(value).toLowerCase().replace(/\.$/, '')).sort();
          const publicNs = [...await resolveNs('ngeblogging.com')].map((value) => String(value).toLowerCase().replace(/\.$/, '')).sort();
          const authorityMatches = assignedNs.length > 0 && assignedNs.join('|') === publicNs.join('|');

          const routeResult = await cf(`/zones/${zone.id}/workers/routes`);
          const routes = new Map((routeResult || []).map((route) => [route.pattern, route.script || null]));
          const requiredRoutes = ['ngeblogging.com/*', 'www.ngeblogging.com/*', '*.ngeblogging.com/*'];
          const routeOwnership = Object.fromEntries(requiredRoutes.map((pattern) => [pattern, routes.get(pattern) || null]));
          const badRoutes = requiredRoutes.filter((pattern) => routeOwnership[pattern] !== 'ngeblogging');

          const domainAudit = [];
          for (const hostname of ['ngeblogging.com', 'www.ngeblogging.com']) {
            const existing = await cf(`/accounts/${accountId}/workers/domains?hostname=${encodeURIComponent(hostname)}`);
            const exact = (existing || []).filter((item) => item?.hostname === hostname);
            const before = exact.map((item) => ({ hostname: item.hostname, service: item.service, zone_id: item.zone_id, zone_name: item.zone_name }));
            let repaired = false;
            if (exact.length && exact.some((item) => item.service !== 'ngeblogging' || item.zone_id !== zone.id)) {
              await cf(`/accounts/${accountId}/workers/domains`, {
                method: 'PUT',
                body: JSON.stringify({ hostname, service: 'ngeblogging', zone_id: zone.id, zone_name: 'ngeblogging.com' }),
              });
              repaired = true;
            }
            const afterResult = await cf(`/accounts/${accountId}/workers/domains?hostname=${encodeURIComponent(hostname)}`);
            const after = (afterResult || []).filter((item) => item?.hostname === hostname).map((item) => ({ hostname: item.hostname, service: item.service, zone_id: item.zone_id, zone_name: item.zone_name }));
            domainAudit.push({ hostname, before, after, repaired });
          }

          const audit = {
            checkedAt: new Date().toISOString(),
            zone: { id: zone.id, name: zone.name, status: zone.status, assignedNameServers: assignedNs },
            publicNameServers: publicNs,
            authorityMatches,
            routeOwnership,
            badRoutes,
            workerDomains: domainAudit,
          };
          fs.writeFileSync('/tmp/ngeblogging-authority-audit.json', `${JSON.stringify(audit, null, 2)}\n`);
          console.log(JSON.stringify(audit, null, 2));

          if (!authorityMatches) throw new Error(`Nameserver publik tidak menunjuk ke zone yang dikelola token deployment. Publik=${publicNs.join(', ')}; akun=${assignedNs.join(', ')}`);
          if (badRoutes.length) throw new Error(`Route resmi bukan milik Worker ngeblogging: ${badRoutes.join(', ')}`);
          NODE

      - name: Verify authoritative live v43 release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp="v44-${attempt}-$(date +%s)"
            health_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/authority-health.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-cache' "${PUBLIC_SITE_URL%/}/api/health?authority=${stamp}" || true)"
            sw_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/authority-sw.js -w '%{http_code}' -H 'cache-control: no-cache' "${PUBLIC_SITE_URL%/}/sw.js?authority=${stamp}" || true)"
            index_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/authority-index.html -w '%{http_code}' -H 'cache-control: no-cache' "${PUBLIC_SITE_URL%/}/?authority=${stamp}" || true)"
            if [[ "${health_code}" == "200" && "${sw_code}" == "200" && "${index_code}" == "200" ]] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/authority-health.json', 'utf8'));
          const sw = fs.readFileSync('/tmp/authority-sw.js', 'utf8');
          const index = fs.readFileSync('/tmp/authority-index.html', 'utf8');
          const ready = health.status === 'ok'
            && health.service === 'ngeblogging-cloudflare'
            && health.release === '2026.07.25-production-audit-v37'
            && health.domainRelease === '2026.07.26-custom-domains-v41'
            && health.siteCapacity?.mode === 'dynamic'
            && health.analyticsCollector === true
            && sw.includes('ngeblogging-app-v43-20260726')
            && (index.includes('/src/studio-responsive-repair-v43.js') || index.includes('/assets/'));
          if (!ready) process.exit(1);
          NODE
            then
              echo "Domain otoritatif telah menyajikan Studio responsif v43 dan API produksi terbaru."
              exit 0
            fi
            echo "Percobaan ${attempt}/30 belum konsisten; menunggu propagasi edge."
            sleep 10
          done
          echo "Domain resmi masih belum menyajikan rilis v43 setelah rekonsiliasi."
          echo "Health terakhir:"; cat /tmp/authority-health.json 2>/dev/null || true
          echo "Service worker marker terakhir:"; grep -o 'ngeblogging-app-v[0-9][0-9]*-[0-9]*' /tmp/authority-sw.js 2>/dev/null | head -n 5 || true
          exit 1

      - name: Upload authoritative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-authoritative-domain-${{ github.run_id }}
          path: |
            /tmp/ngeblogging-authority-audit.json
            /tmp/authority-health.json
            /tmp/authority-sw.js
            /tmp/authority-index.html
          if-no-files-found: warn
          retention-days: 3

      - name: Mark authoritative reconciliation successful
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'success',
              context: 'Ngeblogging authoritative domain',
              description: 'DNS authority, Worker domains, routes, and live v43 release are consistent.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark authoritative reconciliation failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCTION_SHA,
              state: 'failure',
              context: 'Ngeblogging authoritative domain',
              description: 'DNS authority, Worker domain mapping, route ownership, or live v43 verification failed.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
