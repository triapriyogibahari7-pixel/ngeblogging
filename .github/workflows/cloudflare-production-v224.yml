name: Ngeblogging production v224 visible Theme actions and route cutover

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ngeblogging-production-v224
  cancel-in-progress: true

jobs:
  deploy-v224:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_NAME: ngeblogging.com
      CLOUDFLARE_WORKER_SERVICE: ngeblogging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
      VITE_PUBLIC_SITE_URL: https://ngeblogging.com
      WORKERS_DEV_SMOKE_TEST_URL: ${{ vars.WORKERS_DEV_SMOKE_TEST_URL || 'https://ngeblogging.triapriyogibahari7.workers.dev' }}
      TENANT_SMOKE_TEST_URL: ${{ vars.TENANT_SMOKE_TEST_URL || 'https://tri-apriyogi-bahari.ngeblogging.com' }}

    steps:
      - name: Checkout v224 production source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Cloudflare zone when repository variable is missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }
          if [[ ! "${CLOUDFLARE_ZONE_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            response="$(curl -fsS --connect-timeout 10 --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=${CLOUDFLARE_ZONE_NAME}&status=active&per_page=1")"
            zone="$(printf '%s' "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const id=x?.result?.[0]?.id||"";process.stdout.write(id)})')"
            [[ "${zone}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_RESOLVE_FAILED"; exit 1; }
            echo "CLOUDFLARE_ZONE_ID=${zone}" >> "${GITHUB_ENV}"
          fi

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID_INVALID"; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ZONE_ID_INVALID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 1; }

      - name: Run v224 regression and complete production suite
        id: regression
        run: |
          node scripts/patch-service-worker-v179.mjs
          node --test tests/studio-production-v224.test.mjs
          npm run test:production

      - name: Build production application
        id: build
        run: npm run build

      - name: Assert final v224 artifacts and bundle markers
        id: artifact_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release-v223.json
          test -f dist/release-v224.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("dist/release-v224.json","utf8"));if(x.release!=="studio-production-v224-20260803"||x.theme?.builtInThemesRequired!==100||x.theme?.widgetCountRequired!==26||x.theme?.explicitHtmlActionVisible!==true||x.theme?.explicitCssActionVisible!==true||x.theme?.explicitJavascriptActionVisible!==true||x.theme?.legacyV209ActionConflictRemoved!==true||x.theme?.physicalSmallFourLeftFourRight!==true||x.theme?.actualLineNumbersRetained!==true||x.theme?.codeLineLimitSupported!==10000||x.nara?.smallMediumNonModal!==true||x.nara?.attachmentMenuCameraPhotoFile!==true||x.domain?.physicalSmallActionsFullHorizontal!==true||x.auth?.forcedLogoutAdded!==false||x.claims?.massUserCapacityClaimed!==false)process.exit(1)'
          grep -R -q 'studio-production-v224-20260803' dist/assets
          grep -R -q 'html-css-javascript-visible' dist/assets
          grep -R -q 'compact-green-map' dist/assets
          grep -R -q '1-to-10000-actual' dist/assets
          grep -R -q 'viewport-visible' dist/assets
          grep -R -q 'outside-v209-direct-button-sweep' dist/assets

      - name: Build active-zone Wrangler configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-active-zone-wrangler.mjs wrangler.production.jsonc wrangler.production.active-zone.jsonc
          npx wrangler deploy --config wrangler.production.active-zone.jsonc --dry-run --outdir .wrangler-production-v224

      - name: Deploy Worker and v224 assets
        id: deploy
        run: npx wrangler deploy --config wrangler.production.active-zone.jsonc --keep-vars

      - name: Verify v224 on Workers.dev before route cutover
        id: workers_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)-${attempt}"
            body=/tmp/v224-workers.json
            headers=/tmp/v224-workers.headers
            code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${body}" -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v224.json?verify_v224=${stamp}" || true)"
            if [[ "${code}" == 200 ]] && ! grep -q 'WHITE-R4-2026.07.12' "${body}" "${headers}"; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v224-20260803"||x.theme?.explicitHtmlActionVisible!==true||x.theme?.explicitCssActionVisible!==true||x.theme?.explicitJavascriptActionVisible!==true||x.theme?.physicalSmallFourLeftFourRight!==true||x.nara?.attachmentMenuCameraPhotoFile!==true||x.auth?.persistSessionRequired!==true)process.exit(1)' "${body}"; then
                echo "WORKERS_DEV_V224_VERIFIED"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WORKERS_DEV_V224_VERIFY_FAILED"
          exit 1

      - name: Preserve compatibility routing before authoritative cutover
        id: compatibility
        run: node scripts/finalize-cloudflare-routes-v175.mjs

      - name: Cut over apex www and tenant wildcard to current Worker
        id: cutover
        run: node scripts/finalize-cloudflare-route-cutover-v182.mjs

      - name: Verify live apex auth Studio tenant and v224 marker
        id: live_verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            stamp="$(date +%s)-${attempt}"
            ok=true

            for path in / /login /signup /studio /release-v223.json /release-v224.json; do
              safe="$(printf '%s' "${path}" | tr '/.' '__')"
              body="/tmp/v224-live-${safe}.body"
              headers="/tmp/v224-live-${safe}.headers"
              code="$(curl -sS -L --connect-timeout 10 --max-time 25 -D "${headers}" -o "${body}" -w '%{http_code}' -H 'cache-control: no-cache' "https://ngeblogging.com${path}?verify_v224=${stamp}" || true)"
              [[ "${code}" == 200 ]] || ok=false
              if grep -q 'WHITE-R4-2026.07.12' "${body}" "${headers}"; then ok=false; fi

              if [[ "${path}" == "/release-v223.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v223-20260803")process.exit(1)' "${body}" || ok=false
              elif [[ "${path}" == "/release-v224.json" ]]; then
                node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v224-20260803"||x.deployment?.legacyWorkerMarkerRejected!=="WHITE-R4-2026.07.12"||x.theme?.legacyV209ActionConflictRemoved!==true||x.theme?.physicalSmallFourLeftFourRight!==true||x.nara?.attachmentMenuViewportVisible!==true||x.auth?.forcedLogoutAdded!==false)process.exit(1)' "${body}" || ok=false
              else
                grep -q 'id="root"' "${body}" || ok=false
              fi
            done

            tenant_body=/tmp/v224-tenant.html
            tenant_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o "${tenant_body}" -w '%{http_code}' -H 'cache-control: no-cache' "${TENANT_SMOKE_TEST_URL%/}/?verify_v224=${stamp}" || true)"
            [[ "${tenant_code}" == 200 ]] || ok=false
            if grep -q 'WHITE-R4-2026.07.12' "${tenant_body}"; then ok=false; fi

            workers_code="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/v224-workers-live.json -w '%{http_code}' -H 'cache-control: no-cache' "${WORKERS_DEV_SMOKE_TEST_URL%/}/release-v224.json?verify_v224=${stamp}" || true)"
            [[ "${workers_code}" == 200 ]] || ok=false
            if [[ "${workers_code}" == 200 ]]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.release!=="studio-production-v224-20260803")process.exit(1)' /tmp/v224-workers-live.json || ok=false
            fi

            if [[ "${ok}" == true ]]; then
              echo "PRODUCTION_V224_APEX_AUTH_STUDIO_TENANT_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_V224_LIVE_VERIFY_FAILED"
          exit 1

      - name: Publish v224 live status to commit
        if: always()
        uses: actions/github-script@v7
        env:
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const live = process.env.LIVE_OUTCOME;
            const state = live === 'success' ? 'success' : 'failure';
            const description = live === 'success'
              ? 'v224 live apex, auth, Studio, tenant and Workers.dev verified; legacy Worker rejected'
              : `v224 live gate failed (regression=${process.env.REGRESSION_OUTCOME}, build=${process.env.BUILD_OUTCOME}, deploy=${process.env.DEPLOY_OUTCOME}, live=${live})`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ngeblogging/production-v224',
              description: description.slice(0, 140),
            });
