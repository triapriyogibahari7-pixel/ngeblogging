name: HTML empty pane sizing v447
on:
  push:
    branches: [agent/editor-post-pages-v444-20261020]
  pull_request:
    paths: ['src/html-source-v446.css', 'src/editor-desktop-v445.css', 'tests/html-source-fill-v447.browser.mjs', '.github/workflows/html-source-fill-v447.yml']
permissions:
  contents: read
jobs:
  empty-pane-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/html-source-fill-v447.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-source-fill-report
          path: html-source-fill-report.json
          if-no-files-found: ignore
