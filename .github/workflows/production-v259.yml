name: Production v259 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-v259-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production regression and build gate
        run: npm run build

      - name: Verify v259 authority remains last after build activators
        run: node --test tests/studio-six-mode-authority-v259.test.mjs

      - name: Archive validated production bundle
        uses: actions/upload-artifact@v4
        with:
          name: ngeblogging-v259-production-dist
          path: dist
          if-no-files-found: error
          retention-days: 30
