name: Ngeblogging v228 regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/v228-regression.yml"

permissions:
  contents: read

concurrency:
  group: v228-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-v228:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Apply full production patch chain
        run: node scripts/patch-service-worker-v179.mjs
      - name: Run focused v228 regression
        run: node --test tests/studio-production-v228.test.mjs
      - name: Run existing production regression
        run: npm run test:production
      - name: Build production bundle
        run: npm run build
      - name: Assert v228 artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release-v228.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("dist/release-v228.json","utf8"));if(x.release!=="studio-production-v228-green-editor-nara-20260803"||x.theme?.builtInThemesRequired!==100||x.theme?.widgetCountRequired!==26||x.codeEditor?.actualLineNumbers!==true||x.nara?.cameraPhotoFile!==true||x.authentication?.v224SingleFlightDataReauthPreserved!==true||x.claims?.massCapacityClaimed!==false)process.exit(1)'
          grep -R -q 'studio-production-v228-green-editor-nara-20260803' dist
