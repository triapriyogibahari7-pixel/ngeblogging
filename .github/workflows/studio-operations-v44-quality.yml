name: Studio operations quality

on:
  push:
    branches: [fix/studio-operations-v44]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-operations-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run complete regression suite
        run: npm test

      - name: Validate production source contract
        run: node scripts/validate-production-v40.mjs

      - name: Build production bundle
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npm run cloudflare:dry-run
