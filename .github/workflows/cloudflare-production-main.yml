name: Cloudflare Workers production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngeblogging-cloudflare-compatibility-manual
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://polvmlrhqoiflumibfqs.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jqz6qDzX4IKSunPoDT5zyQ_sk6EK4W-' }}
  VITE_PUBLIC_SITE_URL: https://ngeblogging.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate production source
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const source = await readFile("src/CommentsPanelV124.jsx", "utf8");
          const workspace = source.indexOf('<section className="sv124-card sv124-comment-workspace">');
          const settings = source.indexOf('data-settings-placement="below-comment-workspace"');
          if (workspace < 0 || settings < 0 || settings <= workspace) throw new Error("COMMENTS_SETTINGS_LAYOUT_INVALID");
          if (source.indexOf("Pengaturan komentar", settings) < settings) throw new Error("COMMENTS_SETTINGS_ANCHOR_INVALID");
          console.log("COMMENTS_SETTINGS_LAYOUT_VERIFIED");
          NODE
      - name: Test approved catalog
        run: node --test tests/billing-catalog.test.mjs
      - name: Version application caches for this deployment
        run: node scripts/version-service-worker.mjs
      - name: Build production bundle
        run: npx vite build
      - name: Stamp deployment commit
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          if (!/^[a-f0-9]{40}$/i.test(process.env.GITHUB_SHA || "")) throw new Error("INVALID_DEPLOYMENT_COMMIT");
          const path = "dist/release-v344.json";
          const release = JSON.parse(await readFile(path, "utf8"));
          release.deployment_commit = process.env.GITHUB_SHA;
          await writeFile(path, JSON.stringify(release));
          NODE
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]]
          test -n "${CLOUDFLARE_API_TOKEN}"
      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.production.jsonc --keep-vars
      - name: Verify exact live commit and Midtrans prices
        run: node scripts/verify-midtrans-deployment.mjs
