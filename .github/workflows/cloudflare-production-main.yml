name: Cloudflare Workers production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngeblogging-cloudflare-compatibility-manual
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudflare-release-engine.yml
    secrets: inherit
