DECLARE target_site_id uuid; previous_hostname text; next_hostname text;
BEGIN
 target_site_id:=coalesce(NEW.site_id,OLD.site_id);
 previous_hostname:=CASE WHEN TG_OP='INSERT' THEN NULL ELSE OLD.hostname END;
 IF TG_OP<>'DELETE' AND NEW.status='active'::domain_status AND NEW.is_primary IS TRUE THEN
  UPDATE public.sites SET custom_domain=NEW.hostname,updated_at=now() WHERE id=NEW.site_id AND custom_domain IS DISTINCT FROM NEW.hostname;
  RETURN NEW;
 END IF;

 END IF;
 RETURN coalesce(NEW,OLD);
END;
